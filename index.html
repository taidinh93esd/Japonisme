function rowsOf(n, c){ if(n <= 0) return []; const rows = Math.ceil(n / c), base = Math.floor(n / rows), extra = n % rows; return Array.from({length: rows}, (_, i) => base + (i < extra ? 1 : 0)); }
function spanList(n, c){ const out = []; rowsOf(n, c).forEach(k => { for(let i = 0; i < k; i++) out.push(12 / k); }); return out; }
function spanAttr(n, i, cd, ct){ const d = spanList(n, cd), t = spanList(n, ct); return ` style="--sd:${d[i]};--st:${t[i]}"`; }
function qgrid(p, list, metaFn){ list = arr(list); const n = list.length, q = spanList(n, 2); return `<div class="qgrid${n > 1 ? ' two' : ''}">${list.map((x, i) => qcard(p, x, metaFn(it(x)), q[i])).join('')}</div>`; }
function gallery(items, layout){
  items = arr(items).map(x => typeof x === 'string' ? {img: x} : it(x)).filter(x => x.img && IMG[x.img]);
  const n = items.length; if(!n) return '';
  if(n === 1) return `<div class="gal one">${fig(items[0].img, items[0].caption, 'r43')}</div>`;
  const tc = n % 2 === 0 ? 2 : 3;
  if(layout === 'feature' && n >= 3){
    if(n - 3 !== 1){
      const sd = spanList(n - 3, 3), st = spanList(n - 1, tc);
      return `<div class="gal feat">${items.map((x, i) => i === 0
        ? fig(x.img, x.caption, 'r43', '--sd:8;--st:12', 'gbig')
        : fig(x.img, x.caption, 'r43', `--sd:${i < 3 ? 4 : sd[i-3]};--st:${st[i-1]}`)).join('')}</div>`;
    }
    const sd = spanList(n - 1, 3), st = spanList(n - 1, tc);
    return `<div class="gal feat">${items.map((x, i) => i === 0
      ? fig(x.img, x.caption, 'r21', '--sd:12;--st:12')
      : fig(x.img, x.caption, 'r43', `--sd:${sd[i-1]};--st:${st[i-1]}`)).join('')}</div>`;
  }
  const sd = spanList(n, 3), st = spanList(n, tc);
  return `<div class="gal">${items.map((x, i) => fig(x.img, x.caption, 'r43', `--sd:${sd[i]};--st:${st[i]}`)).join('')}</div>`;
}

// ---------- block helpers
function blockTitle(b){ if(!b) return ''; if(b.type === 'store') return b.name || b.title || ''; if(b.type === 'checks') return b.title || b.name || ''; return b.title || ''; }
function H(b, fallback){ const t = b.title || fallback || ''; return (b.kicker ? `<div class="kick">${esc(b.kicker)}</div>` : '') + (t ? `<h2>${fmt(t)}</h2>` : ''); }
function vgid(code){ return 'vg-' + String(code || '').replace(/[^A-Za-z0-9_-]/g, ''); }
function sumList(p, items, auto){
  return `<ol class="sum">${arr(items).map((x, i) => {
    x = it(x); let t = x.title || '', body = x.text || '';
    if(!t && auto){ const sp = splitLead(body); if(sp){ t = sp[0]; body = sp[1]; } }
    const s = sup(p, x.src);
    return `<li><span class="sn">${pad2(i+1)}</span><div class="sb">${t ? `<h3 class="st">${fmt(t)}${body ? '' : s}</h3>` : ''}${body ? `<p>${fmt(body)}${s}</p>` : (t ? '' : s)}</div></li>`;
  }).join('')}</ol>`;
}
function textBits(p, x){
  let h = '';
  if(x.text) h += `<p>${fmt(x.text)}${sup(p, x.src)}</p>`;
  h += arr(x.paras).map(y => `<p>${line(p, y)}</p>`).join('');
  if(arr(x.bullets).length) h += `<ul class="bl">${arr(x.bullets).map(y => `<li>${line(p, y)}</li>`).join('')}</ul>`;
  if(arr(x.facts).length) h += `<dl class="facts">${arr(x.facts).map(f => { f = it(f); return `<div><dt>${esc(f.label)}</dt><dd>${fmt(f.value != null ? f.value : f.text)}${sup(p, f.src)}</dd></div>`; }).join('')}</dl>`;
  if(!x.text && x.src && arr(x.src).length && !h) h += `<p>${sup(p, x.src)}</p>`;
  return h;
}
function qcard(p, x, meta, span){
  x = it(x);
  const orig = x.text || '', vi = x.vi || '';
  const two = vi && orig && vi !== orig;
  const sent = x.sentiment ? `<span class="sent ${esc(x.sentiment)}">${({positive:'Khen', negative:'Chê', mixed:'Lẫn lộn'})[x.sentiment] || 'Ý kiến'}</span>` : '';
  return `<figure class="q"${span ? ` style="--sq:${span}"` : ''}><blockquote><p class="qp">${fmt(two ? vi : (vi || orig))}</p>${two ? `<p class="qo">${esc(orig)}</p>` : ''}</blockquote><figcaption class="qby">${sent}${esc(meta.filter(Boolean).join(', '))}${sup(p, x.src)}</figcaption></figure>`;
}
const ARROW_H = `<svg class="ah-h" viewBox="0 0 44 14" aria-hidden="true"><path class="fw-a" d="M3,7 L33,7"/><path class="fw-ah" d="M32,1.5 L42,7 L32,12.5 z"/></svg>`;
const ARROW_V = `<svg class="ah-v" width="14" height="30" viewBox="0 0 14 30" aria-hidden="true"><path class="fw-a" d="M7,2 L7,20"/><path class="fw-ah" d="M1.5,19 L7,29 L12.5,19 z"/></svg>`;

const R = {
 summary(b, p){ return H(b) + sumList(p, b.items, false); },
 keypoints(b, p){ return H(b) + sumList(p, b.items, true); },
 text(b, p){ return H(b) + `<div class="prose">${arr(b.paras).map(x => `<p>${line(p, x)}</p>`).join('')}</div>`; },
 media(b, p){
   const im = b.img && IMG[b.img] ? fig(b.img, b.caption, 'r43') : '';
   const tx = textBits(p, b);
   return H(b) + (im ? `<div class="media${b.side === 'right' ? ' imgr' : ''}">${im}<div class="mtx">${tx}</div></div>` : `<div class="mtx">${tx}</div>`);
 },
 story(b, p){
   return H(b) + `<div class="story">${arr(b.items).map((x, i) => {
     x = it(x);
     const im = x.img && IMG[x.img] ? fig(x.img, x.caption, 'r43') : '';
     const tx = `${x.title ? `<h3>${fmt(x.title)}</h3>` : ''}${textBits(p, x)}${arr(x.gallery).length ? gallery(x.gallery) : ''}`;
     return im ? `<article class="media${i % 2 ? ' imgr' : ''}">${im}<div class="mtx">${tx}</div></article>` : `<article><div class="mtx">${tx}</div></article>`;
   }).join('')}</div>`;
 },
 timeline(b, p){
   return H(b) + `<ol class="tl">${arr(b.items).map(x => {
     x = it(x);
     const th = x.img && IMG[x.img] ? frame(x.img, x.caption || IMG[x.img].cap, 'tlth') : '';
     return `<li${th ? ' class="has-th"' : ''}><div class="tw">${esc(x.when)}</div><div class="tc">${x.title ? `<h3>${fmt(x.title)}</h3>` : ''}${x.text ? `<p>${fmt(x.text)}${sup(p, x.src)}</p>` : sup(p, x.src)}${Array.isArray(x.detail) && x.detail.length ? `<dl class="tld">${x.detail.map(r => `<div><dt>${esc(r[0])}</dt><dd>${fmt(r[1])}</dd></div>`).join('')}</dl>` : ''}${tags(x.tags)}</div>${th}</li>`;
   }).join('')}</ol>`;
 },
 years(b, p){
   return H(b) + `<div class="yrs">${arr(b.items).map(x => {
     x = it(x);
     const ev = String(x.evidence || '');
     const long = ev.length > 160;
     const s = sup(p, x.src);
     const good = x.good ? `<div class="yg"><span class="lab">Làm tốt</span><p>${fmt(x.good)}${(long && !x.bad) || (!ev && !x.bad) ? s : ''}</p></div>` : '';
     const bad = x.bad ? `<div class="yx"><span class="lab">Chưa tốt hoặc rủi ro</span><p>${fmt(x.bad)}${long || !ev ? s : ''}</p></div>` : '';
     const evh = !ev ? ((!x.good && !x.bad) ? `<p class="yev">${s}</p>` : '') : long
       ? `<details class="yev"><summary>Bằng chứng</summary><p>${fmt(ev)}</p></details>`
       : `<p class="yev">Bằng chứng: ${fmt(ev)}${s}</p>`;
     return `<div class="yr"><div class="yw">${esc(x.when)}</div><div class="yb">${good}${bad}${evh}</div></div>`;
   }).join('')}</div>`;
 },
 phases(b, p){
   const list = a => `<ul class="bl">${arr(a).map(d => `<li>${line(p, d)}</li>`).join('')}</ul>`;
   return H(b, 'Các giai đoạn') + `<div class="phs">${arr(b.items).map((x, i) => {
     x = it(x);
     const g = arr(x.good).length, bd = arr(x.bad).length;
     return `<article class="ph"><div><span class="ph-n">${i+1}</span></div><div class="ph-c">
       <header class="ph-h"><h3>${fmt(x.name)}</h3>${x.period ? `<span class="chip">${esc(x.period)}</span>` : ''}${x.summary ? '' : sup(p, x.src)}</header>
       ${x.summary ? `<p class="ph-sum">${fmt(x.summary)}${sup(p, x.src)}</p>` : ''}
       ${arr(x.did).length ? `<div class="ph-did"><span class="lab">Đã làm</span>${list(x.did)}</div>` : ''}
       ${g || bd ? `<div class="gb">${g ? `<div class="yg"><span class="lab">Làm tốt</span>${list(x.good)}</div>` : ''}${bd ? `<div class="yx"><span class="lab">Chưa tốt</span>${list(x.bad)}</div>` : ''}</div>` : ''}
       ${x.numbers ? `<div class="ph-num"><span class="lab">Con số</span><p>${fmt(x.numbers)}</p></div>` : ''}
       ${gallery(x.imgs, 'grid')}
       ${x.next ? `<div class="ph-next"><span class="lab">Quyết định mở giai đoạn sau</span><p>${fmt(x.next)}</p></div>` : ''}
     </div></article>`;
   }).join('')}</div>`;
 },
 flow(b, p){
   const steps = arr(b.steps).map(it); const n = steps.length;
   if(!n) return H(b);
   const avg = steps.reduce((a, s) => a + String(s.text || '').length + arr(s.bullets).map(y => it(y).text || '').join(' ').length, 0) / n;
   const cols = n <= 3 ? n : n === 4 ? (avg > 260 ? 2 : 4) : n <= 6 ? 3 : 4;
   const tpl = Array(cols).fill('minmax(0,1fr)').join(' 44px ');
   let k = 0, out = '';
   for(let r = 0; r * cols < n; r++){
     const chunk = steps.slice(r * cols, r * cols + cols);
     const cells = chunk.map((s, j) => {
       k++;
       const im = s.img && IMG[s.img] ? frame(s.img, s.caption || IMG[s.img].cap, 'r43') : '';
       const bl = arr(s.bullets).length ? `<ul class="bl sm">${arr(s.bullets).map(y => `<li>${line(p, y)}</li>`).join('')}</ul>` : '';
       return (j ? `<span class="farr" aria-hidden="true">${ARROW_H}${ARROW_V}</span>` : '') + `<div class="fstep"><div class="fb"><span class="fn">${k}</span>${s.title ? `<h3>${fmt(s.title)}</h3>` : ''}${s.text ? `<p>${fmt(s.text)}${sup(p, s.src)}</p>` : sup(p, s.src)}${bl}</div>${im}</div>`;
     }).join('');
     out += `<div class="frow" style="--tpl:${tpl}">${cells}</div>`;
     if((r + 1) * cols < n) out += `<div class="fturn" aria-hidden="true"><i></i>${ARROW_V}</div>`;
   }
   return H(b) + `<div class="flow" style="--cols:${cols}">${out}</div>${b.note ? `<p class="note">${fmt(b.note)}</p>` : ''}`;
 },
 mindmap(b, p){
   const br = arr(b.branches).map(it); const nl = Math.ceil(br.length / 2);
   const box = x => {
     const items = arr(x.items).map(y => it(y).text).filter(Boolean);
     return `<div class="mm-b"><h3>${fmt(x.title)}${items.length ? '' : sup(p, x.src)}</h3>${items.length ? `<ul>${items.map((y, j) => `<li>${fmt(y)}${j === items.length - 1 ? sup(p, x.src) : ''}</li>`).join('')}</ul>` : ''}</div>`;
   };
   const left = br.slice(0, nl), right = br.slice(nl);
   return H(b) + `<div class="mm${right.length ? '' : ' one'}"><div class="mm-side mm-l">${left.map(box).join('')}</div><div class="mm-c"><div class="mm-core"><b>${fmt(b.center)}</b>${b.sub ? `<span>${fmt(b.sub)}</span>` : ''}</div></div>${right.length ? `<div class="mm-side mm-r">${right.map(box).join('')}</div>` : ''}</div>`;
 },
 anatomy(b, p){
   const TONES = {art: 'Nghệ thuật, installation', sale: 'Bán hàng', service: 'Dịch vụ', back: 'Kho, hậu cần'};
   const zones = arr(b.zones).map(it);
   const tone = z => TONES[z.tone] ? z.tone : 'sale';
   const num = (v, d) => { v = Number(v); return Number.isFinite(v) ? v : d; };
   const r1 = v => Math.round(v * 100) / 100;
   const wrapW = (s, max) => { const lines = []; let cur = ''; String(s || '').split(/\s+/).filter(Boolean).forEach(w => { if(!cur) cur = w; else if((cur + ' ' + w).length <= max) cur += ' ' + w; else { lines.push(cur); cur = w; } }); if(cur) lines.push(cur); return lines; };
   const g = zones.map(z => {
     const x = Math.max(0, Math.min(96, num(z.x, 0))), y = Math.max(0, Math.min(56, num(z.y, 0)));
     const w = Math.max(4, Math.min(100 - x, num(z.w, 20))), h = Math.max(4, Math.min(60 - y, num(z.h, 15)));
     const lh = 2.3, maxc = Math.max(3, Math.floor((w - 3.2) / 1.02));
     let lines = wrapW(z.name, maxc);
     const room = Math.max(0, Math.floor((h - 7.4 - (z.share ? 2 : 0)) / lh) + 1);
     if(lines.length > room){ lines = lines.slice(0, room); if(lines.length) lines[lines.length - 1] += '...'; }
     return `<g class="az az-${tone(z)}"><rect x="${r1(x + .35)}" y="${r1(y + .35)}" width="${r1(w - .7)}" height="${r1(h - .7)}" rx="1.2"/><text class="az-id" x="${r1(x + 1.8)}" y="${r1(y + 1.7)}" dominant-baseline="hanging">${esc(z.id || '')}</text>${lines.map((l, k) => `<text class="az-nm" x="${r1(x + 1.8)}" y="${r1(y + 6.6 + k * lh)}" dominant-baseline="hanging">${esc(l)}</text>`).join('')}${z.share && h >= 9 && w >= 12 ? `<text class="az-sh" x="${r1(x + w - 1.7)}" y="${r1(y + h - 1.7)}" text-anchor="end">${esc(z.share)}</text>` : ''}</g>`;
   }).join('');
   let door = '', doorLab = '';
   const e = b.entrance && typeof b.entrance === 'object' ? b.entrance : null;
   if(e){
     const ex = Math.max(0, Math.min(100, num(e.x, 50))), ey = Math.max(0, Math.min(60, num(e.y, 60)));
     const edge = ey >= 59 ? 'b' : ey <= 1 ? 't' : ex <= 1 ? 'l' : ex >= 99 ? 'r' : 'b';
     if(edge === 'b' || edge === 't'){
       const yy = edge === 'b' ? 60 : 0, d = edge === 'b' ? -1 : 1;
       door = `<line class="ad" x1="${r1(ex - 5)}" y1="${yy}" x2="${r1(ex + 5)}" y2="${yy}"/><path class="adh" d="M${r1(ex - 1.7)},${r1(yy + d * 1.1)} L${r1(ex + 1.7)},${r1(yy + d * 1.1)} L${r1(ex)},${r1(yy + d * 3.9)} z"/>`;
       const lx = Math.max(8, Math.min(92, ex));
       doorLab = `<div class="an-door" style="left:${lx}%;${edge === 't' ? 'top:auto;bottom:calc(100% + 8px)' : ''}">Lối vào</div>`;
     } else {
       const xx = edge === 'l' ? 0 : 100, d = edge === 'l' ? 1 : -1;
       door = `<line class="ad" x1="${xx}" y1="${r1(ey - 5)}" x2="${xx}" y2="${r1(ey + 5)}"/><path class="adh" d="M${r1(xx + d * 1.1)},${r1(ey - 1.7)} L${r1(xx + d * 1.1)},${r1(ey + 1.7)} L${r1(xx + d * 3.9)},${r1(ey)} z"/>`;
       doorLab = `<div class="an-door" style="left:50%">Lối vào ở cạnh ${edge === 'l' ? 'trái' : 'phải'}</div>`;
     }
   }
   const used = Object.keys(TONES).filter(t => zones.some(z => tone(z) === t));
   const note = b.note && /sơ đồ minh họa/i.test(b.note) ? b.note : ('Sơ đồ minh họa' + (b.note ? '. ' + b.note : ', cần kiểm chứng tại store'));
   return H(b) + `<p class="an-note">${fmt(note)}</p><div class="an-plan"><svg viewBox="0 0 100 60" role="img" aria-label="${esc((b.title || 'Sơ đồ khu vực') + ', sơ đồ minh họa')}"><rect class="an-out" x=".2" y=".2" width="99.6" height="59.6" rx="1.4"/>${g}${door}</svg>${doorLab}</div><div class="an-keys">${used.map(t => `<span class="ak"><i class="az-${t}"></i>${TONES[t]}</span>`).join('')}</div><ol class="an-leg">${zones.map(z => `<li><span class="al-id az-${tone(z)}">${esc(z.id || '')}</span><div><b>${fmt(z.name)}</b>${z.share ? `<span class="al-sh">${esc(z.share)}</span>` : ''}${z.text ? `<p>${fmt(z.text)}${sup(p, z.src)}</p>` : sup(p, z.src)}</div></li>`).join('')}</ol>`;
 },
 principles(b, p){
   const N = arr(b.items).length;
   return H(b) + `<div class="grid3">${arr(b.items).map((x, i) => {
     x = it(x);
     const im = x.img && IMG[x.img] ? frame(x.img, x.caption || IMG[x.img].cap, 'r32') : '';
     const rule = x.rule || x.text || '';
     return `<article class="card pc"${spanAttr(N, i, 3, 2)}>${im}<div class="cb"><span class="pn">${pad2(i+1)}</span>${x.title ? `<h3>${fmt(x.title)}</h3>` : ''}${rule ? `<p class="rule">${fmt(rule)}${x.why ? '' : sup(p, x.src)}</p>` : ''}${x.why ? `<p class="why"><b>Vì sao:</b> ${fmt(x.why)}${sup(p, x.src)}</p>` : (rule ? '' : sup(p, x.src))}</div></article>`;
   }).join('')}</div>`;
 },
 cards(b, p){
   const gl = b.goodLabel || 'Điểm mạnh', bl = b.badLabel || 'Điểm yếu';
   const N = arr(b.items).length;
   return H(b) + `<div class="grid3">${arr(b.items).map((x, i) => {
     x = it(x);
     const im = x.img && IMG[x.img] ? frame(x.img, x.caption || IMG[x.img].cap, 'r32') : '';
     const s = sup(p, x.src);
     const last = x.bad ? 'bad' : x.good ? 'good' : 'text';
     return `<article class="card"${spanAttr(N, i, 3, 2)}>${im}<div class="cb">${x.title ? `<h3>${fmt(x.title)}</h3>` : ''}${x.meta ? `<p class="meta">${fmt(x.meta)}</p>` : ''}${x.text ? `<p>${fmt(x.text)}${s}</p>` : (last === 'text' ? s : '')}${x.good ? `<div class="cgb g"><span class="lab">${esc(gl)}</span><p>${fmt(x.good)}${!x.text && last === 'good' ? s : ''}</p></div>` : ''}${x.bad ? `<div class="cgb b"><span class="lab">${esc(bl)}</span><p>${fmt(x.bad)}${!x.text ? s : ''}</p></div>` : ''}${tags(x.badges)}</div></article>`;
   }).join('')}</div>`;
 },
 compare(b, p){
   const L = b.left || 'A', Rr = b.right || 'B';
   return H(b) + `<div class="cmp"><div class="cmp-h" aria-hidden="true"><div></div><div>${esc(L)}</div><div>${esc(Rr)}</div></div>${arr(b.rows).map(r => { r = it(r); return `<div class="cmp-r"><div class="cmp-l">${fmt(r.label)}</div><div class="cmp-a" data-h="${esc(L)}">${fmt(r.left)}</div><div class="cmp-b" data-h="${esc(Rr)}">${fmt(r.right)}${sup(p, r.src)}</div></div>`; }).join('')}</div>${b.note ? `<p class="note">${fmt(b.note)}</p>` : ''}`;
 },
 dodont(b, p){
   const col = (cls, t, list, ic) => arr(list).length ? `<div class="dd-c ${cls}"><h3 class="dd-t">${esc(t)}</h3><ul>${arr(list).map(x => `<li><span class="ic ${ic}" aria-hidden="true"></span><span>${line(p, x)}</span></li>`).join('')}</ul></div>` : '';
   return H(b) + `<div class="dd">${col('do', b.doTitle || 'Nên làm', b.do, 'ok')}${col('dont', b.dontTitle || 'Không làm', b.dont, 'no')}</div>`;
 },
 table(b, p){
   const cols = arr(b.columns).map(c => it(c).text != null ? it(c).text : String(c));
   const rows = arr(b.rows).map(r => arr(r));
   const n = Math.max(cols.length, ...rows.map(r => r.length), 1);
   let w = arr(b.widths).map(Number).filter(x => x > 0);
   if(w.length !== n){
     const avg = Array.from({length: n}, (_, j) => { let t = 0, c = 0, mx = 0; rows.forEach(r => { const v = r[j]; if(v != null && v !== ''){ const L = String(it(v).text || '').length; t += L; c++; mx = Math.max(mx, L); } }); return Math.max((c ? t / c : 0) + .15 * Math.min(mx, 200), String(cols[j] || '').length * .9, 4); });
     const lo = Math.min(10, 100 / n), hi = Math.max(45, 100 / n), est = Math.max(980, n * 128);
     // floor per column: its longest word (header included) must fit without breaking mid-word
     const wordMin = Array.from({length: n}, (_, j) => { let m = 0; [cols[j]].concat(rows.map(r => r[j])).forEach(v => { String(v == null ? '' : it(v).text || '').split(/\s+/).forEach(wd => { m = Math.max(m, wd.length); }); }); return Math.min(hi, (Math.min(m, 24) * 8.6 + 34) / est * 100); });
     w = avg.slice();
     for(let k = 0; k < 12; k++){ const s = w.reduce((a, v) => a + v, 0); w = w.map((v, j) => Math.min(hi, Math.max(lo, wordMin[j], v / s * 100))); }
   }
   const sum = w.reduce((a, v) => a + v, 0) || 1; w = w.map(v => v / sum * 100);
   const cg = `<colgroup>${w.map(v => `<col style="width:${v.toFixed(2)}%">`).join('')}</colgroup>`;
   const head = cols.length ? `<thead><tr>${Array.from({length: n}, (_, j) => `<th scope="col">${esc(cols[j] || '')}</th>`).join('')}</tr></thead>` : '';
   const body = rows.map(r => `<tr>${Array.from({length: n}, (_, j) => { const v = r[j]; const x = it(v); return `<td data-l="${esc(cols[j] || '')}">${v == null ? '' : fmt(x.text) + sup(p, x.src)}</td>`; }).join('')}</tr>`).join('');
   const minw = n >= 7 ? ` style="min-width:${n * 128}px"` : '';
   const foot = (b.note || arr(b.src).length) ? `<p class="note">${fmt(b.note || '')}${sup(p, b.src)}</p>` : '';
   return H(b) + `<div class="tbl"><table${n >= 6 ? ' class="dense"' : ''}${minw}>${cg}${head}<tbody>${body}</tbody></table></div>${foot}`;
 },
 stats(b, p){
   const items = arr(b.items).map(it), n = items.length;
   const sd = spanList(n, n === 4 ? 4 : 3), st = spanList(n, 2);
   return H(b) + `<div class="stats">${items.map((x, i) => `<div class="stat" style="--sd:${sd[i]};--st:${st[i]}"><div class="sv">${esc(x.value)}</div><div class="sl">${fmt(x.label)}${sup(p, x.src)}</div></div>`).join('')}</div>`;
 },
 quotes(b, p){ return H(b) + qgrid(p, b.items, x => [x.who, x.where, x.date]); },
 gallery(b, p){ return H(b) + gallery(b.items, b.layout); },
 callout(b, p){
   const tone = ['info', 'good', 'warn', 'risk'].includes(b.tone) ? b.tone : 'info';
   const items = arr(b.items);
   return `<aside class="co co-${tone}">${b.kicker ? `<div class="kick">${esc(b.kicker)}</div>` : ''}${b.title ? `<h3 class="co-t"><span class="co-i" aria-hidden="true"></span>${fmt(b.title)}</h3>` : ''}<ul class="co-l${items.length >= 4 ? ' cols' : ''}">${items.map(x => `<li>${line(p, x)}</li>`).join('')}</ul></aside>`;
 },
 store(b, p){
   const imgs = arr(b.imgs).filter(id => IMG[id]);
   const sec = (t, a, fn) => arr(a).length ? `<section class="st-sec"><h3 class="lab">${t}</h3>${fn(arr(a).map(it))}</section>` : '';

function renderNav(active){
  document.getElementById('nav').innerHTML = NAV.map(g => `<div class="navg"><h4>${esc(g.group)}</h4>${arr(g.items).map(i => `<a href="#${esc(i.id)}"${i.id === active ? ' aria-current="page"' : ''}>${esc(i.title)}</a>`).join('')}</div>`).join('');

function scrollToTarget(t){
  const el = t && document.getElementById(t);
  if(!el) return false;
  el.scrollIntoView({block: 'start', behavior: REDUCED ? 'auto' : 'smooth'});
  return true;
}
function renderPage(id, target){
  const p = P[id] || P.overview || P[Object.keys(P)[0]];
  if(!p){ view.innerHTML = '<p class="muted">Chưa có nội dung.</p>'; return; }
  id = p.page || id; CUR = id; ONPAGE = true;
  renderNav(id);
  const blocks = arr(p.blocks);
  const titled = [];
  const body = blocks.map((b, i) => {
    const fn = b && R[b.type]; if(!fn) return '';
    let h = ''; try { h = fn(b, p); } catch(err){ return ''; }
    if(!h) return '';
    const t = blockTitle(b);
    if(t) titled.push({i, t});
    const hd = t && b.type !== 'callout';
    return `<section class="block t-${esc(b.type)}${hd ? ' hd' : ''}" id="${esc(id)}-b${i}">${h}</section>`;
  }).join('');
  const toc = titled.length >= 4 ? `<nav class="toc" aria-label="Trên trang này"><div class="toc-h">Trên trang này</div><div class="toc-c">${titled.map(x => `<a class="tchip" href="#${esc(id)}" data-target="${esc(id)}-b${x.i}" title="${esc(x.t)}">${esc(x.t)}</a>`).join('')}</div></nav>` : '';
  const srcs = (arr(p.sources).length && id !== 'sources') ? `<details class="srcs"><summary>Nguồn của trang này (${p.sources.length})</summary><ol class="srcl">${p.sources.map(s => `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name)}${s.date ? `, ${esc(s.date)}` : ''}</li>`).join('')}</ol></details>` : '';
  view.innerHTML = `<header class="pg-head">${p.group ? `<div class="eyebrow">${esc(p.group)}</div>` : ''}<h1>${esc(p.title)}</h1>${p.lead ? `<p class="lead">${fmt(p.lead)}</p>` : ''}${toc}</header>${body}${srcs}<div class="foot">Cập nhật ${esc(DATA.built)}. ${esc((DATA.site||{}).foot||'')}</div>`;
  document.getElementById('topTitle').textContent = p.title;
  document.title = p.title + ', ' + ((DATA.site||{}).name || '');
  initAnimFlows(); if(id === 'verify') initVerifyUI();
  if(target){ const el = document.getElementById(target); if(el){ el.scrollIntoView({block: 'start'}); return; } }
  window.scrollTo(0, 0);
}


// ---------- animated flowcharts
let AF_TIMERS = [], AF_OBS = null;
function initAnimFlows(){
  AF_TIMERS.forEach(clearInterval); AF_TIMERS = [];
  if(AF_OBS){ AF_OBS.disconnect(); AF_OBS = null; }
  const boxes = [...view.querySelectorAll('.af[data-af]')];
  if(!boxes.length) return;
  const ctrls = boxes.map(box => {
    const cfg = JSON.parse(box.getAttribute('data-af'));
    const n = cfg.steps.length, svg = box.querySelector('svg'), dots = box.querySelector('.af-dots');
    const playBtn = box.querySelector('.af-play'), cnt = box.querySelector('.af-cnt');
    const lis = [...box.querySelectorAll('.af-steps li')];
    let i = -1, timer = null, userPaused = false;
    function show(k){
      i = k;
      const on = new Set(k >= 0 ? cfg.steps[k] : []);
      box.classList.toggle('dim', k >= 0);
      svg.querySelectorAll('.af-n,.af-e').forEach(g => g.classList.toggle('on', on.has(g.dataset.k)));
      svg.querySelectorAll('.af-e').forEach(g => {
        const p = g.querySelector('path'); const r = g.classList.contains('risk');
        p.setAttribute('marker-end', `url(#${cfg.uid}-a${on.has(g.dataset.k) ? (r ? '-risk' : '-on') : ''})`);
      });
      dots.innerHTML = REDUCED ? '' : [...svg.querySelectorAll('.af-e.on')].map(g => `<circle class="af-dot${g.classList.contains('risk') ? ' risk' : ''}" r="6"><animateMotion dur="1.4s" repeatCount="indefinite" path="${g.dataset.d}"/></circle>`).join('');
      lis.forEach((li, j) => li.classList.toggle('on', j === k));
      cnt.textContent = k >= 0 ? `Bước ${k + 1}/${n}` : `${n} bước`;
    }
    function stop(){ if(timer){ clearInterval(timer); AF_TIMERS = AF_TIMERS.filter(t => t !== timer); timer = null; } playBtn.textContent = 'Phát'; playBtn.setAttribute('aria-pressed', 'false'); }
    function play(){ if(timer) return; if(i < 0 || i >= n - 1) show(0); timer = setInterval(() => { if(i >= n - 1){ show(-1); setTimeout(() => { if(timer) show(0); }, 1400); } else show(i + 1); }, 2600); AF_TIMERS.push(timer); playBtn.textContent = 'Tạm dừng'; playBtn.setAttribute('aria-pressed', 'true'); }
    playBtn.addEventListener('click', () => { if(timer){ stop(); userPaused = true; } else { userPaused = false; play(); } });
    box.querySelector('.af-prev').addEventListener('click', () => { stop(); userPaused = true; show(i <= 0 ? n - 1 : i - 1); });
    box.querySelector('.af-next').addEventListener('click', () => { stop(); userPaused = true; show(i >= n - 1 ? 0 : i + 1); });
    box.querySelectorAll('.af-steps button').forEach(bt => bt.addEventListener('click', () => { stop(); userPaused = true; show(+bt.dataset.i); }));
    return {box, play, stop, get userPaused(){ return userPaused; }};
  });
  if(REDUCED || !('IntersectionObserver' in window)) return;
  AF_OBS = new IntersectionObserver(ents => ents.forEach(en => {
    const c = ctrls.find(x => x.box === en.target); if(!c) return;
    if(en.isIntersecting && !c.userPaused) c.play(); else if(!en.isIntersecting) c.stop();
  }), {threshold: .45});
  ctrls.forEach(c => AF_OBS.observe(c.box));
}
// ---------- search (diacritic-insensitive)
let INDEX = null;
const SKIP = ['src','hsrc','img','imgs','type','tone','url','id','code','side','layout','widths','sentiment','gid','_gid','entrance','file'];
function buildIndex(){
  INDEX = [];
  const push = (pid, bi, text) => { if(text && typeof text === 'string') INDEX.push({pid, bi, text, n: norm(text)}); };
  const walk = (pid, bi, o) => {
    if(typeof o === 'string') return push(pid, bi, o);
    if(Array.isArray(o)) return o.forEach(v => walk(pid, bi, v));
    if(o && typeof o === 'object') for(const k in o){ if(SKIP.includes(k)) continue; walk(pid, bi, o[k]); }
  };
  for(const pid in P){ const p = P[pid]; push(pid, -1, p.title + '. ' + (p.lead || '')); arr(p.blocks).forEach((b, i) => walk(pid, i, b)); }
}
function doSearch(q){
  if(!INDEX) buildIndex();
  const nq = norm(q).trim();
  if(nq.length < 2){ renderPage(CUR || 'overview'); return; }
  ONPAGE = false;
  const terms = nq.split(/\s+/);
  const hits = INDEX.filter(e => terms.every(t => e.n.includes(t))).slice(0, 80);
  const hl = s => { let out = esc(s); terms.forEach(t => { if(!t) return; const ns = norm(s); const i = ns.indexOf(t); if(i >= 0){ const orig = s.substr(i, t.length); out = out.replace(esc(orig), `<mark>${esc(orig)}</mark>`); } }); return out; };

    }
  } else { lsSet(); }
}
(async function initStore(){
  try { DB = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch(e){ DB = null; }
  try { const u = window.claude && window.claude.use ? await window.claude.use('user') : null; UID = u ? await u.id() : null; CANWRITE = u && u.can ? await u.can('data.write') : null; } catch(e){ UID = null; }

    MODE = CANWRITE === false ? 'view' : 'db';

      if(CUR === 'verify') initVerifyUI();
    }, err => { MODE = 'local'; Object.assign(STATE, lsGet()); if(CUR === 'verify') initVerifyUI(); });
  } else {
    MODE = 'local'; Object.assign(STATE, lsGet());
  }
  if(CUR === 'verify') initVerifyUI();
})();

route();
})();
