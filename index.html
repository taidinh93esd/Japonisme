g cong mọc như thân cây. Tranh và đồ thủ công Nhật cung cấp kho motif thực vật, côn trùng và cách để một nhành cây chiếm trọn bề mặt."], "src": [5], "img": "redon-eye", "caption": "Redon, 1882: Tượng trưng không tả thế giới mà gợi giấc mơ."}, {"title": "4. Vì sao Nhật là ‘mô hình sẵn’", "paras": ["Các lối thoát khác đều phải tự xây từ đầu: cái nguyên sơ của Gauguin là tưởng tượng, giấc mơ của Tượng trưng không có quy tắc vẽ. Nghệ thuật Nhật thì đã là một hệ thống hoàn chỉnh, có kỹ thuật, có quy ước bố cục, có hàng nghìn tác phẩm mua được ở Paris với giá rẻ. Nó vừa đủ khác để thay thế hệ hình cũ, vừa đủ cụ thể để học ngay."], "src": [5], "img": "expo1878-japon", "caption": "Khu Nhật Bản ở Triển lãm 1878: một hệ thống nghệ thuật hoàn chỉnh, bày bán ngay giữa Paris."}, {"title": "5. Giới hạn của cách giải thích này", "paras": ["Mô hình ‘khủng hoảng hệ hình’ giải thích tốt câu hỏi vì sao là lúc này: đồ Nhật đã có ở châu Âu hai thế kỷ, chỉ đến 1860–90 mới được học. Nhưng nó cần được bổ sung bằng ít nhất hai yếu tố."], "bullets": ["Thị trường: sau 1858, khối lượng tranh và đồ Nhật tăng vọt, giá rẻ, có nhà buôn chuyên nghiệp (Hayashi, Bing) và triển lãm thế giới quảng bá. Không có nguồn hàng này, khủng hoảng không có chỗ để tìm lời giải.", "Phóng chiếu: ‘Nhật Bản’ của Paris phần lớn là hình ảnh châu Âu tự vẽ ra để đáp ứng nhu cầu của mình: hồn nhiên, gần thiên nhiên, chưa bị hiện đại làm hỏng. Từ góc nhìn của Edward Said (‘Orientalism’, 1978), đây cũng là một dạng phương Đông luận, dù mang thái độ ngưỡng mộ."], "src": [5], "img": "beato-shamisen", "caption": "Ảnh Beato bán cho khách Tây: một nước Nhật được dàn dựng theo mong đợi của châu Âu."}]}, {"type": "gallery", "title": "Tư liệu lịch sử cho ba lớp khủng hoảng", "items": [{"img": "schopenhauer", "caption": "Triết học: Schopenhauer, 1859. ‘Thế giới như ý chí và biểu tượng’ được giới nghệ sĩ Pháp đọc nhiều từ thập niên 1880."}, {"img": "marville-opera", "caption": "Xã hội: Paris bị đục phá để mở đại lộ Opéra, khoảng 1876–77 (ảnh Marville)."}, {"img": "morris-strawberry", "caption": "Xã hội: William Morris (Arts and Crafts) phản đối hàng công nghiệp bằng vải in thủ công, 1883."}, {"img": "gauguin-vision", "caption": "Nghệ thuật: Gauguin, Thị kiến sau bài giảng, 1888: mảng phẳng, thân cây chéo theo lối Hiroshige."}, {"img": "japon-artistique", "caption": "Mô hình sẵn: tạp chí Le Japon artistique của Bing (1888–91) đưa hình mẫu Nhật đến khắp châu Âu."}], "src": [5]}, {"type": "table", "title": "Tóm tắt: khủng hoảng, nhu cầu và điều tranh Nhật cung cấp", "columns": ["Lớp khủng hoảng", "Nhu cầu mới", "Tranh Nhật cung cấp", "Ví dụ"], "widths": [18, 26, 30, 26], "rows": [["Triết học", "Thoát khỏi một con mắt lý tính cố định; nắm bắt khoảnh khắc, trực giác", "Góc nhìn di động, khoảnh khắc phù du, con người hoà vào cảnh", "Degas, Chân dung Diego Martelli; Monet, vẽ theo loạt"], ["Xã hội", "Hàn gắn nghệ thuật và đời sống, chống hàng công nghiệp vô hồn", "Đồ dùng thường ngày cũng là nghệ thuật; không thứ bậc mỹ thuật và trang trí", "Bộ Service Rousseau; Gallé; Wiener Werkstätte"], ["Nghệ thuật", "Ngôn ngữ hình mới: nguyên sơ, gợi tả, sức sống thực vật", "Mảng phẳng, viền đậm, giản lược, khoảng trống, motif cây cỏ", "Gauguin, Thị kiến sau bài giảng; Klimt; Horta"]], "src": [5]}]}, "principles": {"page": "principles", "title": "8 thủ pháp học từ Nhật", "group": "Ngôn ngữ thị giác", "lead": "Đây là phần “giọt máu” mà người giảng muốn người nghe nhận ra được trong hầu hết tranh và điêu khắc châu Âu từ 1860 đến 1910.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2”, phút 28 đến 38", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 2/2”, phút 22 đến 46", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Video 1, phút 34:05: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=2045s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, phút 24:46: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=1486s", "date": "Art d'Histoire, 2018"}, {"name": "Video 1, phút 37:20: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=2240s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, phút 32:05: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=1925s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, phút 43:46: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=2626s", "date": "Art d'Histoire, 2018"}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài hai bài giảng, do người tổng hợp biên soạn", "date": ""}], "blocks": [{"type": "principles", "title": "8 thủ pháp", "items": [{"title": "Cận cảnh cắt cúp", "rule": "Phóng to một mảnh, cắt bỏ phần còn lại.", "why": "Hiroshige cho thấy một khúc cầu; Monet, Whistler cũng cận cảnh cây cầu. Đĩa Rousseau vẽ ba phần tư con cá, phần kia “ở mặt sau đĩa”.", "img": "whistler-nocturne"}, {"title": "Tiền cảnh bị cắt", "rule": "Một cành cây, cây cột, con la che ngay trước mắt.", "why": "Monet đặt chân cầu chắn tầm nhìn; Degas cắt thùng rác, người đội mũ ở mép tranh.", "img": "hiro-kameido"}, {"title": "Bố cục đường chéo", "rule": "Đường chéo kéo mắt mạnh vào sâu hoặc ra ngoài tranh.", "why": "Tạo nhịp và lực hút. Có ở Munch (Tiếng thét, Thiếu nữ trên cầu), Kirchner, Degas, Lautrec.", "img": "hiro-ohashi"}, {"title": "Nghệ thuật khoảng trống", "rule": "Một bên rỗng, một bên dồn chi tiết.", "why": "Hokusai dồn đám đông vào vài centimet, phần còn lại trống. Bonnard để trống một phần tư bình phong.", "img": "degas-dancers"}, {"title": "Mảng màu phẳng", "rule": "Xếp chồng các mảng một màu, không đánh khối.", "why": "Carl Thiemann, Degas (Place de la Concorde như một bức tường vàng), Bonnard giả lối in khắc gỗ bằng sơn.", "img": "degas-concorde"}, {"title": "Góc nhìn di động", "rule": "Mỗi phần tranh nhìn từ một độ cao khác nhau, sàn dốc lên.", "why": "Như “máy quay di động”. Chân dung Diego Martelli (1879): ghế nhìn thẳng, sàn nhìn từ trên xuống.", "img": "degas-martelli"}, {"title": "Arabesque: lặp có biến thể", "rule": "Lặp một motif, mỗi lần hơi khác.", "why": "Hàng thân cây của Hiroshige, Hokusai; ba vũ nữ của Degas; cỗ xe ngựa của Bonnard.", "img": "katagami"}, {"title": "Silhouette và đường viền", "rule": "Hình đen trên nền sáng, nét bao quanh mảng một màu.", "why": "Bóng sau vách giấy Nhật. Lautrec biến ca sĩ Aristide Bruant thành một mảng đen, Yvette Guilbert chỉ còn đôi găng tay.", "img": "lautrec-goulue"}], "src": [0, 1]}, {"type": "story", "title": "Đọc sâu: mỗi thủ pháp, thêm ví dụ ở châu Âu", "items": [{"title": "Đường chân trời cao, nhìn từ trên xuống", "paras": ["Tranh Nhật thường đặt người xem ở trên cao, mặt đất dựng đứng thành một mảng. Monet dùng điều này trong ‘Sân thượng ở Sainte-Adresse’ (1867), bức ông tự gọi đùa là ‘tranh Tàu có cờ’. Caillebotte, Pissarro vẽ đại lộ Paris nhìn từ cửa sổ tầng cao, người đi đường thành chấm nhỏ."], "src": [7]}, {"title": "Mảng phẳng, viền đậm: từ Nhật đến chủ nghĩa ‘cloisonnisme’", "paras": ["Năm 1887–88, Émile Bernard và Louis Anquetin vẽ mảng màu phẳng viền đen, được nhà phê bình Édouard Dujardin đặt tên ‘cloisonnisme’ (như men cloisonné). Họ nói rõ nguồn là tranh khắc Nhật và kính màu. Gauguin dùng cách này trong ‘Thị kiến sau bài giảng’ (1888): nền đỏ phẳng, thân cây chéo cắt đôi tranh như trong Hiroshige.", "Nhóm Nabis (Sérusier, Bonnard, Vuillard, Maurice Denis) đẩy xa hơn. Câu nổi tiếng của Denis (1890): bức tranh, trước khi là con ngựa hay người đàn bà, là một mặt phẳng phủ màu sắp xếp theo một trật tự nhất định."], "src": [7]}, {"title": "Vẽ theo loạt", "paras": ["Hokusai vẽ Phú Sĩ 36 lần, Hiroshige vẽ 53 trạm trên đường Tōkaidō. Ý tưởng một đề tài, nhiều góc, nhiều thời điểm xuất hiện ở loạt Đụn rơm (1890–91) và Nhà thờ Rouen của Monet. Henri Rivière làm hẳn ‘Ba mươi sáu cảnh tháp Eiffel’ (in năm 1902), chép nguyên tên bộ tranh của Hokusai."], "src": [7]}, {"title": "Khổ tranh mới", "paras": ["Khổ dọc hẹp như kakemono và tranh cột (hashira-e), quạt tròn, bình phong nhiều tấm được hoạ sĩ châu Âu thử nghiệm. Ở triển lãm Ấn tượng lần thứ 4 (1879) có cả một phòng tranh quạt của Degas, Pissarro, Forain. Bonnard và Vuillard vẽ bình phong gấp; Whistler thiết kế khung tranh như một phần tác phẩm."], "src": [7]}, {"title": "Khoảng trống có nghĩa", "paras": ["Trong tranh Nhật, nền giấy để trắng là sương, nước, tuyết hay không khí. Với hội hoạ hàn lâm, mặt tranh phải được phủ kín. Whistler, rồi Klimt và các nhà thiết kế Art Nouveau học cách để trống một phần lớn bề mặt, coi khoảng trống là một thành phần bố cục."], "src": [7]}]}, {"type": "media", "kicker": "Case study · Video 1, phút 34:05", "title": "Cận cảnh cắt cúp: Whistler đặt cạnh Hiroshige", "img": "v1-2045", "caption": "Trái: Whistler, Nocturne cầu Battersea cũ. Phải: Hiroshige, cầu Kyōbashi · phút 34:05", "text": "Châu Âu vẫn vẽ cầu, nhưng như một chi tiết giữa phong cảnh rộng, kèm phế tích, đôi tình nhân. Ở đây cả hai chỉ còn cây cầu, cận cảnh, trụ cầu cắt ngang mép trên. Người giảng chỉ thêm người chèo đứng trên thuyền ở bản Whistler: tư thế rất Nhật.", "bullets": ["Thủ pháp 1: cận cảnh cắt cúp.", "Màu gần đơn sắc gợi đồ sơn mài."], "src": [2]}, {"type": "media", "kicker": "Case study · Video 2, phút 24:46", "title": "Tiền cảnh bị cắt: Degas đặt cạnh Hiroshige", "img": "v2-1486", "caption": "Trái: Degas, Người phụ nữ ngồi cạnh bình hoa, 1865. Phải: Hiroshige, tiền cảnh bị cắt · phút 24:46", "text": "Theo chuẩn hàn lâm bức Degas “không biết chọn”: bó hoa bị cắt, chân dung bị cắt, người phụ nữ nhìn ra ngoài khung. Đặt cạnh Hiroshige, nơi một vật lớn chắn ngay trước mắt, cách cắt đó có nguồn rõ ràng và tạo sinh khí.", "bullets": ["Thủ pháp 2: tiền cảnh bị cắt.", "Ánh mắt nhân vật kéo người xem ra ngoài tranh."], "src": [3]}, {"type": "media", "kicker": "Case study · Video 1, phút 37:20", "title": "Đường chéo và cây “sống”: Munch đặt cạnh Hiroshige", "img": "v1-2240", "caption": "Trái: Hiroshige, lữ khách dưới trăng. Phải: Munch · phút 37:20", "text": "Sách dạy vẽ Nhật đòi cây chuyển động từ thân tới ngọn, như có tay. Munch giữ cả hai: hàng cây uốn vặn và đường chéo kéo mắt người xem lao vào sâu, với tiền cảnh bị cắt.", "bullets": ["Thủ pháp 3: bố cục đường chéo.", "Thủ pháp 7: hàng cây lặp có biến thể."], "src": [4]}, {"type": "media", "kicker": "Case study · Video 2, phút 32:05", "title": "Đường chéo không cần phối cảnh: Kirchner đặt cạnh Hiroshige", "img": "v2-1925", "caption": "Trái: Hiroshige, Amanohashidate (đen trắng). Phải: Kirchner theo lời giảng · phút 32:05", "text": "Người giảng cố ý để Hiroshige đen trắng để so với bản khắc châu Âu: một dải đất chéo, người đi xếp hàng, hút mắt vào sâu mà không theo luật phối cảnh một điểm.", "bullets": ["Đường chéo xuyên toàn khung.", "Không có điểm tụ rõ ràng."], "src": [5]}, {"type": "media", "kicker": "Case study · Video 2, phút 43:46", "title": "Silhouette sau vách giấy", "img": "v2-2626", "caption": "Trái: tranh khắc diễn viên, bóng người sau vách giấy. Phải: Hiroshige, hàng cây và bóng cây · phút 43:46", "text": "Ban đêm ở Nhật, qua vách giấy người ta thấy bóng. Tranh khắc quen dùng silhouette: hình đen trên nền sáng, cả bóng cây nhạt sau hàng cây. Áp phích Paris lấy lại cách này vì đọc được từ xa.", "bullets": ["Thủ pháp 8: silhouette.", "Xem tiếp ở trang Toulouse-Lautrec."], "src": [6]}, {"type": "dodont", "title": "Bề mặt và chiều sâu", "doTitle": "Đồng hoá thật (tầng sâu)", "dontTitle": "Chỉ là mốt (tầng bề mặt)", "do": ["Đổi cách cắt khung và vị trí người xem", "Dùng khoảng trống như một thành phần", "Bỏ phối cảnh một điểm, nhiều góc nhìn trong một tranh", "Học nét, nhịp, sự giản lược của đường"], "dont": ["Mặc kimono cho người mẫu", "Treo quạt, bình phong làm phông", "Chép ký tự Nhật mà không biết nghĩa (Van Gogh chép cả quảng cáo nhà kỹ nữ)", "Chép con dấu tưởng là chữ ký (thật ra là dấu người sở hữu hoặc dấu kiểm duyệt)"], "src": [0, 1]}, {"type": "callout", "tone": "warn", "title": "Lưu ý của người giảng", "items": ["“Người Nhật không phát minh ra phối cảnh, họ không quan tâm.” Mắt châu Âu được giáo dục để tìm điểm tụ nên vẫn đọc ra phối cảnh trong tranh Nhật, rồi thấy “sai”.", "Có thể nói Degas chịu ảnh hưởng nhiếp ảnh, nhưng một nhà sử học nhận xét cách cắt khung của Place de la Concorde “về mặt nhiếp ảnh là không thể”."], "src": [1]}]}, "motifs": {"page": "motifs", "title": "Motif trong nghệ thuật trang trí", "group": "Ngôn ngữ thị giác", "lead": "Ở nghệ thuật trang trí, việc “mượn” lộ rõ nhất: từ đĩa sứ, bình thuỷ tinh đến trang sức, các motif đi thẳng từ Hokusai Manga và sách dạy vẽ Nhật sang xưởng Pháp, Mỹ, Áo.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2”, phút 8 đến 51", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Video 1, phút 9:15: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=555s", "date": "Art d'Histoire, 2018"}, {"name": "Video 1, phút 40:15: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=2415s", "date": "Art d'Histoire, 2018"}, {"name": "Video 1, phút 41:20: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=2480s", "date": "Art d'Histoire, 2018"}, {"name": "Video 1, phút 42:15: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=2535s", "date": "Art d'Histoire, 2018"}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài hai bài giảng, do người tổng hợp biên soạn", "date": ""}], "blocks": [{"type": "table", "title": "Motif và nơi nó xuất hiện ở phương Tây", "columns": ["Motif", "Nguồn Nhật", "Xuất hiện ở", "Vì sao đáng chú ý"], "widths": [16, 22, 32, 30], "rows": [["Tôm hùm, cào cào, cây bầu", "Hokusai Manga", "Bộ đồ ăn Bracquemond–Rousseau (1867), Lambert–Rousseau", "Gần như sao chép; ghép tôm hùm với cà tím và chim là phi logic theo chuẩn hàn lâm"], ["Cây bầu bí, tua cuốn", "Hokusai", "Tiffany, bình phong của Gallé", "Cây sinh sôi tượng trưng cho năng lượng mà Art Nouveau cần"], ["Sóng và bọt sóng cách điệu", "Bình phong rồng, Hiroshige", "Bạc chạm Bing, bình gốm Ernest Chaplet", "Cách vẽ sóng hoàn toàn khác lối hiện thực của tranh mây Anh"], ["Cá chép vượt nước", "Biểu tượng can đảm, năng lượng", "Bình của Chaplet", "Nghệ sĩ châu Âu nhiều khả năng không biết nghĩa biểu tượng"], ["Hoa diên vĩ", "Sách dạy vẽ Nhật", "Otto Eckmann, Eugène Grasset, Marcus & Co, Lalique, Van Gogh", "Học lại cách vẽ hoa từ mẫu Nhật; tái khám phá kỹ thuật men cloisonné"], ["Bướm cánh xoè", "Sách mẫu stencil", "Đĩa Théodore Deck, trang sức, chữ ký bướm của Whistler", "Giản lược gần như trừu tượng, chỉ giữ đường viền"], ["Chuồn chuồn", "Hokusai, hộp inro", "Đèn và bình Daum, Gallé, kẹp tóc", "Judith Gautier dịch khoảng 80 bài thơ Nhật trong tập Poèmes de la libellule"], ["Con dơi", "Kimono diễn viên kabuki", "Bình của Gallé", "Rococo thế kỷ 18 không bao giờ trang trí bằng dơi"], ["Lươn, rắn uốn lượn", "Hokusai", "Hộp đường Lalique", "Đường cong vươn lên"], ["Tsuba (chắn kiếm)", "Thợ kim hoàn mất việc khi cấm đeo kiếm", "Khoá thắt lưng, chữ ký Lautrec", "Tay nghề luyện kim, chạm, dập nổi chuyển sang hàng xuất khẩu"], ["Quạt xoè", "Tranh khắc dạng quạt", "Quạt của Degas", "Thách thức vẽ trên khung cung tròn, rỗng tâm"], ["Lưới khung vách shoji", "Kiến trúc Nhật", "Ghế Mackintosh, nội thất Godwin (1867)", "Lưới đen trên nền giấy thành ngôn ngữ của trường phái Glasgow"]], "note": "Tên và thời điểm tác phẩm theo lời giảng; một số chi tiết người giảng tự nói “không chắc”."}, {"type": "story", "title": "Đọc sâu: nghệ nhân và xưởng sản xuất", "items": [{"title": "Émile Gallé và trường phái Nancy", "paras": ["Ở Nancy, nhà làm thuỷ tinh Émile Gallé kết bạn với Takashima Hokkai, kỹ sư lâm nghiệp người Nhật sang học ở trường lâm nghiệp Nancy (1885–88), cũng là hoạ sĩ. Bình thuỷ tinh của Gallé mang chuồn chuồn, cá chép, hoa diên vĩ, nhiều khi kèm câu thơ khắc trên thân.", "Gallé không chép tranh Nhật mà học cách quan sát thiên nhiên cận cảnh và để một nhành cây chiếm cả bề mặt vật dụng."], "src": [5]}, {"title": "Gốm và men ở Paris", "paras": ["Théodore Deck và Ernest Chaplet nghiên cứu men của gốm Á Đông: men rạn, men chảy, men đỏ đồng. Chaplet tìm lại men ‘sang-de-bœuf’ (máu bò) vào thập niên 1880. Xưởng Christofle làm đồ đồng tráng men cloisonné theo lối Nhật cho các Triển lãm thế giới."], "src": [5]}, {"title": "Tiffany ở New York", "paras": ["Louis Comfort Tiffany và nhà thiết kế bạc Edward C. Moore của hãng Tiffany & Co. đều sưu tầm đồ Nhật. Đồ bạc Tiffany ở Triển lãm 1878 mang cá, chuồn chuồn, lá bầu, khảm nhiều kim loại theo kỹ thuật Nhật. Đèn và kính màu của Louis C. Tiffany về sau dùng chuồn chuồn, hoa tử đằng, sen."], "src": [5]}, {"title": "Bảng motif hay gặp", "bullets": ["Sóng: Hokusai, đến gốm Chaplet, hoa văn Art Nouveau, cả bầu trời Van Gogh.", "Diên vĩ: từ Hiroshige, Hokusai đến Van Gogh, Gallé, vải Liberty, sắt rèn.", "Chuồn chuồn, cào cào, cá chép: côn trùng và cá được nâng lên thành chủ đề chính, điều hiếm trong trang trí châu Âu.", "Hoa cúc, hoa anh đào, cành mận: thường để nằm lệch về một góc, phần còn lại để trống.", "Mon (huy hiệu tròn): thành mảng tròn lặp lại trên vải, áo, nền tranh Klimt."], "src": [5]}]}, {"type": "media", "title": "Ví dụ: đĩa của bộ Service Rousseau", "img": "bracquemond", "text": "Bracquemond chép motif từ Hokusai Manga lên bộ đồ ăn cho nhà buôn gốm Rousseau. Bộ đĩa gây sốt ở Triển lãm thế giới 1867.", "bullets": ["Motif đặt lệch tâm, phần lớn mặt đĩa để trống: “nghệ thuật khoảng trống”.", "Mỗi đĩa một mảnh thiên nhiên không liên quan nhau, phá logic bố cục hàn lâm.", "Người giảng: “lần này ta đã chạm ngưỡng đạo văn”."], "src": [0]}, {"type": "media", "kicker": "Case study · Video 1, phút 9:15", "title": "Đặt đĩa cạnh mẫu gốc: tôm hùm, cây bầu, cào cào", "img": "v1-0555", "caption": "Trên slide: cột trái là đĩa bộ Rousseau, cột phải là mẫu Nhật (dưới: Utamaro, 1788) · phút 9:15", "text": "Người giảng đặt đĩa và mẫu gốc cạnh nhau: tôm hùm, cây bầu, cào cào gần như chép nguyên. Khi Rousseau làm tiếp với Lambert, cùng con cào cào xuất hiện lại; bà nói “lần này ta chạm ngưỡng đạo văn”.", "bullets": ["So từng nét chân tôm, cuống lá.", "Motif lệch tâm, phần lớn mặt đĩa để trống."], "src": [1]}, {"type": "media", "kicker": "Case study · Video 1, phút 40:15", "title": "Sóng: bình gốm Chaplet đặt cạnh Hiroshige", "img": "v1-2415", "caption": "Trái: bình gốm Ernest Chaplet. Phải: Hiroshige, biển ở Suruga · phút 40:15", "text": "Bọt sóng như móng vuốt của Hiroshige được khắc lại gần như y hệt trên bình gốm Pháp. Người giảng đoán mặt sau có cá chép vượt nước, biểu tượng can đảm của Nhật mà nghệ sĩ châu Âu có lẽ không biết nghĩa.", "bullets": ["Châu Âu trước đó vẽ sóng, mây theo lối hiện thực.", "Ở đây sóng là một hình mẫu cách điệu."], "src": [2]}, {"type": "media", "kicker": "Case study · Video 1, phút 41:20", "title": "Diên vĩ: học lại cách vẽ từ sách Nhật", "img": "v1-2480", "caption": "Trái: sách dạy vẽ Nhật. Giữa và phải: bản vẽ diên vĩ châu Âu (Eckmann, Grasset theo lời giảng) · phút 41:20", "text": "Nghệ sĩ châu Âu “học lại” cách vẽ hoa diên vĩ từ sách Nhật: lá như mũi giáo, cánh viền rõ, cuống thẳng. Otto Eckmann và Eugène Grasset chép gần nguyên mẫu.", "bullets": ["Đường viền thay cho đánh khối.", "Lá, cuống cắt ở mép khung."], "src": [3]}, {"type": "media", "kicker": "Case study · Video 1, phút 42:15", "title": "Cây bầu: Utamaro đặt cạnh Tiffany", "img": "v1-2535", "caption": "Trái: Utamaro, cào cào và cây bầu, 1788. Phải: đồ trang trí men (Tiffany theo lời giảng) · phút 42:15", "text": "Art Nouveau tìm năng lượng ở cây cỏ sinh sôi, và cây bầu với tua cuốn là motif được chọn. Quả, lá, tua cuốn của tranh Nhật xuất hiện lại trong đồ trang trí của Tiffany.", "bullets": ["Tua cuốn giúp cây bám và lan ra.", "Motif trải phẳng trên mặt vật."], "src": [4]}, {"type": "gallery", "title": "Motif diên vĩ và sóng: từ Nhật sang châu Âu", "items": [{"img": "hiro-iris", "caption": "Hiroshige, Vườn diên vĩ Horikiri, 1857"}, {"img": "vg-irises", "caption": "Van Gogh, Diên vĩ, 1889"}, {"img": "hokusai-wave", "caption": "Hokusai, Sóng lớn, khoảng 1831"}, {"img": "hokusai-manga", "caption": "Hokusai Manga: kho mẫu của nghệ sĩ châu Âu"}]}, {"type": "keypoints", "title": "Ba điểm rút ra", "items": ["Không có thứ bậc ở Nhật. Hoạ sĩ Nhật làm cả tranh khắc, bình phong, mẫu kimono; châu Âu bắt đầu xoá ranh giới đó với Gallé, Bonnard, Art Nouveau.", "Đồ thủ công Nhật là sản phẩm xa xỉ. Người giàu mua bản gốc, Gallé, Daum; người ít tiền mua bản chép thô, nhưng ai cũng “Nhật hoá” được nội thất của mình.", "Học xong thì làm ngang bằng. Người giảng nhấn mạnh thợ kim hoàn, làm thuỷ tinh châu Âu cuối cùng “không thua gì người Nhật”."], "src": [0]}]}, "textile": {"page": "textile", "title": "Dệt may, Klimt và Art Nouveau", "group": "Ngôn ngữ thị giác", "lead": "Vải và khuôn in Nhật thay đổi trang trí, kiến trúc và chân dung: nhân vật chìm vào hoa văn, hoa văn trải phẳng song song mặt tranh.", "sources": [{"name": "Art d'Histoire, “Japonisme 2/2”, phút 0 đến 8", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 1/2”, phút 49 đến 52", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Video 2, phút 1:52: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=112s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, phút 6:27: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=387s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, phút 7:07: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=427s", "date": "Art d'Histoire, 2018"}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài hai bài giảng, do người tổng hợp biên soạn", "date": ""}], "blocks": [{"type": "flow", "title": "Từ khuôn giấy dâu tằm đến thiết kế thế kỷ 20", "steps": [{"title": "Katagami", "text": "Khuôn in bằng vỏ dâu tằm để in hoa văn lên vải len, lụa, thay cho kimono thêu đắt tiền.", "img": "katagami"}, {"title": "Bảo tàng mua hàng trăm", "text": "Bảo tàng Nghệ thuật và Công nghiệp Vienna mua và đưa cho nghệ sĩ Ly khai Vienna làm mẫu."}, {"title": "Ly khai và Wiener Werkstätte", "text": "Klimt đứng đầu Ly khai; xưởng Wiener Werkstätte là nền của design thế kỷ 20, rồi đến Bauhaus."}, {"title": "Art Nouveau Bỉ", "text": "Đường “roi quất” ở cột, lan can, khảm của Victor Horta như bước ra từ katagami."}], "src": [0]}, {"type": "story", "title": "Đọc sâu: từ khuôn giấy đến Vienna", "items": [{"title": "Katagami làm thế nào", "paras": ["Katagami là khuôn để in nhuộm vải (kỹ thuật katazome): nhiều lớp giấy dâu tằm dán bằng nước hồng ngâm (kakishibu) cho dai và chịu nước, rồi được khắc bằng dao, đục thành hoa văn rất mảnh. Thợ đặt khuôn lên vải, quét hồ gạo, nhuộm, giặt bỏ hồ: chỗ có hồ giữ màu nền.", "Hàng nghìn khuôn katagami được bảo tàng và trường mỹ thuật ứng dụng châu Âu mua về cuối thế kỷ 19 làm mẫu học. Hoa văn lặp, đường cong mảnh, đối lập âm dương của chúng xuất hiện lại trong giấy dán tường, sắt rèn, kính màu."], "src": [5]}, {"title": "Art Nouveau: đường cong ‘roi quất’", "paras": ["Ở Brussels, Victor Horta xây Hôtel Tassel (1893): cột sắt, tay vịn, tranh tường đều là đường cong uốn như dây leo. Ở Paris, Hector Guimard thiết kế cửa ga métro (từ 1900). Hai nguồn chính của đường cong này là thực vật học và nghệ thuật trang trí Nhật."], "src": [5]}, {"title": "Vienna: Ly khai và Wiener Werkstätte", "paras": ["Nhóm Ly khai Vienna thành lập năm 1897 với Klimt làm chủ tịch, đối lập với Hội nghệ sĩ hàn lâm. Năm 1900, triển lãm lần thứ 6 của nhóm dành cho nghệ thuật Nhật. Josef Hoffmann và Koloman Moser lập Wiener Werkstätte (1903), xưởng thủ công chú trọng hình vuông, lưới ô, mảng đen trắng, gần với hoa văn kẻ ô trên kimono và khuôn katagami.", "Klimt sưu tầm kimono, áo lụa, tranh khắc Nhật và Trung Hoa. Trong ‘Nụ hôn’ và ‘Chân dung Adele Bloch-Bauer I’, thân người phẳng và chìm vào một tấm áo hoa văn, chỉ mặt và tay còn được vẽ khối, cách xử lý giống tranh kỹ nữ Nhật."], "src": [5]}, {"title": "Mary Cassatt và mười bản khắc màu", "paras": ["Xem triển lãm tranh khắc tại École des Beaux-Arts năm 1890, Mary Cassatt làm loạt mười bản khắc màu (1890–91) kết hợp khắc khô và aquatint, in từng màu như tranh Nhật. Đề tài là đời sống thường ngày của phụ nữ: tắm cho con, viết thư, thử áo. Hoa văn trên áo và giấy tường được xử lý như mảng phẳng."], "src": [5]}]}, {"type": "media", "kicker": "Case study · Video 2, phút 1:52", "title": "Katagami đặt cạnh nhà Horta", "img": "v2-0112", "caption": "Trái: khuôn in katagami. Phải: cầu thang trong một công trình của Victor Horta · phút 1:52", "text": "Đường cong “roi quất” của lan can, cột và kính trần trong kiến trúc Horta như bước ra từ khuôn in Nhật: cây cỏ sinh sôi, cuộn xoáy, phủ kín bề mặt.", "bullets": ["So nét cuộn của khuôn in với lan can sắt.", "Art Nouveau đưa hoa văn phẳng lên cả kiến trúc."], "src": [2]}, {"type": "principles", "title": "Ba bài học Klimt lấy từ kimono và kịch Nhật", "items": [{"title": "Nhân vật chìm vào trang phục", "rule": "Trong kịch nô, kabuki, vai diễn nằm ở bộ áo nhiều hơn ở diễn viên.", "why": "Chân dung Adele Bloch-Bauer: khuôn mặt phi hiện thực, lạc giữa vũ trụ vải.", "img": "klimt-adele"}, {"title": "Hoa văn trải phẳng", "rule": "Hoa văn song song mặt tranh, không uốn theo cơ thể.", "why": "Tranh Nhật cho thấy trọn vẹn huy hiệu mon dù áo bay trong gió; Renoir hay Monet sẽ chỉ còn vài nét chấm."}, {"title": "Rosette trên nền hữu cơ hoặc hình học", "rule": "Motif lớn đặt trên nền lặp.", "why": "Nụ hôn: hình bầu dục, hình mon trên áo người nữ, ô chữ nhật đen trên áo người nam.", "img": "klimt-kiss"}], "src": [0]}, {"type": "media", "kicker": "Case study · Video 2, phút 6:27", "title": "Tấm vải mon đặt cạnh Nụ hôn", "img": "v2-0387", "caption": "Trái: vải Nhật với các huy hiệu mon tròn. Phải: Klimt, Nụ hôn, 1907–08 · phút 6:27", "text": "Vải Nhật rải các vòng mon trên nền phẳng. Klimt lấy đúng ngữ pháp đó: hình bầu dục, hình tròn trên áo người nữ, ô chữ nhật đen trên áo người nam, tất cả song song mặt tranh, không uốn theo cơ thể.", "bullets": ["Hoa văn phẳng, không đổ bóng.", "Cơ thể gần như biến mất sau lớp áo."], "src": [3]}, {"type": "media", "kicker": "Case study · Video 2, phút 7:07", "title": "Kimono kẻ ô đặt cạnh Mary Cassatt", "img": "v2-0427", "caption": "Trái: tranh khắc Nhật, kimono kẻ ô trên nền sọc. Phải: Mary Cassatt, Lá thư, 1890–91 · phút 7:07", "text": "Tranh Nhật ưu tiên trang phục và nền: kimono kẻ ô trên nền sọc dọc. Cassatt đặt người phụ nữ vào áo hoa văn trước giấy dán tường in hoa; khuôn mặt chìm giữa các mặt hoa văn.", "bullets": ["Hoa văn áo và hoa văn tường chồng lên nhau.", "Điều chưa từng thấy trước tranh khắc Nhật."], "src": [4]}, {"type": "cards", "title": "Nhân vật bị hút vào hoa văn", "items": [{"title": "Klimt", "text": "Sưu tầm kakemono, tranh khắc, kimono, có cả giáp samurai trong xưởng; mặc kimono tự thiết kế ở Vienna.", "src": [0], "img": "klimt-kiss"}, {"title": "Mary Cassatt, La Lettre", "text": "Áo kẻ ô, nền giấy dán tường in hoa: điều chưa từng thấy trước tranh khắc Nhật.", "src": [0], "img": "cassatt-letter"}, {"title": "Vuillard", "text": "Người phụ nữ như bị giấy dán tường hút vào; mặt và tay thứ yếu so với vải kẻ ô.", "src": [0]}, {"title": "Godwin, Mackintosh", "text": "Giấy dán tường với mon hoàng gia Nhật; lưới đen của vách shoji thành nội thất Glasgow.", "src": [0, 1]}]}]}, "vangogh": {"page": "vangogh", "title": "Van Gogh: học nét vẽ Nhật", "group": "Nghệ sĩ", "lead": "“Toàn bộ công việc của tôi, có thể nói, dựa trên nghệ thuật Nhật.” Những nét gạch, chấm, xoáy làm nên Van Gogh được học từ Hokusai và sách dạy vẽ Nhật nhiều hơn là từ “cơn điên”.", "sources": [{"name": "Art d'Histoire, “Japonisme 2/2”, phút 8 đến 22", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 1/2”, phút 20 đến 21, 46", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Video 2, phút 13:32: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=812s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, phút 14:44: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=884s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, phút 19:08: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=1148s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, phút 31:06: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=1866s", "date": "Art d'Histoire, 2018"}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài hai bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Artistik TV, “Japonisme : comment l'art japonais a-t-il révolutionné la peinture occidentale ?” (phim “Quand les impressionnistes découvrent le Japon”, đạo diễn Jérôme Lambert, Philippe Picard, Andana Films)", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4", "date": "2018"}, {"name": "Phim tài liệu ADN, phút 32:45: Van Gogh ở Paris và Arles", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=1965s", "date": "Artistik TV"}], "blocks": [{"type": "timeline", "title": "Hành trình Nhật của Van Gogh", "items": [{"when": "1874–75", "title": "Làm ở Goupil", "text": "Có lẽ đã tiếp xúc nghệ thuật Nhật nhưng chưa đổi cách nhìn.", "src": [0]}, {"when": "1885", "title": "Lần đầu nhắc tranh khắc Nhật trong thư", "text": "Ghim vài tờ lên tường ở Antwerp nhưng không chép: mô hình hiện thực vẫn thống trị.", "src": [0]}, {"when": "1886–88", "title": "Paris, mua tranh ở Bing", "text": "Hai anh em gom hơn 500 tờ, giá vài xu. Triển lãm ở quán Le Tambourin thất bại về tiền nhưng ông tự hào đã giới thiệu nghệ thuật Nhật cho Bernard, Anquetin.", "src": [0]}, {"when": "1887", "title": "Père Tanguy và các bản chép", "text": "Tranh khắc Nhật thành trọng tâm sau lưng Père Tanguy. Chép Hiroshige (Kameido) bằng giấy can, phóng ô; chép Kỹ nữ của Eisen từ bìa Paris Illustré.", "src": [0], "img": "vg-tanguy"}, {"when": "1888", "title": "Xuống Arles tìm “khí hậu Nhật”", "text": "Đọc bài của Hayashi rằng khí hậu Nhật giống Ý. Viết: “ta nhìn bằng con mắt Nhật”, “tôi không cần tranh khắc nữa, chỉ cần mở mắt”.", "src": [0, 1], "img": "eisen-cover"}, {"when": "1888", "title": "Tự hoạ như nhà sư", "text": "Đầu cạo, nền xanh kiểu Nhật. Mơ một cộng đồng nghệ sĩ như tăng đoàn, trao đổi quà như surimono. Chỉ Gauguin đến, kết thúc bằng vụ cắt tai.", "src": [0], "img": "vg-bonze"}, {"when": "1890", "title": "Cành hạnh nở hoa", "text": "Cành cây sát mắt trên nền một màu, gần với gốm sứ Nhật hơn là tranh khắc.", "src": [0], "img": "vg-almond"}]}, {"type": "story", "title": "Đọc sâu: Van Gogh qua thư từ và bộ sưu tập", "items": [{"title": "Bộ sưu tập của hai anh em", "paras": ["Phần lớn bộ sưu tập tranh khắc của Vincent và Theo hiện ở Bảo tàng Van Gogh, Amsterdam: vài trăm tờ, nhiều nhất là tranh của Hiroshige, Kunisada, Kuniyoshi, đa phần là bản in thế kỷ 19 giá rẻ chứ không phải bản quý.", "Điều này có ý nghĩa: Van Gogh không học từ kiệt tác bảo tàng mà từ tranh thị dân phổ thông, với đề tài sinh hoạt, phong cảnh, diễn viên. Ông quan tâm cách làm hơn giá trị sưu tầm."], "src": [6]}, {"title": "Ba bản chép năm 1887", "paras": ["Ở Paris năm 1887, ông vẽ sơn dầu ba bản chép: Vườn mận Kameido và Mưa rào trên cầu Ōhashi theo Hiroshige, Kỹ nữ theo Eisen. Ông dùng giấy can và lưới ô để phóng đúng hình, nhưng đổi màu mạnh hơn, đặc hơn bản gốc, và thêm viền có chữ Hán chép từ các tờ tranh khác, dù không hiểu nghĩa.", "Chép là cách học truyền thống của Học viện (chép Louvre). Điều mới là đối tượng chép: tranh in rẻ của Nhật thay vì Raphael."], "src": [6]}, {"title": "Arles: ‘nhìn bằng con mắt Nhật’", "paras": ["Tháng 2/1888 ông xuống Arles. Trong thư gửi Theo, ông viết rằng ông thấy như đang ở Nhật, và rằng toàn bộ công việc của mình ở mức độ nào đó dựa trên nghệ thuật Nhật. Những vườn cây ăn quả nở hoa mùa xuân 1888 là câu trả lời trực tiếp cho vườn mận Hiroshige.", "Ông còn mơ ‘Xưởng phương Nam’: một cộng đồng nghệ sĩ sống giản dị, trao đổi tranh với nhau như ông tưởng tượng về các nghệ sĩ Nhật. Gauguin đến Arles tháng 10/1888; dự án đổ vỡ hai tháng sau."], "src": [6]}, {"title": "Bút sậy", "paras": ["Mùa hè 1888 ông vẽ nhiều bản vẽ bằng bút sậy và mực, như loạt Montmajour và Saintes-Maries-de-la-Mer: không đánh bóng, không tô khối, chỉ có chấm, gạch ngắn, đường cong với độ dày khác nhau để tạo các vùng sáng tối và chất liệu. Đây là bản dịch của nét bút lông Nhật sang dụng cụ châu Âu."], "src": [6]}]}, {"type": "story", "title": "Thêm từ phim tài liệu: Paris, Tambourin, Arles", "items": [{"title": "Quán Le Tambourin", "img": "vg-tambourin", "paras": ["Đến Paris năm 1886, Van Gogh thường xuyên vào cửa hàng của Bing mua tranh khắc. Ông lấy quán Le Tambourin làm ‘tổng hành dinh’, gặp Gauguin ở đó, vẽ chân dung bà chủ Agostina Segatori và thuyết phục bà cho trưng bày bộ sưu tập tranh khắc của mình."], "src": [8]}, {"title": "Père Tanguy như một vị Phật", "img": "vg-tanguy", "paras": ["Trên nền tranh khắc Nhật, ông bán màu Tanguy, người cung cấp màu cho phần lớn hoạ sĩ Ấn tượng, ngồi chính diện, tay đan vào nhau. Phim đọc tư thế này như một ông hiền triết Nhật hay một vị Phật hiền từ: Van Gogh không chỉ tôn vinh người nghiền màu, ông ‘Nhật hoá’ ông ta."], "src": [8]}, {"title": "‘Một xứ sẽ là Nhật Bản của chúng ta’", "paras": ["Trong thư gửi Theo, ông viết rằng các hoạ sĩ Ấn tượng yêu tranh Nhật, đã cảm thấy ảnh hưởng của nó, vậy sao không đến một xứ sẽ là Nhật Bản của chúng ta, miền Nam? Tương lai của hội hoạ hiện đại nằm ở phương Nam.", "Đến Arles năm 1888, ông tả cây cối phủ tuyết, ngọn trắng, bầu trời sáng như băng, ‘như những phong cảnh mùa đông người Nhật đã vẽ’. Gauguin đến, nhưng không ưa cộng đồng khổ hạnh ấy, lo cho sức khoẻ tinh thần của bạn, và rời đi tháng 12/1888."], "src": [8]}]}, {"type": "media", "kicker": "Case study · Video 2, phút 13:32", "title": "Van Gogh chép vườn mận Kameido", "img": "v2-0812", "caption": "Trái: Hiroshige, 1857. Phải: Van Gogh, Japonaiserie: prunier en fleurs, 1887 · phút 13:32", "text": "Van Gogh can tranh Hiroshige rồi phóng to từng ô. Ông giữ thân mận sát mắt và hậu cảnh tí hon, nhưng đẩy màu lên và thêm khung chữ Hán mà ông không đọc được.", "bullets": ["Thân cây tiền cảnh bị cắt ở cả hai bức.", "Khung chữ hai bên là phần Van Gogh thêm vào."], "src": [2]}, {"type": "media", "kicker": "Case study · Video 2, phút 14:44", "title": "Kỹ nữ của Eisen, có lưới ô can", "img": "v2-0884", "caption": "Trái: Keisai Eisen, Kỹ nữ, 1840 (qua bìa Paris Illustré, chồng lưới ô). Phải: Van Gogh, 1887 · phút 14:44", "text": "Khung hình cho thấy cách Van Gogh làm: hình kỹ nữ trên bìa Paris Illustré được kẻ lưới ô để phóng to. Bản sơn dầu giữ đường viền đen và hoa văn kimono trải phẳng, đặt trong khung vàng giữa ao, tre, sếu, ếch.", "bullets": ["Lưới ô là phương pháp phóng to.", "Nhân vật in ngược so với bản gốc Eisen."], "src": [3]}, {"type": "media", "title": "Trọng tâm: nét vẽ", "text": "Người giảng chọn tập trung vào vẽ (dessin), vì triển lãm về Japonisme của Van Gogh “không bao giờ hết”.", "bullets": ["Cây: sách Nhật đòi chuyển động từ thân đến ngọn; cành cây Van Gogh vặn xoắn như vậy.", "Bút: ông tự vót bút sậy (calame), dùng mực sepia, bistre; khác Lautrec nhập cọ, mực từ Nhật.", "Nét: gạch ngắn, chấm, xoáy tròn giống Hokusai. Từ bản vẽ Saintes-Maries-de-la-Mer đến bầu trời đầy sao.", "Album: muốn làm tập 6 đến 12 bản vẽ để trao đổi với Gauguin, Bernard như quà giữa nghệ sĩ Nhật. Chưa bao giờ thực hiện."], "src": [0], "img": "vg-starry", "caption": "Van Gogh, Đêm đầy sao, 1889: nét que và xoáy"}, {"type": "media", "kicker": "Case study · Video 2, phút 19:08", "title": "Cây trong sách dạy vẽ Nhật và cây của Van Gogh", "img": "v2-1148", "caption": "Trái: sách dạy vẽ Nhật. Phải: Van Gogh, Vườn mùa đông ở Hà Lan, 1884 · phút 19:08", "text": "Sách Nhật đòi cây chuyển động từ thân tới ngọn. Người giảng đặt cạnh một bản vẽ của Van Gogh: cành vặn xoắn, gần như bị giày vò, và về sau đi vào cả tranh sơn dầu.", "bullets": ["Nhìn hướng vặn của thân và cành.", "Bản vẽ có từ 1884, trước giai đoạn Paris."], "src": [4]}, {"type": "media", "kicker": "Case study · Video 2, phút 31:06", "title": "Bố cục cung tròn và nét que", "img": "v2-1866", "caption": "Trái: Hiroshige, bờ biển nhìn từ trên cao. Phải: bản vẽ của Van Gogh · phút 31:06", "text": "Đường bờ cong thành cung tròn quét ngang tranh, tạo nhịp và kéo mắt ra ngoài khung. Van Gogh lặp lại bố cục đó bằng những nét gạch, chấm, que học từ ký hoạ Nhật.", "bullets": ["So đường cung lớn ở hai bên.", "Nét gạch, chấm thay cho tô mảng."], "src": [5]}, {"type": "callout", "tone": "good", "title": "Kết luận của người giảng", "items": ["Lối nét “bó que” riêng của Van Gogh được học từ người Nhật, rồi hấp thụ theo cách của riêng ông. Chính sự hấp thụ đó làm nên một hoạ sĩ phi thường."], "src": [0]}]}, "degas": {"page": "degas", "title": "Degas: học bố cục và góc nhìn", "group": "Nghệ sĩ", "lead": "Tranh Degas không có kimono hay quạt. Nhưng một hoạ sĩ hàn lâm, mê Ingres, lại để Nhật thấm vào chính chỗ mạnh nhất của mình: bố cục.", "sources": [{"name": "Art d'Histoire, “Japonisme 2/2”, phút 21 đến 38", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Video 2, phút 24:46: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=1486s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, phút 36:21: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=2181s", "date": "Art d'Histoire, 2018"}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài hai bài giảng, do người tổng hợp biên soạn", "date": ""}], "blocks": [{"type": "stats", "title": "Bộ sưu tập", "items": [{"value": "117", "label": "Tranh khắc Nhật tìm thấy khi ông mất"}, {"value": "Kiyonaga", "label": "Tranh phụ nữ tắm treo trong phòng ngủ"}, {"value": "Hokusai", "label": "Không có tranh nào, nhưng chắc chắn đã xem ở Bing"}], "src": [0]}, {"type": "story", "title": "Năm tác phẩm, năm bài học", "items": [{"title": "Người phụ nữ với hoa cúc (1865)", "text": "Cả bó hoa và chân dung đều bị cắt. Người phụ nữ nhìn ra ngoài khung, kéo mắt người xem ra bức tường bảo tàng. Thiếu trọn vẹn, nhưng có sinh khí.", "src": [0], "img": "degas-chrys"}, {"title": "Chân dung Diego Martelli (1879)", "text": "Ghế nhìn thẳng, sàn dốc lên, thấy cả lòng dép, bàn quá gần mà vẫn đọc được tờ giấy ở xa. Mỗi phần một góc nhìn, như máy quay di động.", "src": [0], "img": "degas-martelli"}, {"title": "Place de la Concorde", "text": "Mặt đất thành mảng vàng phẳng; mọi nhân vật là tiền cảnh bị cắt; mỗi người nhìn một hướng như tranh Kiyonaga.", "src": [0], "img": "degas-concorde"}, {"title": "Vũ nữ", "text": "Trong loạt tranh vũ nữ, người giảng chỉ ra: đường chéo, khoảng trống đối lập với góc dồn người, cầu thang hay cột trụ cắt ở tiền cảnh, vũ nữ lặp có biến thể. Bức minh hoạ (1877): hai vũ nữ dồn lên góc trên, nửa dưới là sàn gỗ trống chạy chéo.", "src": [0], "img": "degas-dancers"}, {"title": "Phụ nữ trong bồn tắm", "text": "Tư thế lấy từ Hokusai Manga, như tốc ký chuyển động. Bồn nhìn từ trên, sàn dốc, mặt bàn như vách đứng. Huysmans nói ông “kéo người phụ nữ khỏi bệ thờ”.", "src": [0], "img": "degas-tub"}]}, {"type": "story", "title": "Đọc sâu: Degas, nhiếp ảnh và tranh quạt", "items": [{"title": "Hai nguồn cho cùng một cách nhìn", "paras": ["Ngoài tranh Nhật, Degas còn chịu ảnh hưởng của nhiếp ảnh, và ông chụp ảnh nhiều thập niên 1890. Ảnh chụp nhanh cũng cắt người ở mép khung và bắt khoảnh khắc giữa chừng. Hai nguồn này củng cố nhau: tranh Nhật cho ông thấy cách cắt khung là một lựa chọn thẩm mỹ, nhiếp ảnh cho thấy nó cũng là cách mắt người thật sự nhìn."], "src": [3]}, {"title": "Tranh quạt", "paras": ["Khoảng 1878–80, Degas vẽ khoảng hai mươi chiếc quạt, chủ yếu đề tài vũ nữ, bằng màu keo, bột vàng bạc trên lụa. Khổ hình bán nguyệt buộc ông phải bố cục lệch, để vùng trống lớn, như quạt Nhật. Một số được trưng bày ở triển lãm Ấn tượng 1879."], "src": [3]}, {"title": "Vũ nữ và người phụ nữ tắm", "paras": ["Hai đề tài lớn nhất của Degas đều là cơ thể trong động tác thường ngày, nhìn từ góc lạ: trên cao xuống, sau lưng, đang cúi. Ông nói muốn vẽ người phụ nữ như nhìn qua lỗ khoá, không tư thế, không biết mình bị nhìn. Đây là điều tranh tắm của Kiyonaga và tập Hokusai Manga đã làm, trong khi khoả thân hàn lâm luôn là tư thế tạo dáng.", "Loạt tranh tắm bằng phấn màu được trưng bày ở triển lãm Ấn tượng cuối cùng (1886), trong đó có Le Tub."], "src": [3]}, {"title": "Người kế thừa", "paras": ["Mary Cassatt được Degas mời tham gia nhóm Ấn tượng năm 1877. Toulouse-Lautrec ngưỡng mộ Degas, lấy lại cách cắt khung và góc nhìn chéo ở các cảnh quán, nhà hát. Từ Degas, bố cục kiểu Nhật đi vào áp phích và tranh minh hoạ."], "src": [3]}]}, {"type": "media", "kicker": "Case study · Video 2, phút 24:46", "title": "Người phụ nữ với hoa cúc, đặt cạnh Hiroshige", "img": "v2-1486", "caption": "Trái: Degas, 1865. Phải: Hiroshige, tiền cảnh bị cắt · phút 24:46", "text": "Người giảng đặt bức Degas cạnh một bản Hiroshige có vật lớn chắn sát mắt: cách cắt bó hoa và chân dung của Degas có cùng logic “mảnh thay cho toàn thể”.", "bullets": ["Hai thứ cùng bị cắt: bó hoa và người.", "Ánh mắt nhân vật dẫn ra ngoài khung."], "src": [1]}, {"type": "media", "kicker": "Case study · Video 2, phút 36:21", "title": "Hokusai Manga đặt cạnh Le Tub", "img": "v2-2181", "caption": "Trái: Hokusai Manga. Phải: Degas, Le Tub, 1886 · phút 36:21", "text": "Cùng một tư thế cúi người trên chậu tắm. Degas lấy tư thế từ manga, rồi thêm góc nhìn từ trên xuống và sàn dốc lên, những thứ cũng học từ tranh khắc Nhật.", "bullets": ["Tư thế gần như trùng khớp.", "Chậu tắm nhìn từ trên cao."], "src": [2]}, {"type": "callout", "tone": "info", "title": "Ai chịu ảnh hưởng tiếp", "items": ["Bonnard với tranh phụ nữ tắm: rèm chéo, sàn dốc, nhìn gần như từ trên.", "Manet, Berthe Morisot: hàng lan can, lưới ô học từ tranh khắc."], "src": [0]}]}, "lautrec": {"page": "lautrec", "title": "Toulouse-Lautrec: nét bút lông và silhouette", "group": "Nghệ sĩ", "lead": "Lautrec nhập cọ và mực từ Nhật, ký tên trong hình tsuba, và biến áp phích Paris thành bài học tranh khắc: đường chéo, cận cảnh cắt, mảng đen, biếm hoạ.", "sources": [{"name": "Art d'Histoire, “Japonisme 2/2”, phút 38 đến 49", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Video 2, phút 41:30: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=2490s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, phút 43:46: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=2626s", "date": "Art d'Histoire, 2018"}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài hai bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Phim tài liệu ADN, phút 45:17: Lautrec và hệ thứ bậc mỹ thuật", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2717s", "date": "Artistik TV"}], "blocks": [{"type": "principles", "title": "Năm dấu ấn Nhật ở Lautrec", "items": [{"title": "Chữ ký", "rule": "Monogram trong hình tsuba hoặc con voi.", "why": "Ex-libris cho Maurice Joyant cũng trong hình tsuba."}, {"title": "Bố cục áp phích", "rule": "Cận cảnh cắt, đường chéo, sàn chéo.", "why": "Áp phích Jane Avril: đầu nhạc công đeo kính, cần đàn phóng to, sàn chéo. Divan Japonais: ly rượu nghiêng tưởng sắp đổ.", "img": "lautrec-avril"}, {"title": "Lan can và lưới", "rule": "Hàng lan can như trong tranh Utamaro.", "why": "La Goulue và La Môme Fromage; xuất hiện cả ở Degas, Vuillard."}, {"title": "Tốc ký chuyển động", "rule": "Tư thế lấy từ manga như “dừng hình”.", "why": "Jane Avril giơ chân; chú hề Chocolat nhảy."}, {"title": "Biếm hoạ", "rule": "Biến dạng miệng, mặt như tranh diễn viên Nhật.", "why": "Aristide Bruant; Yvette Guilbert, năm 1894–95 trông xinh dưới tay người khác, “già thêm 25 tuổi” dưới tay Lautrec."}], "src": [0]}, {"type": "media", "kicker": "Case study · Video 2, phút 41:30", "title": "Jane Avril đặt cạnh Hokusai Manga", "img": "v2-2490", "caption": "Trái: Toulouse-Lautrec, Jane Avril, 1893. Phải: Hokusai Manga · phút 41:30", "text": "Manga như “dừng hình” giữa một cử động. Lautrec dùng đúng cách đó cho cú giơ chân của Jane Avril; áp phích còn có cận cảnh cần đàn bị cắt và sàn chéo.", "bullets": ["So tư thế chân giơ cao.", "Cần đàn cận cảnh là tiền cảnh bị cắt."], "src": [1]}, {"type": "media", "title": "Silhouette: thứ áp phích cần nhất", "text": "Ban đêm ở Nhật, qua vách giấy, người ta thấy bóng. Silhouette trở lại thành mốt nhờ tranh Nhật, và rất hợp áp phích vì đọc được từ xa.", "bullets": ["Jane Avril, Sarah Bernhardt, đám đông ở Moulin Rouge: mảng đen, vài nét viền.", "Divan Japonais: Jane Avril nổi bằng mảng đen; ca sĩ Yvette Guilbert chỉ còn đôi găng tay.", "Bút lông không cho sửa: nét nhanh, giản lược, gần trừu tượng.", "Đứng ở xưởng in để chọn màu: tương phản xanh lam và đen."], "src": [0], "img": "lautrec-goulue", "side": "right"}, {"type": "story", "title": "Đọc sâu: Lautrec và nghệ thuật áp phích", "items": [{"title": "Thạch bản màu", "paras": ["Lautrec làm khoảng ba mươi áp phích, bắt đầu với ‘Moulin Rouge: La Goulue’ (1891). Kỹ thuật là thạch bản màu: vẽ lên đá, mỗi màu một bản đá, in chồng. Quá trình này giống cách in tranh khắc Nhật nhiều màu, và cũng buộc hình phải đơn giản thành mảng.", "Ông dùng kỹ thuật ‘crachis’: vẩy mực bằng bàn chải để tạo vùng lấm tấm, tương đương các vùng chuyển màu trên tranh Nhật."], "src": [3]}, {"title": "Divan Japonais", "paras": ["Áp phích ‘Divan Japonais’ (1893) quảng cáo một quán cà phê hát mang tên Nhật: Jane Avril trong váy đen, nhà phê bình Édouard Dujardin bên cạnh, ca sĩ Yvette Guilbert trên sân khấu bị cắt mất đầu, chỉ còn đôi găng đen. Tiền cảnh là cần đàn contrebass chéo qua khung, như cột cầu trong tranh Hiroshige."], "src": [3]}, {"title": "Con dấu và trang phục", "paras": ["Lautrec ký tranh bằng chữ lồng HTL trong vòng tròn, theo kiểu con dấu đỏ trên tranh Nhật. Có bức ảnh nổi tiếng chụp ông khoảng năm 1892 mặc trang phục Nhật, cầm quạt và búp bê. Ông chuộng cọ và mực Nhật cho bản vẽ."], "src": [3]}, {"title": "Sau Lautrec", "paras": ["Áp phích Paris thập niên 1890 (Chéret, Bonnard, Steinlen, Mucha) đều dùng mảng phẳng, viền rõ, chữ hoà vào hình. Ở London, Aubrey Beardsley vẽ minh hoạ ‘Salome’ (1894) bằng mảng đen trắng và đường mảnh, nguồn từ tranh Nhật. Ngôn ngữ đồ hoạ hiện đại, từ quảng cáo đến truyện tranh, kế thừa từ đây."], "src": [3]}]}, {"type": "media", "kicker": "Case study · Video 2, phút 43:46", "title": "Nguồn của silhouette: bóng sau vách giấy", "img": "v2-2626", "caption": "Trái: tranh khắc diễn viên, bóng người sau vách giấy. Phải: Hiroshige, hàng cây và bóng cây · phút 43:46", "text": "Người giảng giải thích vì sao tranh Nhật đầy silhouette: ban đêm, qua vách giấy, người ta chỉ thấy bóng. Lautrec biến điều này thành ngôn ngữ áp phích.", "bullets": ["Hình đen trên nền sáng.", "Chi tiết bên trong bị lược bỏ."], "src": [2]}, {"type": "media", "title": "Không có đề tài nào thấp kém", "img": "lautrec-divan", "text": "Phim tài liệu nhấn mạnh một bài học khác Lautrec lấy từ Hokusai và Hiroshige: không có đề tài nào không đáng vẽ. Quán rượu, phòng hát Montmartre, nhà thổ, đời sống đêm Paris đều xứng đáng; điều quyết định là phong cách và sự chân thật của cảnh.", "bullets": ["Avant-garde cuối thế kỷ 19 muốn phá hệ thứ bậc giữa mỹ thuật và nghệ thuật trang trí, một hệ thứ bậc vốn không tồn tại ở Nhật.", "Vì vậy Lautrec coi áp phích, phương tiện bình dân nhất thời đó, ngang với tranh sơn dầu.", "‘Divan Japonais’ (1893) là ví dụ: tên quán mang chữ Nhật, bố cục cắt chéo, mảng đen phẳng của chiếc váy Jane Avril."], "src": [4]}, {"type": "callout", "tone": "good", "title": "Kết thúc chuỗi bài giảng", "items": ["Picasso 1901, khi bắt đầu, nhìn sang Lautrec, Degas, Bonnard: thảm dựng đứng, bồn nhìn từ trên, bó hoa cắt ở tiền cảnh. Ông học Nhật gián tiếp.", "Kết luận: phần lớn các nghệ sĩ lớn trở thành avant-garde “mà ta tự hào” đã học nghệ thuật và sự hiện đại của mình từ nghệ thuật Nhật."], "src": [0]}]}, "glossary": {"page": "glossary", "title": "Thuật ngữ và nhân vật", "group": "Tra cứu", "lead": "Các từ và tên riêng xuất hiện trong hai bài giảng.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2”", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 2/2”", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}], "blocks": [{"type": "table", "title": "Thuật ngữ", "columns": ["Thuật ngữ", "Nghĩa"], "widths": [26, 74], "rows": [["Japonisme", "Ảnh hưởng của nghệ thuật và thủ công Nhật lên nghệ thuật phương Tây, khoảng 1860 đến 1910. Không phải môn nghiên cứu Nhật Bản."], ["Japonaiserie", "Đồ Nhật hoặc đồ giả Nhật dùng làm mốt, trang trí; tầng bề mặt."], ["Estampe / ukiyo-e", "Tranh khắc gỗ in nhiều màu của Nhật (Hokusai, Hiroshige, Utamaro, Kiyonaga, Eisen)."], ["Hokusai Manga", "Tập phác thảo của Hokusai; “manga” ở đây nghĩa là hình vẽ tự phát, tốc ký."], ["Kakemono", "Tranh cuộn treo tường."], ["Katagami", "Khuôn in vải bằng giấy vỏ dâu tằm."], ["Mon", "Huy hiệu gia tộc Nhật, tương đương huy hiệu châu Âu."], ["Tsuba", "Miếng chắn tay của kiếm Nhật."], ["Inro", "Hộp nhỏ đeo ở thắt lưng vì kimono không có túi."], ["Surimono", "Tranh khắc in riêng làm quà, trao đổi dịp năm mới."], ["Shoji", "Vách trượt khung gỗ đen dán giấy gạo."], ["Khủng hoảng hệ hình", "Lúc mô hình tư duy cũ (hàn lâm, lý trí Descartes) mất sức thuyết phục, mở đường cho mô hình mới."], ["Nishiki-e", "‘Tranh gấm’: tranh khắc gỗ in nhiều màu, phổ biến từ 1765 với Suzuki Harunobu."], ["Bijin-ga", "Tranh mỹ nhân, kỹ nữ: đề tài chính của Utamaro, Kiyonaga, Eisen."], ["Meisho-e", "Tranh danh thắng: bộ Phú Sĩ của Hokusai, Một trăm danh thắng Edo của Hiroshige."], ["Hashira-e", "Tranh cột: khổ dọc rất hẹp, treo trên cột nhà."], ["Sakoku", "Chính sách đóng cửa của Mạc phủ Tokugawa (1630s–1854); chỉ Hà Lan và Trung Hoa được buôn bán qua Nagasaki."], ["Dejima", "Đảo nhân tạo trước cảng Nagasaki, thương điếm Hà Lan 1641–1859."], ["Cloisonnisme", "Lối vẽ mảng màu phẳng viền đậm của Bernard, Anquetin (1887–88), tên lấy từ men cloisonné."], ["Nabis", "Nhóm hoạ sĩ trẻ (Sérusier, Bonnard, Vuillard, Denis) từ 1888, đề cao mặt phẳng và trang trí."], ["Art Nouveau", "Phong cách trang trí 1890–1910 với đường cong thực vật; tên lấy từ cửa hàng của Bing."], ["Ly khai Vienna", "Secession, nhóm nghệ sĩ tách khỏi hội hàn lâm năm 1897, Klimt làm chủ tịch."], ["Katazome", "Kỹ thuật nhuộm vải dùng khuôn katagami và hồ gạo chống màu."], ["Hệ hình", "Bộ quy tắc và ví dụ mẫu mà một cộng đồng mặc nhiên chấp nhận (theo Thomas Kuhn)."], ["Shunga", "Tranh khắc khiêu dâm Nhật; được giới sưu tầm Paris như Goncourt mua."], ["Netsuke", "Tượng nhỏ bằng ngà hoặc gỗ, dùng làm khuy treo túi trên kimono; món sưu tầm phổ biến."], ["Nhóm Batignolles", "Tên gọi nhóm Manet, Monet, Renoir, Degas trước khi thành ‘Ấn tượng’ (1874)."], ["Nabi", "Tiếng Hebrew nghĩa là ‘nhà tiên tri’; tên nhóm Bonnard, Vallotton, Denis."]]}, {"type": "table", "title": "Nhân vật thường gặp", "columns": ["Tên", "Vai trò trong câu chuyện"], "widths": [26, 74], "rows": [["Samuel (Siegfried) Bing", "Nhà buôn gốc Đức ở Paris, cửa hàng L'Art japonais (1874) sau thành Art Nouveau; xuất bản Le Japon artistique."], ["Louis Gonse", "Tác giả L'Art japonais (1883), cùng Bing tổ chức triển lãm."], ["Philippe Burty", "Đặt ra từ “japonisme” khoảng 1872."], ["Félix Bracquemond", "Người đầu tiên làm việc trực tiếp với Hokusai Manga, cho bộ đồ ăn Rousseau."], ["Whistler, Monet, Manet, Tissot, Stevens", "Thế hệ đầu, phần lớn ở tầng mốt, sau đó (Monet, Whistler) đi vào cấu trúc."], ["Van Gogh, Degas, Toulouse-Lautrec", "Ba trường hợp đồng hoá sâu, phân tích trong video 2."], ["Klimt, Horta, Mackintosh", "Art Nouveau và Ly khai Vienna, học từ dệt may và kiến trúc Nhật."], ["Gallé, Daum, Lalique, Tiffany", "Thuỷ tinh, trang sức Art Nouveau dùng motif Nhật."], ["Théodore Duret", "Nhà phê bình, bênh vực nhóm Ấn tượng; đi Nhật cùng Cernuschi (1871–73)."], ["Henri Cernuschi", "Chủ ngân hàng, nhà sưu tầm; dinh thự thành Bảo tàng Cernuschi."], ["Émile Guimet", "Nhà công nghiệp Lyon, đi Nhật năm 1876, lập Bảo tàng Guimet."], ["Félix Régamey", "Hoạ sĩ đi Nhật cùng Guimet, ghi lại sự vỡ mộng trước một nước Nhật đang Tây hoá."], ["Henri Rivière", "Nghệ sĩ khắc gỗ, rối bóng Chat Noir; ‘Ba mươi sáu cảnh tháp Eiffel’."], ["Pierre Bonnard", "Hoạ sĩ nhóm Nabis, biệt danh ‘le Japonard’."], ["Félix Vallotton", "Hoạ sĩ Thuỵ Sĩ nhóm Nabis, tranh khắc gỗ đen trắng, ‘Điệu valse’."]]}]}, "sources": {"page": "sources", "title": "Nguồn", "group": "Tra cứu", "lead": "Toàn bộ nguồn theo từng trang. Hai video là nguồn chính; sách của Wichmann là tài liệu tham khảo mà video nêu.", "sources": [{"name": "Siegfried Wichmann, Japonisme: The Japanese Influence on Western Art since 1858, Thames and Hudson, 1999 (theo mô tả video, chưa đối chiếu trực tiếp)", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "1999"}, {"name": "Danh sách phát “Le Japonisme”, kênh Art d'Histoire", "url": "https://www.youtube.com/playlist?list=PLI9v7o9esYUjf1sxRMSWQMa-dhganiYtn", "date": "cập nhật 21/04/2020"}], "blocks": [{"type": "allsources", "title": "Nguồn theo trang"}]}, "compare": {"page": "compare", "title": "Đối chiếu tranh: Nhật Bản và châu Âu", "group": "Phân tích tranh", "lead": "9 cặp tranh đặt cạnh nhau, tranh Nhật bên trái, tranh châu Âu bên phải. Mỗi cặp chỉ ra một thủ pháp cụ thể đã đổi cách người châu Âu dựng không gian, cắt khung và đặt người xem.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2 Histoire d'un plagiat ?”", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 2/2, van Gogh, Degas et Lautrec”", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Ảnh tác phẩm: Wikimedia Commons (phạm vi công cộng / CC0); link từng ảnh ở chú thích khi phóng to", "url": "https://commons.wikimedia.org/", "date": "truy cập 10/2026"}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài hai bài giảng, do người tổng hợp biên soạn", "date": ""}], "blocks": [{"type": "callout", "tone": "info", "title": "Cách xem trang này", "items": ["Bấm vào ảnh để phóng to. Chú thích khi phóng to có link tới trang gốc trên Wikimedia Commons.", "Cặp 1, 2, 3 là tranh Van Gogh chép trực tiếp từ bản Nhật, được nhắc trong video 2. Cặp 4 và 6 dựa trên những gì người giảng nói về Whistler và Degas.", "Cặp 5, 7, 8, 9 do người tổng hợp chọn để minh hoạ lập luận của bài giảng, không phải bằng chứng là hoạ sĩ đã xem đúng bức đó."]}, {"type": "story", "title": "Đọc sâu: tự đối chiếu một cặp tranh như thế nào", "items": [{"title": "Sáu câu hỏi khi đặt hai bức cạnh nhau", "bullets": ["Khung: tranh cắt ở đâu, có tiền cảnh nào bị cắt không?", "Điểm nhìn: người xem đứng ở đâu, cao hay thấp, xa hay sát?", "Không gian: có điểm tụ phối cảnh không, hay các lớp xếp chồng phẳng?", "Màu: mảng phẳng hay đánh bóng, có viền không?", "Khoảng trống: phần nào để trống, nó đóng vai trò gì?", "Thay đổi: hoạ sĩ châu Âu giữ gì, bỏ gì, thêm gì so với mẫu Nhật?"], "src": [3]}, {"title": "Chép, mượn, đồng hoá", "paras": ["Các cặp trên trang này nằm trên một thang ba bậc. Chép: Van Gogh chép Hiroshige, Eisen gần như nguyên hình. Mượn: Whistler, Monet lấy một bố cục (cây cầu, khung nhìn qua) rồi vẽ cảnh châu Âu. Đồng hoá: Degas, Lautrec không còn dấu vết hình ảnh Nhật nào, chỉ còn cách cắt khung và nét vẽ.", "Bậc thứ ba là nơi người giảng gọi là ‘đạo văn’ khó nhận ra nhất và cũng là ảnh hưởng sâu nhất."], "src": [3]}]}, {"type": "diagram", "kicker": "Cận cảnh, tiền cảnh bị cắt", "title": "1. Hiroshige và Van Gogh: vườn mận Kameido", "img": "p01", "note": "Hiroshige đặt một thân mận khổng lồ ngay sát mắt, bị mép tranh cắt mất ngọn và gốc; khu vườn và người đi dạo nhỏ xíu phía sau. Chiều sâu không đến từ phối cảnh lùi xa mà từ hai tầng “rất gần” và “rất xa”. Van Gogh chép bằng giấy can rồi phóng ô, nhưng đẩy màu lên: trời đỏ đậm hơn, đặt cạnh xanh lục và vàng. Ông thêm khung viền với chữ Hán chép từ tranh khác mà không hiểu nghĩa; theo người giảng, có chữ là quảng cáo nhà kỹ nữ."}, {"type": "diagram", "kicker": "Đường chéo, mưa thành nét kẻ", "title": "2. Hiroshige và Van Gogh: cây cầu trong mưa", "img": "p02", "note": "Cây cầu đâm chéo qua khung từ góc dưới, không thấy hai đầu cầu; bờ bên kia chỉ là một dải mờ, không có đường chân trời. Mưa được vẽ thành những đường thẳng song song phủ lên toàn cảnh, điều hội hoạ hàn lâm không bao giờ làm. Van Gogh giữ nguyên đường chéo, biến mưa thành nét sơn, đổi cầu sang vàng, nước sang xanh lục đậm, và lại bao quanh bằng khung chữ Nhật tự chế."}, {"type": "diagram", "kicker": "Đường viền đen, hoa văn trải phẳng", "title": "3. Eisen qua bìa Paris Illustré và Van Gogh: kỹ nữ", "img": "p03", "note": "Bìa số đặc biệt “Le Japon” (5/1886) in ngược hình một kỹ nữ của Keisai Eisen; theo người giảng, số báo này cũng là nơi Van Gogh đọc bài của Hayashi nói khí hậu Nhật giống Ý, lý do ông xuống Arles. Van Gogh phóng to nhân vật, giữ đường viền đen dày và áo kimono trải phẳng như một mặt hoa văn, không đánh khối. Ông đặt bà vào một khung vàng, quanh là ao nước, tre, ếch, sếu ghép từ các tranh khắc khác."}, {"type": "diagram", "kicker": "Cận cảnh cây cầu, gần như đơn sắc", "title": "4. Hiroshige và Whistler: cây cầu về đêm", "img": "p04", "note": "Hiroshige cho trụ cầu Kyōbashi chắn ngang khung, trăng tròn, người lái thuyền đứng chống sào. Whistler phóng to một trụ cầu Battersea cho tới khi nó bị mép trên cắt mất, gần như chỉ còn hai màu xanh và vàng như đồ sơn mài. Người giảng chỉ ra cả tư thế người chèo đứng trên thuyền: rất Nhật, ít khả năng là thói quen của người lái đò Anh. Cảnh London giờ được nhìn qua “con mắt Nhật”."}, {"type": "diagram", "kicker": "Khung trong khung, không còn bầu trời", "title": "5. Hiroshige và Monet: nhìn qua, nhìn sát", "img": "p05", "note": "Hiroshige bắt người xem nhìn qua vòng cành thông cuộn tròn: một khung nằm trong khung, cảnh xa bị bó lại. Monet xây hẳn một “cầu Nhật” ở vườn Giverny và vẽ nó sát đến mức cầu bị cắt hai đầu, không còn bầu trời hay đường chân trời; mặt ao súng dựng đứng như một mảng phẳng. Người giảng nhắc Monet treo kín tường phòng khách bằng tranh khắc Nhật và vẽ theo loạt, như các loạt cảnh Edo, Phú Sĩ."}, {"type": "diagram", "kicker": "Nhìn từ trên xuống, sàn dốc lên", "title": "6. Kiyonaga và Degas: người phụ nữ tắm", "img": "p06", "note": "Tranh nhà tắm của Kiyonaga là một trong những bản Degas treo ở phòng ngủ. Cảnh sinh hoạt thường ngày, cơ thể đang làm việc chứ không tạo dáng, sàn gỗ lùi theo đường chéo và được nhìn từ trên cao. Trong Le Tub, Degas nhìn thẳng xuống bồn tắm; chiếc kệ bên phải dựng đứng như một vách phẳng mà đồ vật lại nhìn từ trên. Mỗi vật một góc nhìn, người phụ nữ bị “kéo khỏi bệ thờ” như Huysmans nhận xét."}, {"type": "diagram", "kicker": "Tốc ký chuyển động, khoảng trống", "title": "7. Hokusai Manga và Degas: bắt cử động giữa chừng", "img": "p07", "note": "Hokusai Manga là những hình ký hoạ nhanh, bắt cơ thể đúng lúc đang leo, ngã, vật lộn: người giảng gọi đó là “tốc ký” chuyển động. Degas đẩy hai vũ nữ lên góc trên, chân giơ ngang thanh gióng đúng khoảnh khắc kéo giãn. Gần nửa tranh là sàn gỗ trống chạy chéo: khoảng trống được dùng như một thành phần, đối lập với góc dồn người."}, {"type": "diagram", "kicker": "Cận cảnh hoa, tràn khung", "title": "8. Hiroshige và Van Gogh: hoa diên vĩ", "img": "p08", "note": "Diên vĩ là motif Nhật cổ điển; theo người giảng, nghệ sĩ châu Âu học lại cách vẽ hoa này từ sách dạy vẽ Nhật. Hiroshige cho cành diên vĩ cao vượt khung, bị cắt ở mép trên, cánh đồng phía sau thu nhỏ. Van Gogh bỏ hẳn trời và chân trời: hoa lá tràn ra mọi mép tranh, mỗi bông có đường viền rõ, mảng màu xanh lam đặt phẳng, một bông trắng lẻ làm điểm nhấn."}, {"type": "diagram", "kicker": "Nét lặp, nhịp xoáy", "title": "9. Hokusai và Van Gogh: từ sóng đến bầu trời", "img": "p09", "note": "Sóng của Hokusai được dựng bằng các đường cong lặp lại và bọt sóng như móng vuốt, núi Phú Sĩ tí hon ở hậu cảnh. Người giảng cho rằng lối nét “que” và nhịp sóng trong tranh và ký hoạ Van Gogh, đến tận bầu trời Đêm đầy sao, học trực tiếp từ sách dạy vẽ của Hokusai rồi được ông biến thành của riêng. Cây bách bị mép trên cắt mất cũng là một tiền cảnh cắt kiểu Nhật."}, {"type": "table", "title": "Tóm tắt 9 cặp", "columns": ["Cặp", "Thủ pháp Nhật", "Châu Âu làm gì với nó"], "widths": [30, 30, 40], "rows": [["1. Kameido → Van Gogh", "Thân cây sát mắt, hậu cảnh tí hon", "Chép, đẩy màu bổ túc, thêm khung chữ"], ["2. Ōhashi → Van Gogh", "Cầu chéo, mưa thành nét kẻ", "Biến nét kẻ thành nét cọ"], ["3. Eisen → Van Gogh", "Đường viền, hoa văn phẳng", "Phóng to, đặt vào khung, ghép motif"], ["4. Kyōbashi → Whistler", "Trụ cầu chắn khung, người đứng thuyền", "Cận cảnh gần đơn sắc, cảnh London kiểu Nhật"], ["5. Ueno → Monet", "Khung trong khung", "Cầu cắt hai đầu, bỏ bầu trời"], ["6. Kiyonaga → Degas", "Cảnh tắm thường ngày, nhìn từ trên", "Nhiều góc nhìn trong một tranh"], ["7. Manga → Degas", "Tốc ký chuyển động", "Bắt khoảnh khắc, khoảng trống chéo"], ["8. Horikiri → Van Gogh", "Hoa cận cảnh, cắt mép", "Tràn khung, viền rõ, màu phẳng"], ["9. Sóng → Van Gogh", "Đường cong lặp, nhịp", "Nét que, xoáy trên bầu trời"]]}]}, "culture": {"page": "culture", "title": "Ngoài hội hoạ: sân khấu, âm nhạc, văn chương", "group": "Bối cảnh", "lead": "Theo phim tài liệu của Artistik TV, trong chưa đầy 50 năm Japonisme tràn từ hội hoạ sang nghệ thuật trang trí, opera, operetta, tiểu thuyết, múa và âm nhạc. Phần lớn là một nước Nhật được tưởng tượng.", "sources": [{"name": "Artistik TV, “Japonisme : comment l'art japonais a-t-il révolutionné la peinture occidentale ?” (phim “Quand les impressionnistes découvrent le Japon”, đạo diễn Jérôme Lambert, Philippe Picard, Andana Films)", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4", "date": "2018"}, {"name": "Phim tài liệu ADN, phút 7:57: geisha, Burty, Le Figaro", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=477s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 9:29: Saint-Saëns, La Princesse jaune", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=569s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 29:41: The Mikado và định nghĩa ukiyo-e", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=1781s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 47:23: Loïe Fuller, Debussy", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2843s", "date": "Artistik TV"}], "blocks": [{"type": "timeline", "title": "Các tác phẩm mang Nhật lên sân khấu và trang sách", "items": [{"when": "1872", "title": "Saint-Saëns, ‘La Princesse jaune’", "text": "Vở opera một màn, lần đầu âm nhạc Pháp nói về Nhật, hay đúng hơn, về hình dung của Pháp về Nhật.", "detail": [["Cốt truyện", "Nhân vật Cornélius phải lòng một geisha trong tờ tranh khắc, làm vị hôn thê ghen. Phim gọi đây là ‘đỉnh cao của sự sùng bái’."]], "src": [2]}, {"when": "1885", "title": "Gilbert và Sullivan, ‘The Mikado’", "text": "Operetta công diễn ở London tháng 3/1885, diễn nhiều năm ở London và New York.", "detail": [["Phản ứng", "Một tờ báo London viết ngày hôm sau: ‘Tất cả chúng ta đều là người Nhật’. Khán giả đến để cười những phong tục ‘kỳ lạ và dễ thương’ của người Nhật."], ["Đọc lại", "Phim cho rằng thể loại giải trí ‘nhẹ’ này lại hợp với tinh thần ukiyo-e: sống cho hiện tại, theo dòng đời như trái bầu trôi trên nước."]], "src": [3]}, {"when": "1887", "title": "Pierre Loti, ‘Madame Chrysanthème’", "text": "Tiểu thuyết bán chạy về mối tình tạm bợ của một sĩ quan hải quân Pháp ở Nagasaki, củng cố hình ảnh geisha trong trí tưởng tượng châu Âu.", "src": [3]}, {"when": "1900", "title": "Loïe Fuller và ‘Geisha và hiệp sĩ’", "text": "Ở Triển lãm thế giới, Loïe Fuller giới thiệu đoàn kịch Nhật trên sân khấu của bà; Cocteau thấy bà như ‘bông lan bằng ánh sáng và vải’.", "src": [4]}, {"when": "1905", "title": "Debussy, ‘La Mer’", "text": "Debussy nói lấy cảm hứng từ Sóng lớn của Hokusai treo trong căn hộ; bìa tổng phổ in bức tranh. Một số người gọi đây là âm nhạc ấn tượng.", "src": [4], "img": "debussy-mer"}]}, {"type": "story", "title": "Geisha: biểu tượng của một nước Nhật tưởng tượng", "items": [{"title": "Từ tranh khắc đến tranh salon", "paras": ["Sau Triển lãm thế giới 1867, các hoạ sĩ được giới tư sản ưa chuộng ở Brussels, London, Paris như James Tissot, Alfred Stevens, John Singer Sargent vẽ phụ nữ châu Âu mặc kimono giữa đồ Nhật. Phim gọi đây là một biến thể của chủ nghĩa phương Đông (orientalism).", "Hình geisha xuất hiện khắp nơi, vừa xa cách vừa gợi cảm, thành biểu tượng của một ‘đất nước trong mơ’."], "src": [1], "img": "monet-japonaise", "caption": "Monet, La Japonaise, 1876: tầng mốt kimono"}, {"title": "Những tiếng nói chế giễu", "paras": ["Le Figaro viết rằng Japonisme ‘là một đam mê, một tôn giáo, một cơn mê’, nhưng những người mê Nhật không hề vẽ một nước Nhật thật và sống: hầu hết chỉ biết Nhật qua album tranh khắc hay vài món đồ mua ở phố Vivienne.", "Lời chê này đúng với tầng bề mặt. Nhưng chính từ những album tranh khắc ấy, các hoạ sĩ tiên phong học được cách nhìn, như trang ‘Khủng hoảng hệ hình’ phân tích."], "src": [1]}, {"title": "Shunga: phần ít được kể", "paras": ["Album tranh khắc khiêu dâm (shunga) cũng sang châu Âu và được giới sưu tầm như Edmond de Goncourt mua. Phim nhấn mạnh một khác biệt: khác với tranh khiêu dâm châu Âu cùng thời, shunga vẽ phụ nữ có khoái cảm ngang với nam giới, và Goncourt nhìn chúng như một trò chơi của bố cục, đạo cụ, tư thế hơn là của dục vọng."], "src": [3]}]}, {"type": "callout", "tone": "info", "title": "Ukiyo-e theo định nghĩa của Asai Ryōi (thế kỷ 17)", "items": ["Chỉ sống cho hiện tại; ngắm hoa anh đào và lá thu; yêu rượu, đàn bà và lời ca; để dòng đời cuốn đi như trái bầu trôi theo nước: đó là cái ta gọi là ukiyo, thế giới phù du."], "src": [3]}]}, "impression": {"page": "impression", "title": "Monet và nhóm Ấn tượng", "group": "Nghệ sĩ", "lead": "Trước khi có tên ‘Ấn tượng’, nhóm Batignolles từng được gọi là ‘những người Nhật’. Từ cách cắt khung của Manet đến chuỗi Hoa súng của Monet, tranh khắc Nhật đi cùng họ suốt chặng đường.", "sources": [{"name": "Artistik TV, “Japonisme : comment l'art japonais a-t-il révolutionné la peinture occidentale ?” (phim “Quand les impressionnistes découvrent le Japon”, đạo diễn Jérôme Lambert, Philippe Picard, Andana Films)", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4", "date": "2018"}, {"name": "Phim tài liệu ADN, phút 11:35: Fantin-Latour, Một xưởng vẽ ở Batignolles", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=695s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 13:58: Whistler, The Balcony", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=838s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 19:22: Manet, En bateau; xưởng nổi của Monet", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=1162s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 21:23: Triển lãm 1874 và chữ ‘impressionniste’", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=1283s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 27:38: Monet ở Giverny", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=1658s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 38:56: Monet và vẽ theo loạt", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2336s", "date": "Artistik TV"}], "blocks": [{"type": "story", "title": "Năm chặng của Japonisme trong nhóm Ấn tượng", "items": [{"title": "1870: tượng Minerva và chiếc bình Nhật", "img": "fantin-batignolles", "paras": ["Trong ‘Một xưởng vẽ ở Batignolles’, Fantin-Latour vẽ Manet bên giá vẽ, quanh ông là Renoir, Monet, Zola và các bạn trẻ. Cạnh Manet có hai vật: tượng thạch cao nữ thần Minerva, tượng trưng cho cổ đại, và một chiếc bình gốm Nhật, tượng trưng cho cái mới.", "Phim đọc đây là lựa chọn của cả thế hệ: họ vẫn kính trọng cổ đại, nhưng không chịu nổi những người đã ‘ướp xác’ nó, tức giới hàn lâm. Manet chế giễu một tranh chiến trận của Meissonier: ‘Mọi thứ đều bằng thép, trừ áo giáp’."], "src": [1]}, {"title": "1870–71: London, Whistler và ban công", "img": "whistler-balcony", "paras": ["Tránh chiến tranh Pháp–Phổ, Monet, Pissarro, Sisley sang London, xem Turner ở National Gallery. Monet lui tới xưởng của Whistler, người sưu tầm đồ Nhật.", "Theo phim, ‘The Balcony’ của Whistler lấy bố cục từ một tranh trong bộ Ba mươi sáu cảnh núi Phú Sĩ của Hokusai, nhưng thay núi Phú Sĩ bằng bờ sông Thames với ống khói nhà máy. Ở đây Monet gặp lại Théodore Duret, một trong số ít nhà phê bình bênh vực nhóm Batignolles."], "src": [2]}, {"title": "1874: Manet cắt đôi con thuyền", "img": "manet-boating", "paras": ["Mùa hè 1874, Manet đến vẽ cùng Monet, Renoir ở Argenteuil. Trong ‘En bateau’, khung hình sát và chỉ giữ phần đuôi thuyền, mặt nước dựng lên chiếm cả nền, không có đường chân trời. Phim xem đây là bố cục chịu ảnh hưởng rõ của tranh Hokusai.", "Monet làm hẳn một chiếc thuyền xưởng để vẽ giữa sông. Ông nói muốn vẽ ‘không khí bao quanh cây cầu, ngôi nhà, con thuyền’, điều ông tự gọi là không thể."], "src": [3]}, {"title": "1874: từ ‘người Nhật’ thành ‘người Ấn tượng’", "img": "monet-impression", "paras": ["Tháng 4/1874, nhóm tự tổ chức triển lãm ở xưởng cũ của nhiếp ảnh gia Nadar, đại lộ Capucines, với khoảng 30 hoạ sĩ, trong đó có Cézanne, Degas, Monet, Sisley, Pissarro, Renoir, Berthe Morisot. Tờ Le Charivari chế giễu bức ‘Ấn tượng, mặt trời mọc’ của Monet.", "Một nhà phê bình đáp lại: ban đầu người ta gọi họ là ‘những người Nhật’, nhưng nếu cần một chữ để giải thích họ thì phải đặt chữ mới, ‘impressionniste’, vì họ vẽ không phải phong cảnh mà cảm giác do phong cảnh tạo ra. Triển lãm thất bại về tiền; nhóm tổ chức thêm bảy lần trước khi tan rã."], "src": [4]}, {"title": "1883–1926: Giverny, khu vườn Nhật của Monet", "img": "monet-bridge", "paras": ["Từ năm 1883, Monet sống ở Giverny. Ông treo bộ sưu tập tranh khắc Nhật khắp nhà, nhiều nhất là Utamaro, Hiroshige, Hokusai, và cho xây một cây cầu kiểu Nhật bắc qua ao súng. Hoa cúc, diên vĩ, mẫu đơn trong vườn đi thẳng vào tranh.", "Duret viết rằng Monet là người đầu tiên dám đẩy màu xa như vậy, và bị chế giễu vì ‘con mắt lười của người châu Âu’ vẫn coi gam màu tinh tế của nghệ sĩ Nhật là tô vẽ loè loẹt."], "src": [5]}]}, {"type": "media", "title": "Vẽ theo loạt: từ Phú Sĩ đến đụn lúa mì", "img": "monet-stacks", "text": "Ngưỡng mộ Ba mươi sáu cảnh núi Phú Sĩ, Monet chọn một đề tài có hình đơn giản, đụn lúa mì, rồi vẽ đi vẽ lại theo giờ và mùa để bắt những ấn tượng thoáng qua của ánh sáng. Từ đó, gần như toàn bộ tranh của ông đi theo loạt.", "bullets": ["Đụn lúa mì (1890–91), Nhà thờ Rouen, rồi hàng trăm bức Hoa súng.", "Cùng thời, Henri Rivière làm ‘Ba mươi sáu cảnh tháp Eiffel’, chuẩn bị bằng máy ảnh (xem trang Gauguin, Rivière và Nabis).", "Khác Hokusai đổi góc nhìn quanh một ngọn núi, Monet giữ góc nhìn và đổi thời điểm: đề tài chính là thời gian và ánh sáng."], "src": [6]}, {"type": "media", "title": "Hoa súng: chạm đến trừu tượng", "img": "monet-nympheas", "side": "right", "text": "Monet kể ông trồng hoa súng mà không nghĩ sẽ vẽ, rồi ‘đột nhiên’ thấy được vẻ kỳ ảo của cái ao và từ đó không vẽ gì khác. Không có bờ, không có chân trời, chỉ còn mặt nước, mây phản chiếu và lá: những bức cuối gần như trừu tượng.", "bullets": ["Phim nối việc ‘vét cạn một đề tài’ này với tinh thần Nhật: bắt vẻ đẹp của khoảnh khắc, chấp nhận sự vô thường.", "Về già, cách Monet nhìn thiên nhiên được phim so với Thần đạo (Shintō). Guimet từng viết: ở Nhật, thần ở trong mỗi cái cây, mỗi tảng đá, phong cảnh như một con người có tâm trạng."], "src": [6]}, {"type": "callout", "tone": "info", "title": "Câu hỏi mở", "items": ["Phim nhấn mạnh nhiếp ảnh và tranh khắc Nhật cùng lúc giải phóng hoạ sĩ khỏi việc mô phỏng. Hai nguồn này củng cố nhau: cả hai đều cắt khung bất ngờ và bắt khoảnh khắc. Khó tách bạch đâu là phần của Nhật, đâu là phần của ống kính."], "src": [4]}]}, "nabis": {"page": "nabis", "title": "Gauguin, Rivière và nhóm Nabis", "group": "Nghệ sĩ", "lead": "Thế hệ sau Ấn tượng không học từ Nhật cách bắt ánh sáng, mà cách vẽ bằng mảng màu phẳng, bỏ khối và chiều sâu. Từ ‘Thị kiến sau bài giảng’ của Gauguin đến ‘Bonnard le Japonard’.", "sources": [{"name": "Artistik TV, “Japonisme : comment l'art japonais a-t-il révolutionné la peinture occidentale ?” (phim “Quand les impressionnistes découvrent le Japon”, đạo diễn Jérôme Lambert, Philippe Picard, Andana Films)", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4", "date": "2018"}, {"name": "Phim tài liệu ADN, phút 36:50: Gauguin ở Pont-Aven", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2210s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 37:56: Henri Rivière, Chat Noir, tháp Eiffel", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2276s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 42:08: Le Japon artistique 1891 và nhóm Nabis", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2528s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 44:09: Vallotton, La Valse", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2649s", "date": "Artistik TV"}], "blocks": [{"type": "media", "title": "Gauguin: thân cây chéo chia đôi hai thế giới", "img": "gauguin-vision", "text": "‘Thị kiến sau bài giảng’ (1888), vẽ ở Pont-Aven, đánh dấu Gauguin dứt khỏi Ấn tượng: mảng màu phẳng thay cho nét cọ nhỏ. Không có gì trong đề tài gợi đến Nhật, nhưng ảnh hưởng nằm ở cấu trúc.", "bullets": ["Hai thang tỉ lệ và hai không gian cùng có trên tranh: các phụ nữ Bretagne ở tiền cảnh và cảnh Jacob vật lộn với thiên thần trên nền đỏ.", "Một thân táo chạy chéo qua tranh tách hai thế giới, theo phim là mượn từ một tranh khắc của Hiroshige.", "Gauguin không tin vào ‘miền Nam Nhật Bản’ của Van Gogh; ảnh hưởng Nhật ở ông là ngôn ngữ hình, không phải giấc mơ địa lý."], "src": [1]}, {"type": "media", "title": "Henri Rivière: Hokusai ở Paris", "img": "riviere-eiffel", "side": "right", "text": "Rivière dựng sân khấu múa rối bóng ở quán Chat Noir, Montmartre: những hình cắt đen trên màn trắng. Từ 1888 ông làm ‘Ba mươi sáu cảnh tháp Eiffel’, vừa tôn vinh ngọn tháp mới, vừa tôn vinh Hokusai, mà ông sở hữu bộ Ba mươi sáu cảnh núi Phú Sĩ.", "bullets": ["Ông tự khắc gỗ như nghệ nhân Nhật; mỗi tờ là một biến thể của cùng đề tài, đổi người, khung hình theo mùa.", "Khác nhóm Ấn tượng vẽ tại chỗ, Rivière cầm máy ảnh đi chuẩn bị: máy ảnh, nay nhỏ gọn và phổ biến, thành cuốn sổ phác thảo mới."], "src": [2]}, {"type": "callout", "tone": "info", "title": "Le Japon artistique, 1891", "items": ["Một bài trên tạp chí của Bing khẳng định ảnh hưởng của Viễn Đông là một sự thật đã rồi, và chỉ có thể so với tác động của cổ đại lên thời Phục hưng."], "src": [3]}, {"type": "story", "title": "Nhóm Nabis: ‘những nhà tiên tri’", "items": [{"title": "Một cái nhìn tinh thần, chống hiện thực", "paras": ["Cuối thế kỷ, Maurice Denis, Félix Vallotton, Pierre Bonnard và các bạn tự gọi là Nabi, tiếng Hebrew nghĩa là ‘nhà tiên tri’, để nhấn mạnh tham vọng làm mới hội hoạ. Họ bảo vệ một cái nhìn tinh thần về thế giới và từ chối chủ nghĩa hiện thực."], "src": [3]}, {"title": "Bonnard, ‘le Japonard’", "img": "bonnard-femmes", "paras": ["Bạn bè gọi Bonnard là ‘Bonnard le Japonard’. Ông kể rằng khi tiếp xúc với những tranh in bình dân ấy, ông hiểu màu sắc có thể diễn tả mọi thứ mà không cần khối hay đánh bóng: ánh sáng, hình dáng, tính cách đều dịch được chỉ bằng màu.", "Với ‘Phụ nữ trong vườn’, ông mượn khổ dọc hẹp của kakemono, tranh lụa cuộn treo tường. Các nhân vật trôi trong một không gian giống tranh khắc Nhật, nhưng phong cách và thế giới hoàn toàn của riêng ông."], "src": [3]}, {"title": "Vallotton đi xa hơn", "img": "vallotton-valse", "paras": ["Hoạ sĩ Thuỵ Sĩ Félix Vallotton cũng lấy cách tổ chức không gian từ Nhật. Trong ‘Điệu valse’ (1893), các cặp đôi đan vào nhau thành những đường elip uốn lượn, thân người như bay khỏi mặt sàn, rời xa hiện thực. Những đốm màu xung quanh là không gian, ánh sáng hay chuyển động? Phim để câu hỏi mở."], "src": [4]}]}]}}}</script>
<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('site-data').textContent);
const P = DATA.pages || {}, NAV = DATA.nav || [], IMG = DATA.images || {};
const view = document.getElementById('view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const arr = a => Array.isArray(a) ? a : (a == null || a === '' ? [] : [a]);
const it = x => (typeof x === 'string' || typeof x === 'number') ? {text: String(x)} : (x && typeof x === 'object' ? x : {});
const pad2 = n => String(n).padStart(2, '0');
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let CUR = null, ONPAGE = false;

// ---------- text helpers
function fmt(s){
  let h = esc(s);
  h = h.replace(/^Nhận định:/, '<span class="nd">Nhận định:</span>');
  return h.replace(/\(1 nguồn\)/g, '<span class="src1">(1 nguồn)</span>');
}
function sup(page, list){
  const srcs = (page && page.sources) || [];
  const ids = [];
  arr(list).forEach(i => { i = Number(i); if(Number.isInteger(i) && srcs[i] && !ids.includes(i)) ids.push(i); });
  if(!ids.length) return '';
  const one = i => { const s = srcs[i] || {}; const t = esc((s.name||'') + (s.date ? ', ' + s.date : '')); return s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${t}">${i+1}</a>` : `<span class="n" title="${t}">${i+1}</span>`; };
  const rest = ids.slice(3);
  return `<sup class="s">${ids.slice(0,3).map(one).join(' ')}${rest.length ? ` <button type="button" class="more" aria-expanded="false" title="Xem thêm ${rest.length} nguồn">+${rest.length}</button><span class="rest" hidden> ${rest.map(one).join(' ')}</span>` : ''}</sup>`;
}
function line(p, x){ x = it(x); return fmt(x.text) + sup(p, x.src); }
function tags(list){ list = arr(list).filter(Boolean); return list.length ? `<div class="tags">${list.map(g => `<span class="tag">${esc(g)}</span>`).join('')}</div>` : ''; }
function splitLead(s){
  s = String(s || '');
  if(/^Nhận định:/.test(s)) return null;
  const re = /[.!?]\s+(?=[\p{Lu}\d"“(])/gu; let m;
  while((m = re.exec(s))){ const cut = m.index + 1; if(cut > 130) break; if(cut >= 25 && s.length - cut >= 20) return [s.slice(0, cut), s.slice(cut).trim()]; }
  return null;
}

// ---------- images
function imgSrc(id){ const m = IMG[id] || {}; return 'img/' + (m.file || (id + '.jpg')); }
function frame(id, cap, cls){
  const m = IMG[id]; if(!m) return '';
  const c = cap || m.cap || '';
  return `<button type="button" class="frame ${cls||''}" data-img="${esc(id)}" data-cap="${esc(c)}" aria-label="Phóng to ảnh${c ? ': ' + esc(c) : ''}"><img src="${esc(imgSrc(id))}" alt="${esc(c)}" loading="lazy" decoding="async"${m.w && m.h ? ` width="${+m.w}" height="${+m.h}"` : ''}></button>`;
}
function credit(m){ if(!m.credit && !m.page) return ''; return `<span class="cr">Ảnh: ${esc(m.credit||'')}${m.page ? `${m.credit ? ', ' : ''}<a href="${esc(m.page)}" target="_blank" rel="noopener">nguồn</a>` : ''}</span>`; }
function fig(id, cap, fcls, style, figcls){
  const m = IMG[id]; if(!m) return '';
  const c = cap || m.cap || '';
  return `<figure class="fig ${figcls||''}"${style ? ` style="${style}"` : ''}>${frame(id, c, fcls)}<figcaption>${c ? `<span class="cap">${esc(c)}</span> ` : ''}${credit(m)}</figcaption></figure>`;
}
// balanced rows of at most c items; each item gets a span on a 12-column grid
