<style>
/* v2: same index rail + one reading column, but rebuilt for comfortable reading:
   larger type, whitespace instead of boxes, fixed-ratio photo frames, diagrams in the flywheel language. */
:root{
  --bg:#F2F2EE; --surface:#FFFFFF; --ink:#141619; --text:#24272C; --muted:#5C626A; --faint:#80868E;
  --line:#D8DAD3; --hair:#E4E5DF; --soft:#F7F7F4; --th:#ECEFF6;
  --accent:#2340C4; --accent-ink:#FFFFFF; --accent-soft:#E3E8FA; --accent-line:#B4C1F0;
  --good:#1C7549; --good-soft:#E2F1E7; --warn:#8F5600; --warn-soft:#F9EFD9; --risk:#AE2A20; --risk-soft:#F9E4E0; --info-soft:#E8ECF6;
  --z-art:#DCE3FB; --z-sale:#F4F4F0; --z-service:#DBEFE1; --z-back:#E2E3DF;
  --display:"Newsreader","Iowan Old Style","Times New Roman",serif;
  --body:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --rhythm:68px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1012; --surface:#17191C; --ink:#EEEFF1; --text:#D8DBE0; --muted:#9CA3AD; --faint:#7C838D;
  --line:#2D3137; --hair:#25282D; --soft:#1C1F23; --th:#1D2230;
  --accent:#8FA3FF; --accent-ink:#0F1012; --accent-soft:#1E2649; --accent-line:#3B4885;
  --good:#5CC38C; --good-soft:#13261A; --warn:#E2A64C; --warn-soft:#2A2111; --risk:#F08B80; --risk-soft:#2D1614; --info-soft:#1A1F2B;
  --z-art:#202A55; --z-sale:#1E2125; --z-service:#15291C; --z-back:#282B30; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1012; --surface:#17191C; --ink:#EEEFF1; --text:#D8DBE0; --muted:#9CA3AD; --faint:#7C838D;
  --line:#2D3137; --hair:#25282D; --soft:#1C1F23; --th:#1D2230;
  --accent:#8FA3FF; --accent-ink:#0F1012; --accent-soft:#1E2649; --accent-line:#3B4885;
  --good:#5CC38C; --good-soft:#13261A; --warn:#E2A64C; --warn-soft:#2A2111; --risk:#F08B80; --risk-soft:#2D1614; --info-soft:#1A1F2B;
  --z-art:#202A55; --z-sale:#1E2125; --z-service:#15291C; --z-back:#282B30; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
p{margin:0}
h1,h2,h3{color:var(--ink)}
.muted{color:var(--muted)}

/* ---------- app frame */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:26px 22px 40px}
.brand{display:grid;gap:4px;margin-bottom:20px}
.brand .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand .name{font-family:var(--display);font-size:26px;line-height:1.12;font-weight:500;color:var(--ink)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink);font:inherit;font-size:14.5px}
.navg{margin-top:22px}
.navg h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.navg a{display:block;padding:6px 10px;margin-inline:-10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.45}
.navg a:hover{background:var(--soft)}
.navg a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sidefoot{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.55}
.topbar{display:none;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
.topbar .t{font-family:var(--display);font-size:19px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:9px}
.burger{width:14px;height:10px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;position:relative}
.burger::after{content:"";position:absolute;left:0;right:0;top:2px;border-top:2px solid currentColor}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(10,11,13,.4)}
main{min-width:0;padding:52px clamp(20px,4.2vw,64px) 120px}
.wrap{max-width:1060px;margin-inline:auto;container-type:inline-size;container-name:wrap;min-width:0}

/* ---------- page head */
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,3.7vw,50px);line-height:1.06;letter-spacing:-.012em;margin:10px 0 16px;text-wrap:balance;max-width:20em}
.lead{font-size:19px;line-height:1.62;color:var(--ink);max-width:62ch}
.toc{margin-top:30px;display:grid;gap:10px}
.toc-h{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.toc-c{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tchip{flex:none;display:inline-block;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.tchip:hover{border-color:var(--accent);color:var(--accent)}
@container wrap (min-width:600px){ .toc-c{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none} }

/* ---------- section rhythm */
.block{margin-top:var(--rhythm);scroll-margin-top:28px;min-width:0}
.block.hd{border-top:1px solid var(--line);padding-top:28px}
.kick{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 10px}
h2{font-family:var(--display);font-weight:500;font-size:27px;line-height:1.16;letter-spacing:-.006em;margin:0 0 22px;text-wrap:balance;max-width:30em}
@container wrap (min-width:600px){ h2{font-size:32px;margin-bottom:26px} }
h3{font-size:17px;line-height:1.4;margin:0;font-weight:600}
.lab{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px;line-height:1.5}
.note{font-size:14px;color:var(--muted);margin-top:16px;max-width:80ch;line-height:1.6}
.nd{font-weight:600;color:var(--accent)}
.src1{font-size:.86em;color:var(--warn);white-space:nowrap}
.prose{display:grid;gap:16px;max-width:68ch}
ul.bl{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.bl li{position:relative;padding-left:20px}
ul.bl li::before{content:"";position:absolute;left:3px;top:calc(.85em - 3px);width:6px;height:6px;border-radius:50%;background:var(--accent)}
ul.bl.sm li{font-size:14.5px;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;line-height:1.6;border-radius:99px;padding:1px 9px;color:var(--muted);background:var(--soft);border:1px solid var(--hair)}

/* ---------- source references: at most 3 shown, rest behind +N */
sup.s{font-size:.62em;line-height:0;vertical-align:super;margin-left:.3em;font-weight:600;letter-spacing:0;font-style:normal;white-space:nowrap}
sup.s .rest{white-space:normal}
sup.s a,sup.s .n,sup.s .more{color:var(--muted);text-decoration:none;background:var(--soft);border:1px solid var(--hair);border-radius:4px;padding:.05em .38em;font-variant-numeric:tabular-nums}
sup.s a:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
sup.s .more{font:inherit;line-height:1.25;cursor:pointer;margin:0;vertical-align:baseline}
sup.s .more:hover{color:var(--accent);border-color:var(--accent-line)}

/* ---------- photos: fixed-ratio frames, cover crop, lightbox on click */
.fig{margin:0;min-width:0}
.frame{display:block;position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:10px;background:var(--soft);padding:0;border:0;cursor:zoom-in;appearance:none}
.frame.r32{aspect-ratio:3/2} .frame.r169{aspect-ratio:16/9} .frame.r21{aspect-ratio:21/9}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.frame:hover img{transform:scale(1.025)}
.fig figcaption{font-size:13px;line-height:1.5;color:var(--muted);margin-top:9px}
.fig .cr{color:var(--faint)}
.fig .cr a{color:inherit}

/* gallery: uniform 12-col grid, rows balanced so there are no holes */
.gal{display:grid;grid-template-columns:minmax(0,1fr);gap:24px 18px}
.gal.one{max-width:760px}
@container wrap (min-width:600px){
  .gal{grid-template-columns:repeat(12,minmax(0,1fr))}
  .gal>.fig{grid-column:span var(--st,6)}
  .gal.one{grid-template-columns:minmax(0,1fr)}
  .gal.one>.fig{grid-column:auto}
}
@container wrap (min-width:900px){
  .gal>.fig{grid-column:span var(--sd,4)}
  .gal>.fig.gbig{grid-row:span 2;display:flex;flex-direction:column}
  .gal>.fig.gbig .frame{flex:1 1 auto;aspect-ratio:auto;min-height:280px}
}

/* ---------- summary rows */
.sum{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:52px}
.sum li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:18px 0 20px;border-top:1px solid var(--hair)}
.sum li:first-child{border-top:0;padding-top:2px}
.sn{font-family:var(--display);font-size:25px;line-height:1.05;color:var(--accent);font-variant-numeric:lining-nums tabular-nums}
.st{font-size:17.5px;line-height:1.42;margin-bottom:5px}
@container wrap (min-width:880px){
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sum li{grid-template-columns:46px minmax(0,1fr)}
  .sum li:nth-child(2){border-top:0;padding-top:2px}
  .sn{font-size:27px}
}

/* ---------- media and story: image beside its claim */
.media{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.mtx{display:grid;gap:14px;align-content:start;max-width:68ch;min-width:0}
.mtx h3{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.22}
.story{display:grid;gap:52px}
@container wrap (min-width:640px){
  .media{grid-template-columns:minmax(0,45fr) minmax(0,55fr);gap:36px}
  .media.imgr{grid-template-columns:minmax(0,55fr) minmax(0,45fr)}
  .media.imgr>.fig{order:2}
  .story{gap:60px}
}
dl.facts{margin:4px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:10px;overflow:hidden}
dl.facts>div{background:var(--surface);padding:10px 14px;min-width:0}
dl.facts>div:last-child:nth-child(odd){grid-column:1/-1}
dl.facts dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
dl.facts dd{margin:2px 0 0;font-weight:600;color:var(--ink);font-size:15.5px;line-height:1.45}

/* ---------- timeline and years: vertical rail */
.tl,.yrs{list-style:none;margin:0;padding:0}
.tl>li,.yr{display:grid;grid-template-columns:minmax(0,1fr);row-gap:6px;position:relative;padding:0 0 32px 30px}
.tl>li::before,.yr::before{content:"";position:absolute;left:5px;top:14px;bottom:-14px;width:2px;background:var(--line)}
.tl>li:last-child::before,.yr:last-child::before{display:none}
.tl>li::after,.yr::after{content:"";position:absolute;left:0;top:8px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent)}
.tw,.yw{font-family:var(--display);font-size:20px;line-height:1.25;color:var(--accent);font-variant-numeric:lining-nums}
.tc{display:grid;gap:6px;max-width:66ch;min-width:0}
.tc h3{font-size:17.5px}
.tc p{font-size:16px}
.tlth{width:160px;height:120px;aspect-ratio:auto;border-radius:8px}
@container wrap (min-width:600px){
  .tl>li,.yr{grid-template-columns:96px minmax(0,1fr);column-gap:34px;padding-left:0}
  .tl>li.has-th{grid-template-columns:96px minmax(0,1fr) 160px}
  .tl>li::before,.yr::before{left:112px}
  .tl>li::after,.yr::after{left:107px}
  .tw,.yw{text-align:right;font-size:22px}
}
.yb{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.yg,.yx{border-radius:12px;padding:13px 17px 15px}
.yg{background:var(--good-soft)} .yx{background:var(--risk-soft)}
.yg .lab{color:var(--good)} .yx .lab{color:var(--risk)}
.yg p,.yx p,.yg li,.yx li{font-size:15.5px;line-height:1.62;color:var(--ink)}
.yev{grid-column:1/-1;font-size:13.5px;color:var(--muted);line-height:1.6}
details.yev summary{cursor:pointer;font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:8px}
details.yev summary::-webkit-details-marker{display:none}
details.yev summary::before{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 1.8px 1.8px 0;transform:rotate(-45deg);transition:transform .15s}
details.yev[open] summary::before{transform:rotate(45deg)}
details.yev p{margin-top:6px}
@container wrap (min-width:600px){ .yb{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} }

/* ---------- phases: numbered stages on a cobalt rail */
.ph{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:14px;position:relative;padding-bottom:46px}
.ph::before{content:"";position:absolute;left:16px;top:40px;bottom:6px;width:2px;background:var(--accent-line)}
.ph:last-child::before{display:none}
.ph-n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:500 18px/1 var(--display)}
.ph-c{display:grid;gap:18px;min-width:0}
.ph-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;padding-top:2px}
.ph-h h3{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.2}
.chip{display:inline-block;font-size:12px;letter-spacing:.05em;font-weight:700;border-radius:6px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);line-height:1.5}
.ph-sum{max-width:70ch}
.ph-did ul.bl{display:block}
.ph-did ul.bl li{margin-bottom:8px;break-inside:avoid;font-size:15.5px;line-height:1.62}
.gb{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.gb ul.bl li::before{background:currentColor;opacity:.5}
.ph-num{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:13px 17px;font-size:15.5px;line-height:1.62}
.ph-next{background:var(--accent-soft);border-radius:12px;padding:13px 17px;font-size:15.5px;line-height:1.62;color:var(--ink)}
.ph-next .lab{color:var(--accent)}
@container wrap (min-width:640px){
  .ph{grid-template-columns:44px minmax(0,1fr);column-gap:22px}
  .ph::before{left:21px;top:52px}
  .ph-n{width:44px;height:44px;font-size:21px}
  .ph-h{padding-top:6px}
  .ph-h h3{font-size:26px}
  .gb{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container wrap (min-width:900px){ .ph-did ul.bl{columns:2;column-gap:40px} }

/* ---------- flow: numbered white boxes joined by cobalt arrows */
.flow{display:grid}
.frow{display:grid;grid-template-columns:minmax(0,1fr);align-items:stretch}
.fstep{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.fstep .frame{border-radius:0;margin-top:auto}
.fb{padding:16px 18px 18px;display:grid;gap:7px;align-content:start}
.fn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 14px/1 var(--body)}
.fstep h3{font-family:var(--display);font-weight:500;font-size:20px;line-height:1.25}
.fstep p{font-size:15px;line-height:1.62}
.farr,.fturn{display:flex;justify-content:center;align-items:center;min-height:38px}
.farr svg,.fturn svg{display:block;overflow:visible}
.ah-h{display:none!important}
.fturn i{display:none}
@container wrap (min-width:760px){
  .frow{grid-template-columns:var(--tpl)}
  .farr{min-height:0}
  .ah-h{display:block!important;width:44px;height:14px}
  .ah-v{display:none!important}
  .fturn{--half:calc((100% - (var(--cols) - 1) * 44px) / (2 * var(--cols)));position:relative;height:48px;min-height:0;display:block}
  .fturn::before{content:"";position:absolute;top:0;height:calc(50% + 1px);left:calc(var(--half) + 10px);right:calc(var(--half) - 1px);border:solid var(--accent);border-width:0 2.2px 2.2px 0;border-bottom-right-radius:12px}
  .fturn::after{content:"";position:absolute;top:calc(50% - 1.1px);bottom:8px;left:calc(var(--half) - 1.1px);width:12px;border:solid var(--accent);border-width:2.2px 0 0 2.2px;border-top-left-radius:12px}
  .fturn i{display:block;position:absolute;left:calc(var(--half) - 6px);bottom:0;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--accent)}
}

/* ---------- mindmap: cobalt core, white branches, cobalt connectors */
.mm{display:grid;gap:12px}
.mm-c{order:-1}
.mm-side{display:grid;gap:12px;min-width:0}
.mm-b{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px 14px;min-width:0}
.mm-b h3{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.25}
.mm-b ul{margin:6px 0 0;padding:0 0 0 18px;font-size:14.5px;line-height:1.55;display:grid;gap:3px}
.mm-b li::marker{color:var(--accent)}
.mm-core{position:relative;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px 18px;text-align:center;display:grid;gap:4px}
.mm-core b{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.2}
.mm-core span{font-size:14px;line-height:1.5;opacity:.92}
@container wrap (max-width:759px){
  .mm-side{padding-left:24px}
  .mm-b::before{content:"";position:absolute;left:-18px;top:-13px;bottom:-1px;width:2px;background:var(--accent)}
  .mm-b::after{content:"";position:absolute;left:-18px;top:50%;width:18px;height:2px;background:var(--accent)}
  .mm-r .mm-b:last-child::before,.mm.one .mm-l .mm-b:last-child::before{bottom:50%}
}
@container wrap (min-width:760px){
  .mm{grid-template-columns:minmax(0,1fr) 56px minmax(170px,230px) 56px minmax(0,1fr);gap:0;align-items:center}
  .mm-l{grid-column:1;grid-row:1} .mm-c{grid-column:3;grid-row:1} .mm-r{grid-column:5;grid-row:1}
  .mm-side{gap:16px}
  .mm-l .mm-b::after{content:"";position:absolute;top:calc(50% - 1px);left:100%;width:29px;height:2px;background:var(--accent)}
  .mm-r .mm-b::after{content:"";position:absolute;top:calc(50% - 1px);right:100%;width:29px;height:2px;background:var(--accent)}
  .mm-l .mm-b::before{content:"";position:absolute;left:calc(100% + 27px);width:2px;background:var(--accent);top:-9px;bottom:-9px}
  .mm-r .mm-b::before{content:"";position:absolute;right:calc(100% + 27px);width:2px;background:var(--accent);top:-9px;bottom:-9px}
  .mm-side .mm-b:first-child::before{top:calc(50% - 1px)}
  .mm-side .mm-b:last-child::before{bottom:calc(50% - 1px)}
  .mm-side .mm-b:only-child::before{display:none}
  .mm-core{padding:22px 18px}
  .mm-core::before{content:"";position:absolute;top:calc(50% - 1px);right:100%;width:28px;height:2px;background:var(--accent)}
  .mm-core::after{content:"";position:absolute;top:calc(50% - 1px);left:100%;width:28px;height:2px;background:var(--accent)}
  .mm.one .mm-core::after{display:none}
}

/* ---------- anatomy: illustrative floor plan */
.an-note{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:4px 12px;margin-bottom:16px;line-height:1.5}
.an-note::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.an-plan{position:relative;max-width:880px;margin:0 0 42px}
.an-plan svg{display:block;width:100%;height:auto;overflow:visible}
.an-out{fill:var(--surface);stroke:var(--muted);stroke-width:.4}
.az rect{stroke:var(--line);stroke-width:.22}
.az-art rect{fill:var(--z-art);stroke:var(--accent-line)} .az-sale rect{fill:var(--z-sale)} .az-service rect{fill:var(--z-service)} .az-back rect{fill:var(--z-back)}
.az-id{fill:var(--ink);font-family:var(--display);font-size:5px;font-weight:600}
.az-nm{display:none;fill:var(--text);font-family:var(--body);font-size:1.85px;font-weight:500}
.az-sh{display:none;fill:var(--muted);font-family:var(--body);font-size:1.7px;font-weight:700}
.ad{stroke:var(--accent);stroke-width:1.5;stroke-linecap:round}
.adh{fill:var(--accent)}
.an-door{position:absolute;top:calc(100% + 8px);transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap;line-height:1.4}
.an-keys{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin:0 0 14px}
.ak{display:inline-flex;align-items:center;gap:7px}
.ak i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
i.az-art,.al-id.az-art{background:var(--z-art)} i.az-sale,.al-id.az-sale{background:var(--z-sale)} i.az-service,.al-id.az-service{background:var(--z-service)} i.az-back,.al-id.az-back{background:var(--z-back)}
.an-leg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:0 36px}
.an-leg li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;padding:13px 0;border-top:1px solid var(--hair)}
.al-id{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;font:600 17px/1 var(--display);color:var(--ink);border:1px solid var(--line)}
.an-leg b{color:var(--ink)}
.al-sh{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);border:1px solid var(--hair);border-radius:99px;padding:0 8px;line-height:1.6}
.an-leg p{font-size:15px;line-height:1.62;margin-top:3px}
@container wrap (min-width:600px){
  .az-id{font-size:3.4px}
  .az-nm,.az-sh{display:inline}
  .an-leg{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---------- cards and principles: uniform equal-height grid */
.grid3{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@container wrap (min-width:600px){ .grid3{grid-template-columns:repeat(12,minmax(0,1fr))} .grid3>*{grid-column:span var(--st,6)} }
@container wrap (min-width:900px){ .grid3>*{grid-column:span var(--sd,4)} }
.card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .frame{border-radius:0}
.cb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.card h3{font-size:17px;line-height:1.38}
.card .meta{font-size:13px;color:var(--muted);line-height:1.5}
.card p{font-size:15px;line-height:1.62}
.cgb{border-top:1px solid var(--hair);padding-top:9px}
.cgb .lab{margin-bottom:3px}
.cgb.g .lab{color:var(--good)} .cgb.b .lab{color:var(--risk)}
.card .tags{margin-top:auto;padding-top:6px}
.pn{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 13px/1 var(--body);letter-spacing:.02em}
.rule{color:var(--ink)}
.card .why{font-size:14px;color:var(--muted);padding-top:2px}
.why b{color:var(--ink);font-weight:600}

/* ---------- compare: aligned rows */
.cmp{border-top:1px solid var(--line)}
.cmp-h{display:none}
.cmp-r{display:grid;grid-template-columns:minmax(0,1fr);border-bottom:1px solid var(--hair);padding:12px 0}
.cmp-r>div{font-size:15.5px;line-height:1.6;min-width:0}
.cmp-l{font-weight:700;color:var(--ink);margin-bottom:6px}
.cmp-a,.cmp-b{padding:8px 12px;border-radius:9px}
.cmp-b{background:var(--accent-soft);margin-top:6px}
.cmp-a::before,.cmp-b::before{content:attr(data-h);display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.cmp-b::before{color:var(--accent)}
@container wrap (min-width:640px){
  .cmp-h{display:grid;grid-template-columns:22% minmax(0,1fr) minmax(0,1fr);border-bottom:1.5px solid var(--ink)}
  .cmp-h>div{padding:12px 18px;font-family:var(--display);font-size:21px;line-height:1.25;color:var(--ink)}
  .cmp-h>div:last-child{color:var(--accent)}
  .cmp{border-top:0}
  .cmp-r{grid-template-columns:22% minmax(0,1fr) minmax(0,1fr);padding:0}
  .cmp-r>div{padding:14px 18px}
  .cmp-l{margin:0;padding-left:0!important}
  .cmp-a,.cmp-b{border-radius:0;margin:0}
  .cmp-b{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
  .cmp-a::before,.cmp-b::before{display:none}
}

/* ---------- do and don't */
.dd{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.dd-c{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px 20px 20px}
.dd-t{font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.dd-c.do .dd-t{color:var(--good)} .dd-c.dont .dd-t{color:var(--risk)}
.dd ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.dd li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;font-size:15.5px;line-height:1.6}
.ic{width:24px;height:24px;border-radius:50%;position:relative;margin-top:1px}
.ic.ok{background:var(--good-soft)}
.ic.ok::after{content:"";position:absolute;left:8.5px;top:5px;width:5.5px;height:10.5px;border:solid var(--good);border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
.ic.no{background:var(--risk-soft)}
.ic.no::before,.ic.no::after{content:"";position:absolute;left:11px;top:6px;width:2.4px;height:12px;background:var(--risk);border-radius:1px;transform:rotate(45deg)}
.ic.no::after{transform:rotate(-45deg)}
@container wrap (min-width:640px){ .dd{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px} }

/* ---------- tables: fixed layout, computed widths; cards on phone */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:15px;line-height:1.55}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:13px 16px;border-bottom:1px solid var(--hair);overflow-wrap:anywhere}
.tbl th{background:var(--th);font-size:13px;font-weight:700;color:var(--ink);line-height:1.4;letter-spacing:.01em}
.tbl tbody tr:nth-child(even) td{background:var(--soft)}
.tbl td:first-child{font-weight:600;color:var(--ink)}
.tbl table.dense th,.tbl table.dense td{padding:12px 12px;font-size:14.5px}
.tbl tr:last-child td{border-bottom:none}
@container wrap (max-width:639px){
  .tbl{border:0;background:transparent;overflow:visible;border-radius:0}
  .tbl table{min-width:0!important;table-layout:auto}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:auto}
  .tbl tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:10px}
  .tbl tbody tr:nth-child(even) td{background:transparent}
  .tbl td{border:0;padding:5px 0}
  .tbl td::before{content:attr(data-l);display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.5}
  .tbl td:first-child{font-size:16px;padding-top:0}
  .tbl td:first-child::before{display:none}
  .tbl td:empty{display:none}
}

/* ---------- stats */
.stats{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stat{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px 20px 20px;min-width:0}
.sv{font-family:var(--display);font-size:32px;line-height:1.08;color:var(--ink);letter-spacing:-.01em}
.sl{font-size:14.5px;color:var(--muted);margin-top:8px;line-height:1.55}
@container wrap (min-width:480px){ .stats{grid-template-columns:repeat(12,minmax(0,1fr))} .stat{grid-column:span var(--st,6)} }
@container wrap (min-width:900px){ .stat{grid-column:span var(--sd,4)} .sv{font-size:35px} }

/* ---------- quotes */
.qgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@container wrap (min-width:760px){ .qgrid.two{grid-template-columns:repeat(12,minmax(0,1fr))} .qgrid.two>*{grid-column:span var(--sq,6)} }
.q{margin:0;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:16px 22px 18px;display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.q::before{content:"\201C";font-family:var(--display);font-size:52px;line-height:1;height:24px;color:var(--accent);display:block}
.q blockquote{margin:0}
.qp{font-family:var(--display);font-size:19.5px;line-height:1.48;color:var(--ink)}
.qo{margin-top:10px;font-size:14px;line-height:1.6;color:var(--muted);font-style:italic}
.qby{margin-top:auto;padding-top:14px;font-size:13px;color:var(--muted);line-height:1.5}
.sent{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:8px;line-height:1.6}
.sent.positive{background:var(--good-soft);color:var(--good)} .sent.negative{background:var(--risk-soft);color:var(--risk)} .sent.mixed{background:var(--warn-soft);color:var(--warn)}

/* ---------- callout: one tinted panel, never one box per paragraph */
.co{border-radius:16px;padding:22px 22px 14px;background:var(--info-soft)}
.co-good{background:var(--good-soft)} .co-warn{background:var(--warn-soft)} .co-risk{background:var(--risk-soft)}
.co-t{display:flex;align-items:center;gap:10px;font-size:18px;line-height:1.35;margin-bottom:14px;color:var(--accent)}
.co-good .co-t{color:var(--good)} .co-warn .co-t{color:var(--warn)} .co-risk .co-t{color:var(--risk)}
.co-i{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.co-l{list-style:none;margin:0;padding:0}
.co-l li{position:relative;padding-left:20px;margin-bottom:12px;break-inside:avoid;font-size:16px;line-height:1.65;color:var(--ink)}
.co-l li::before{content:"";position:absolute;left:2px;top:calc(.82em - 3px);width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.6}
.co-good li::before{background:var(--good)} .co-warn li::before{background:var(--warn)} .co-risk li::before{background:var(--risk)}
@container wrap (min-width:600px){ .co{padding:26px 30px 16px} }
@container wrap (min-width:900px){ .co-l.cols{columns:2;column-gap:48px} }

/* ---------- store profile */
.st-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.st-head h2{margin:0}
.code{font-size:12px;letter-spacing:.08em;font-weight:700;border-radius:6px;padding:3px 9px;background:var(--accent);color:var(--accent-ink);line-height:1.5}
.st-meta{color:var(--muted);font-size:15px;line-height:1.6;max-width:80ch;margin:10px 0 26px}
.st-prof{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
.st-gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;align-content:start}
.st-gal>.fig:first-child{grid-column:1/-1}
.st-gal.n2>.fig:first-child{grid-column:auto}
.st-gal .fig:not(:first-child) figcaption{font-size:12.5px}
.fl{list-style:none;margin:0;padding:0}
.fl li{padding:11px 0;border-top:1px solid var(--hair);font-size:15.5px;line-height:1.6}
.fl li:first-child{border-top:0;padding-top:0}
.st-secs{display:grid;gap:34px;margin-top:38px}
.nl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:14px 36px}
.nl li{padding-top:12px;border-top:1px solid var(--hair);min-width:0}
.nl b{display:block;color:var(--ink);font-size:15.5px;line-height:1.45;margin-bottom:3px}
.nl b.when{color:var(--accent);font-size:13.5px;letter-spacing:.02em}
.nl p{font-size:15px;line-height:1.62}
.ckl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:36px}
.ckl li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--hair);font-size:15px;line-height:1.58;min-width:0}
.cid{font:700 11.5px/1.9 var(--body);letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 7px;height:fit-content;white-space:nowrap}
.go-btn{display:inline-flex;align-items:center;gap:12px;margin-top:16px;padding:10px 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:14.5px;line-height:1.4}
.go-btn:hover{filter:brightness(1.08)}
.chev{width:7px;height:7px;border:solid currentColor;border-width:2px 2px 0 0;transform:rotate(45deg);flex:none}
@container wrap (min-width:760px){ .nl{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container wrap (min-width:820px){ .st-prof{grid-template-columns:minmax(0,57fr) minmax(0,43fr);gap:36px} }
@container wrap (min-width:900px){ .ckl.two{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- theme */
.th-meta{margin:-12px 0 16px}
.freq{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);line-height:1.6}
.verdict{font-size:17.5px;line-height:1.65;color:var(--ink);max-width:68ch;margin-bottom:22px}
.t-theme .gal{margin-top:22px}

/* ---------- flywheel (unchanged from v1) */
.fly-svg{display:none;max-width:900px}
.fly-list{display:block}
.fly-svg svg{width:100%;height:auto}
.fw-node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.fw-core{fill:var(--accent)}
.fw-t{fill:var(--ink);font-family:var(--body);font-size:14px}
.fw-tb{fill:var(--ink);font-family:var(--display);font-size:19px}
.fw-c{fill:var(--accent-ink);font-family:var(--body);font-size:13.5px}
.fw-cb{fill:var(--accent-ink);font-family:var(--display);font-size:19px}
.fw-a{stroke:var(--accent);stroke-width:2.2;fill:none}
.fw-ah{fill:var(--accent)}
.fw-cap{fill:var(--muted);font-family:var(--body);font-size:12.5px;font-style:italic}
.fly-list ol{margin:0;padding-left:20px;display:grid;gap:10px}
@container wrap (min-width:640px){ .fly-svg{display:block} .fly-list{display:none} }

/* ---------- elements of the formula */
.el{padding:34px 0 40px;border-top:1px solid var(--hair);scroll-margin-top:28px}
.el:first-child{border-top:0;padding-top:4px}
.elh{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.eln{font-family:var(--display);font-size:44px;line-height:.92;color:var(--accent);min-width:30px}
.elh h3{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.2}
.layer{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:3px}
.elg{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.eli{display:grid;gap:10px;align-content:start}
.eli .thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.eli .thumbs .frame{border-radius:7px}
.elt{display:grid;gap:12px;align-content:start;max-width:68ch}
.claim{font-size:17.5px;color:var(--ink);line-height:1.62}
.elt ul.bl li{font-size:15.5px;line-height:1.62}
.elb{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:22px}
.box{border-radius:12px;padding:13px 17px 15px;font-size:15px;line-height:1.6;color:var(--ink)}
.box.v{background:var(--info-soft)} .box.h{background:var(--warn-soft)}
.box.v .lab{color:var(--accent)} .box.h .lab{color:var(--warn)}
@container wrap (min-width:600px){ .elb{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container wrap (min-width:720px){ .elg.has-img{grid-template-columns:minmax(0,44fr) minmax(0,56fr);gap:34px} .elh h3{font-size:27px} .eln{font-size:52px} }

/* ---------- verify checklist */
.vsum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.vsum span{font-size:13.5px;border-radius:99px;padding:4px 12px;background:var(--surface);border:1px solid var(--line)}
.vavail{font-size:13.5px;color:var(--muted);margin-bottom:16px;max-width:70ch}
.vchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.vchips a{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.04em}
.vchips a span{font-weight:500;color:var(--muted);letter-spacing:0}
.vg{margin-top:36px;scroll-margin-top:28px}
.vg h3{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--display);font-weight:500;font-size:23px;line-height:1.25;margin-bottom:4px}
.vg h3 .chip{font-family:var(--body)}
.vitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;display:grid;gap:10px;scroll-margin-top:28px}
.vitem.ok{background:var(--good-soft);border-color:transparent} .vitem.no{background:var(--risk-soft);border-color:transparent} .vitem.unclear{background:var(--warn-soft);border-color:transparent}
.vt{font-size:15.5px;line-height:1.6;color:var(--ink)}
.vid{font-size:11.5px;font-weight:700;color:var(--accent);margin-right:8px;letter-spacing:.04em}
.vbtns{display:flex;gap:6px;flex-wrap:wrap}
.vbtns button{font:inherit;font-size:13.5px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;line-height:1.4}
.vbtns button[aria-pressed="true"][data-s="ok"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.vbtns button[aria-pressed="true"][data-s="no"]{background:var(--risk);border-color:var(--risk);color:var(--surface)}
.vbtns button[aria-pressed="true"][data-s="unclear"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.vbtns button:disabled{opacity:.55;cursor:not-allowed}

.jhero{container-type:inline-size;position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));height:clamp(560px,52vw,760px);margin:-54px calc(-1 * clamp(20px,4.2vw,64px)) 0;background:#050505;color:var(--ink);overflow:hidden}

wikimedia.org/wiki/File:Morris_Strawberry_Thief_1883.jpg"}, "expo1878-japon": {"file": "expo1878-japon.jpg", "w": 1200, "h": 807, "cap": "Triển lãm thế giới Paris 1878: mặt tiền khu Nhật Bản trên Phố các quốc gia", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:La_rue_des_nations._Façade_de_la_section_japonaise.jpg"}, "japon-artistique": {"file": "japon-artistique.jpg", "w": 1200, "h": 795, "cap": "Bìa một số tạp chí Le Japon artistique của S. Bing, 1888", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:Le_Japon_Artistique_S._Bing.jpg"}, "durer-lute": {"file": "durer-lute.jpg", "w": 998, "h": 710, "cap": "Dürer, Người vẽ cây đàn luýt, 1525: dụng cụ dây và khung lưới để dựng phối cảnh", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:Dürer_-_Man_Drawing_a_Lute.jpg"}, "daguerre-temple": {"file": "daguerre-temple.jpg", "w": 1200, "h": 862, "cap": "Daguerre, Đại lộ Temple, 1838: một trong những bức ảnh chụp đầu tiên có người", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:Boulevard_du_Temple_by_Daguerre.jpg"}, "manet-dejeuner": {"file": "manet-dejeuner.jpg", "w": 1200, "h": 946, "cap": "Manet, Bữa trưa trên cỏ, 1863: bị Salon loại, trưng ở Salon des Refusés", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:Édouard_Manet_-_Le_Déjeuner_sur_l'herbe.jpg"}, "cabanel-venus": {"file": "cabanel-venus.jpg", "w": 1200, "h": 695, "cap": "Cabanel, Sự ra đời của thần Vệ Nữ, 1863: được Salon ca ngợi, Napoléon III mua", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:Cabanel,_La_naissance_de_Vénus,_1863_(5613956032).jpg"}, "chevreul-cercle": {"file": "chevreul-cercle.jpg", "w": 1200, "h": 1496, "cap": "Vòng tròn màu của Chevreul, thế kỷ 19", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:Cercle_chromatique_Chevreul_1.jpg"}, "palais-industrie": {"file": "palais-industrie.jpg", "w": 1200, "h": 934, "cap": "Cung Công nghiệp, nơi tổ chức Salon chính thức và Salon des Refusés 1863 (ảnh Édouard Baldus)", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:Palais_de_l'Industrie_-_Édouard_Baldus.jpg"}}, "pages": {"overview": {"page": "overview", "title": "Tổng quan", "group": "Bắt đầu", "lead": "Japonisme không phải môn nghiên cứu Nhật Bản. Đó là ảnh hưởng của nghệ thuật và thủ công Nhật lên nghệ thuật châu Âu, sâu đến mức Manet, Monet, Ấn tượng, Tượng trưng, Art Nouveau và Ly khai Vienna khó có hình dạng như ta biết nếu thiếu nó.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2 Histoire d'un plagiat ?” (YouTube, 52 phút)", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "06/02/2018"}, {"name": "Art d'Histoire, “Japonisme 2/2, van Gogh, Degas et Lautrec” (YouTube, 50 phút)", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "13/02/2018"}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài hai bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Artistik TV, “Japonisme : comment l'art japonais a-t-il révolutionné la peinture occidentale ?” (phim “Quand les impressionnistes découvrent le Japon”, đạo diễn Jérôme Lambert, Philippe Picard, Andana Films)", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4", "date": "2018"}], "blocks": [{"type": "summary", "title": "5 ý chính của hai bài giảng", "items": [{"title": "“Đạo văn” là cách nói cố ý mạnh", "text": "Người giảng gọi Japonisme là “lịch sử một vụ đạo văn” để nhấn mạnh: phần lớn cái mới của avant-garde châu Âu có nguồn từ Nhật, dù sau đó được hấp thụ thành phong cách riêng.", "src": [0]}, {"title": "Cái người Nhật vứt bỏ thành hiện đại của châu Âu", "text": "Sau khi mở cửa (1854) và thời Minh Trị (1868), người Nhật bán đi tranh khắc, giáp, kimono như đồ lạc hậu. Chính những thứ đó tạo nên “hiện đại” ở Paris.", "src": [0]}, {"title": "Hai tầng ảnh hưởng", "text": "Tầng bề mặt là mốt: kimono, quạt, motif. Tầng sâu là cấu trúc: cận cảnh cắt cúp, bố cục chéo, khoảng trống, mảng phẳng, góc nhìn di động. Mục tiêu bài giảng là tìm ra “giọt máu Nhật” ở tầng sâu.", "src": [0, 1]}, {"title": "Chỉ có thể xảy ra khi hệ hình cũ khủng hoảng", "text": "Tranh Nhật đã vào Hà Lan từ thế kỷ 16 mà không ai để ý. Chỉ khi mô hình hàn lâm và lý trí kiểu Descartes lung lay, châu Âu mới sẵn sàng học.", "src": [0, 1]}, {"title": "Van Gogh, Degas, Lautrec học ba thứ khác nhau", "text": "Van Gogh học nét vẽ của sách dạy vẽ Nhật; Degas học bố cục và góc nhìn; Lautrec học nét bút lông, silhouette và biếm hoạ. Picasso 1901 thừa hưởng gián tiếp qua họ.", "src": [1]}]}, {"type": "diagram", "title": "Cơ chế Japonisme trong một sơ đồ", "img": "d01", "note": "Sơ đồ do người tổng hợp vẽ lại từ lập luận của hai bài giảng."}, {"type": "story", "title": "Đọc sâu: bốn giai đoạn của Japonisme", "items": [{"title": "1856–1867: khám phá", "paras": ["Giai thoại quen thuộc kể rằng năm 1856 Félix Bracquemond thấy một tập Hokusai Manga dùng làm giấy chèn trong thùng sứ gửi về Paris. Dù chi tiết có thật hay không, nó tóm đúng tình hình: tranh Nhật đến châu Âu như vật phụ, và chỉ một nhóm nhỏ nghệ sĩ, nhà văn nhận ra giá trị.", "Nhóm đầu tiên gồm Bracquemond, Manet, Whistler, Fantin-Latour, anh em Goncourt, Baudelaire. Họ mua ở các cửa hàng như Desoye và trao tay nhau từng tờ tranh khắc."], "src": [2]}, {"title": "1867–1878: mốt", "paras": ["Triển lãm thế giới Paris 1867, lần đầu Nhật tham dự, biến đồ Nhật thành hàng thời thượng. Quạt, bình phong, kimono xuất hiện trong salon và trong tranh: Monet vẽ vợ mặc kimono (La Japonaise, 1876), Whistler xếp sứ xanh trắng và bình phong quanh người mẫu.", "Đây là tầng ‘japonaiserie’: đồ Nhật là đạo cụ. Bố cục, phối cảnh, cách dựng hình vẫn hoàn toàn châu Âu."], "src": [2]}, {"title": "1878–1890: học cách nhìn", "paras": ["Triển lãm thế giới 1878 và sự xuất hiện của nhà buôn Hayashi Tadamasa, Siegfried Bing đưa vào Paris hàng chục nghìn bản in, sách tranh. Giới phê bình bắt đầu viết sách nghiên cứu (Louis Gonse, 1883).", "Nghệ sĩ không còn chép đồ vật mà học cấu trúc: cắt khung, góc nhìn từ trên cao, mảng phẳng, đường viền. Degas, Van Gogh, Gauguin, Émile Bernard, Toulouse-Lautrec thuộc giai đoạn này."], "src": [2]}, {"title": "1890–1910: lan rộng và tan vào hiện đại", "paras": ["Triển lãm tranh khắc tại École des Beaux-Arts (1890) đánh dấu sự thừa nhận chính thức. Sau đó Japonisme lan sang nghệ thuật trang trí và kiến trúc: Art Nouveau ở Paris, Nancy, Brussels; nhóm Ly khai Vienna (triển lãm lần thứ 6, năm 1900, dành riêng cho nghệ thuật Nhật); Aesthetic Movement ở London; Tiffany ở New York.", "Đến khoảng 1910, những gì học từ Nhật đã thành ngữ pháp chung của nghệ thuật hiện đại, nên người ta thôi gọi tên nó là Japonisme."], "src": [2]}, {"title": "Japonisme ngoài Paris", "bullets": ["London: Liberty & Co. mở năm 1875, bán lụa và đồ Nhật; kiến trúc sư E. W. Godwin thiết kế nội thất ‘Anglo-Japanese’; Whistler là cầu nối Paris–London.", "Nhóm Nabis: Pierre Bonnard được bạn bè gọi là ‘le Nabi très japonard’, vẽ bình phong nhiều tấm, mảng phẳng, hoa văn trên áo.", "Vienna: Klimt, Koloman Moser, Josef Hoffmann học hoa văn, kimono, khuôn katagami; Wiener Werkstätte thành lập năm 1903.", "Mỹ: Louis Comfort Tiffany, nhà giáo dục Arthur Wesley Dow (dạy bố cục theo tranh Nhật), kiến trúc sư Frank Lloyd Wright sưu tầm và buôn tranh khắc."], "src": [2]}]}, {"type": "gallery", "title": "Bốn bức tranh tóm tắt câu chuyện", "items": [{"img": "hiro-kameido", "caption": "Hiroshige, 1857: thân cây sát mắt, hậu cảnh tí hon"}, {"img": "vg-plum", "caption": "Van Gogh chép lại, 1887"}, {"img": "monet-japonaise", "caption": "Monet, 1876: Japonisme tầng bề mặt"}, {"img": "degas-tub", "caption": "Degas, 1886: Japonisme tầng cấu trúc"}]}, {"type": "stats", "title": "Vài con số trong bài giảng", "items": [{"value": "1854", "label": "Hiệp ước Kanagawa, Nhật mở cửa giao thương với Mỹ"}, {"value": "1872", "label": "Khoảng năm Philippe Burty đặt tên “japonisme”"}, {"value": "1–5 franc", "label": "Giá một tờ tranh khắc ở cửa hàng Desoye, Paris"}, {"value": "500+", "label": "Tranh khắc Nhật của anh em Van Gogh, nay ở Bảo tàng Van Gogh"}, {"value": "117", "label": "Tranh khắc Nhật tìm thấy trong bộ sưu tập của Degas khi ông mất"}, {"value": "1890", "label": "Trường Mỹ thuật Paris trưng bày “các bậc thầy Nhật Bản”"}]}, {"type": "callout", "tone": "info", "title": "Câu nói được trích làm tinh thần bài giảng", "items": ["Samuel Bing, Le Japon artistique: nghệ thuật Nhật hoà vào nghệ thuật của ta như một giọt máu hoà vào dòng máu, không lọc ra được nữa.", "Van Gogh viết cho Theo: toàn bộ công việc của tôi, có thể nói, dựa trên nghệ thuật Nhật."]}, {"type": "callout", "tone": "good", "title": "Góc nhìn thứ ba: phim tài liệu ‘Quand les impressionnistes découvrent le Japon’", "items": ["Một nhà phê bình thời đó viết: phải đợi album tranh khắc đến Paris mới có người dám ngồi bên bờ sông và đặt cạnh nhau trên toan một mái nhà đỏ, bức tường trắng, cây dương xanh, con đường vàng và dòng nước xanh.", "Phim kể lại Japonisme như một làn sóng chưa đầy 50 năm (1853–1905), đi qua nhóm Ấn tượng, Van Gogh, Gauguin, Nabis, Lautrec, rồi tràn sang opera, operetta, múa và âm nhạc.", "Kết luận của phim: bài học lớn nhất của Japonisme có lẽ là thôi đặt phương Tây ở trung tâm. Xem hai trang mới ‘Monet và nhóm Ấn tượng’, ‘Gauguin, Rivière và nhóm Nabis’ và ‘Ngoài hội hoạ’."], "src": [3]}]}, "history": {"page": "history", "title": "Làn sóng Nhật 1854 đến 1890", "group": "Bối cảnh", "lead": "Từ một hiệp ước ép buộc bằng pháo hạm đến khi Học viện Mỹ thuật Paris trưng bày “các bậc thầy Nhật Bản”: khoảng 35 năm để món hàng lạ trở thành chuẩn mực.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2 Histoire d'un plagiat ?”", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 2/2, van Gogh, Degas et Lautrec”", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Video 1, phút 18:25: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=1105s", "date": "Art d'Histoire, 2018"}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài hai bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Artistik TV, “Japonisme : comment l'art japonais a-t-il révolutionné la peinture occidentale ?” (phim “Quand les impressionnistes découvrent le Japon”, đạo diễn Jérôme Lambert, Philippe Picard, Andana Films)", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4", "date": "2018"}, {"name": "Phim tài liệu ADN, phút 3:15: Goncourt, Zola và các tủ đồ Nhật", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=195s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 15:59: Duret và Cernuschi đi vòng quanh thế giới", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=959s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 26:18: Guimet và Régamey sang Nhật", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=1578s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 47:23: Triển lãm 1900, Loïe Fuller, Debussy", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2843s", "date": "Artistik TV"}, {"name": "Phim tài liệu ADN, phút 49:34: 1905, Picasso và bài học cuối", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2974s", "date": "Artistik TV"}], "blocks": [{"type": "timeline", "title": "Các mốc chính", "items": [{"when": "Thế kỷ 16", "title": "Người Hà Lan buôn bán ở Nagasaki", "text": "Công ty Đông Ấn Hà Lan có thương điếm trên đảo nhân tạo trước cảng Nagasaki. Đồ sứ về châu Âu được gói trong tranh khắc, nhưng không ai quan tâm.", "src": [1], "detail": [["Bối cảnh", "Bồ Đào Nha đến Nhật từ 1543. Hà Lan lập thương điếm ở Hirado năm 1609; khi Mạc phủ Tokugawa đóng cửa (sakoku), từ 1641 họ là người châu Âu duy nhất được buôn bán, bị giới hạn trên đảo nhân tạo Dejima rộng chừng 1,3 ha."], ["Diễn biến", "Đồ sứ Arita và Imari, sơn mài, tơ lụa theo tàu về Amsterdam. Tranh khắc gỗ ukiyo-e rẻ đến mức được dùng làm giấy chèn hàng."], ["Ý nghĩa", "Hơn hai thế kỷ tiếp xúc mà cách nhìn châu Âu không đổi: có đồ vật Nhật trong tay chưa đủ để sinh ra Japonisme."]]}, {"when": "1812", "title": "Drouot bán bộ sưu tập Nagasaki với giá rẻ", "text": "Đồ Nhật lúc đó chỉ được coi là của lạ. Hệ hình cũ chưa khủng hoảng nên chưa có ai “học”.", "src": [1], "detail": [["Bối cảnh", "Paris thời Napoléon, thị hiếu do tân cổ điển của David và Ingres dẫn dắt, Học viện giữ quyền định nghĩa thế nào là hội hoạ."], ["Diễn biến", "Một bộ sưu tập mang về từ Nagasaki được đem bán và đi với giá thấp, như đồ trang trí lạ mắt."], ["Ý nghĩa", "Người giảng dùng mốc này để chứng minh: khi hệ hình cũ còn vững, cái khác chỉ là ‘của lạ’, không ai coi nó là bài học."]]}, {"when": "1853", "title": "Whistler gặp nghệ thuật Nhật sớm", "text": "Hàng từ một tàu Nhật dạt vào bờ California được trưng bày ở New York. Trường hợp ngoại lệ.", "src": [0], "detail": [["Bối cảnh", "Whistler khi ấy còn ở Mỹ; năm 1855 ông sang Paris học vẽ rồi định cư ở London."], ["Diễn biến", "Về sau ông sưu tầm sứ xanh trắng, tranh khắc, bình phong, vẽ ‘Caprice in Purple and Gold: The Golden Screen’ (1864) và loạt Nocturne mượn cách dựng cảnh cầu, sông của Hiroshige."], ["Ý nghĩa", "Ví dụ cho thấy tiếp xúc cá nhân có thể đến sớm, nhưng phải đợi bối cảnh Paris thập niên 1860 mới thành trào lưu."]]}, {"when": "1854", "title": "Hiệp ước Kanagawa", "text": "Thiếu tướng Perry của Hải quân Mỹ dùng “ngoại giao pháo hạm”, buộc Mạc phủ mở cửa. Nga, Pháp, Anh, Hà Lan ký hiệp ước tương tự ngay sau.", "src": [0], "detail": [["Bối cảnh", "Tháng 7/1853 hạm đội ‘tàu đen’ của Perry vào vịnh Edo, trao thư của Tổng thống Mỹ và hẹn quay lại."], ["Diễn biến", "Tháng 3/1854 Hiệp ước Kanagawa mở hai cảng Shimoda và Hakodate. Năm 1858 các hiệp ước thương mại Ansei với Mỹ, Hà Lan, Nga, Anh, Pháp mở thêm Yokohama, Nagasaki, Kobe cho buôn bán tự do."], ["Ý nghĩa", "Hàng Nhật bắt đầu chảy sang châu Âu với khối lượng lớn, không còn qua một cửa duy nhất là Dejima."]]}, {"when": "1868", "title": "Thời Minh Trị", "text": "Nhật hiện đại hoá, bán đi giáp samurai, kiếm, kimono, tranh khắc không có phối cảnh như dấu vết lạc hậu. “Cái lạc hậu của họ làm nên hiện đại của ta.”", "src": [0], "detail": [["Bối cảnh", "Mạc phủ sụp đổ, quyền lực về tay Thiên hoàng Minh Trị, khẩu hiệu ‘văn minh khai hoá’ và học phương Tây."], ["Diễn biến", "Năm 1871 bỏ chế độ phiên; năm 1876 cấm mang kiếm, tầng lớp samurai mất vị thế. Giáp, kiếm, kimono, tranh khắc bị bán tống bán tháo; hội hoạ sơn dầu kiểu phương Tây (yōga) được khuyến khích."], ["Ý nghĩa", "Nghịch lý trung tâm: thứ Nhật vứt bỏ vì ‘lạc hậu’ lại là thứ châu Âu dùng để thoát khỏi phối cảnh và hàn lâm."]]}, {"when": "1861–1870", "title": "Salon của giới sưu tầm", "text": "Phim tài liệu kể anh em Goncourt mua tranh Nhật ở cửa hàng ‘La Porte chinoise’; Zola tả nhà họ như ‘một bảo tàng nhỏ’.", "detail": [["Diễn biến", "Edmond de Goncourt viết rằng chưa từng thấy nghệ thuật nào ‘kỳ ảo, đáng phục và nên thơ’ như vậy. Tủ của họ chứa netsuke (tượng nhỏ bằng ngà, gỗ), sứ, kiếm nhỏ, đồ đồng chọn ngay khi mở thùng hàng từ Viễn Đông."], ["Giới thượng lưu", "Nhà sưu tầm Clémence d’Ennery bày đồ Nhật trong dinh thự, nơi lui tới của giới nghệ thuật và chính trị Paris, từ nhà soạn nhạc Gounod đến chính khách Gambetta."], ["Ý nghĩa", "Đồ Nhật lúc này là vật sưu tầm quý và chồng chất, gần với tủ đồ lạ hơn là bài học nghệ thuật."]], "src": [5]}, {"when": "Thập niên 1860", "title": "Cửa hàng và người sưu tầm đầu tiên", "text": "Bà Desoye mở cửa hàng ở Paris; khách là Manet, Fantin-Latour, Carolus-Duran, anh em Goncourt, Champfleury, Zola, Baudelaire, giám đốc xưởng sứ Sèvres và cả giám đốc Louvre.", "src": [0], "detail": [["Bối cảnh", "Paris là thủ đô nghệ thuật, nhóm nghệ sĩ trẻ đang tìm cách thoát khỏi Salon."], ["Diễn biến", "Khoảng 1862, vợ chồng Desoye mở cửa hàng đồ Nhật ở số 220 rue de Rivoli. Khách quen gồm Manet, Fantin-Latour, Whistler, anh em Goncourt, Zola, Baudelaire và cả người của Louvre, xưởng sứ Sèvres."], ["Dấu vết", "Trong ‘Chân dung Émile Zola’ (1868), Manet vẽ một tranh khắc đô vật sumo và một tấm bình phong Nhật trên tường."], ["Ý nghĩa", "Đồ Nhật bước vào giới sáng tác, phê bình và thiết chế cùng lúc, nên ảnh hưởng lan rất nhanh."]]}, {"when": "1867", "title": "Bộ bát đĩa Bracquemond–Rousseau gây sốt", "text": "Bracquemond chép gần như nguyên mẫu từ Hokusai Manga lên bộ đồ ăn sứ, trưng tại Triển lãm thế giới, tái bản đến tận gần đây.", "src": [0], "img": "bracquemond", "detail": [["Bối cảnh", "Triển lãm thế giới Paris 1867 là lần đầu Nhật tham gia, với gian của Mạc phủ cùng hai phiên Satsuma và Saga."], ["Diễn biến", "Nhà buôn Eugène Rousseau đặt Félix Bracquemond trang trí bộ đồ ăn bằng sứ: chim, cá, hoa lá lấy gần nguyên từ Hokusai Manga và tranh Hiroshige, bố cục lệch, để nhiều khoảng trống."], ["Ý nghĩa", "Thành công thương mại lớn, sản xuất suốt nhiều thập kỷ. Nhưng vẫn ở tầng 1: chép motif, chưa đổi cách nhìn."]]}, {"when": "1871–1873", "title": "Duret và Cernuschi đi vòng quanh thế giới", "text": "Nhà phê bình Théodore Duret và chủ ngân hàng Henri Cernuschi gom gần 4.000 hiện vật ở Nhật, kể cả một tượng Phật bằng đồng nặng nhiều tấn ở Meguro.", "detail": [["Bối cảnh", "Tàu hơi nước và đường sắt làm Trái Đất ‘co lại’; cùng năm Jules Verne viết ‘Vòng quanh thế giới trong 80 ngày’ (1872)."], ["Diễn biến", "Ở Yokohama, Duret ghi: ‘vừa xuống tàu là chúng tôi bắt đầu mua đồ’. Tượng Phật bị cắt thành khúc, chở về Paris, đặt giữa dinh thự Cernuschi, nay là Bảo tàng Cernuschi."], ["Phát hiện", "Duret mê Hokusai Manga vì thấy trong đó đúng dân chúng ông gặp ngoài phố, khác xa cái Nhật sáo rỗng của châu Âu."], ["Nghịch lý", "Người Nhật lúc ấy đã chán tranh khắc, chuyển sang mê nhiếp ảnh. Ảnh của Felice Beato ở Yokohama lại dựng một hình ảnh lý tưởng hoá về nước Nhật xưa đang biến mất."]], "src": [6]}, {"when": "1872", "title": "Chữ “japonisme” ra đời", "text": "Philippe Burty đặt tên. Hội Jinglar của Astruc, Goncourt, Bracquemond họp hằng tháng để “sống kiểu Nhật”.", "src": [0], "detail": [["Bối cảnh", "Sau chiến tranh Pháp–Phổ 1870–71, giới sưu tầm Paris phục hồi nhanh."], ["Diễn biến", "Nhà phê bình Philippe Burty đặt chữ ‘japonisme’ trong loạt bài trên tạp chí La Renaissance littéraire et artistique. Hội Jinglar (Astruc, Bracquemond, Burty, Fantin-Latour...) họp hằng tháng, mặc kimono, ăn bằng đũa, uống sake."], ["Ý nghĩa", "Có tên gọi nghĩa là có một hiện tượng được thừa nhận. Nhưng giai đoạn này vẫn nặng phần ‘chơi đồ Nhật’."]]}, {"when": "1874", "title": "Samuel Bing mở cửa hàng L'Art japonais", "text": "Nhập hàng chục nghìn món từ Nhật. Cửa hàng lớn dần, đến cuối thập niên 1890 thành cửa hàng “Art Nouveau”, đặt tên cho cả một trào lưu.", "src": [0], "detail": [["Bối cảnh", "Nhu cầu đồ Nhật vượt quá nguồn hàng lẻ tẻ."], ["Diễn biến", "Siegfried (Samuel) Bing, gốc Hamburg, mở cửa hàng ở Paris, đặt đại lý ở Nhật để nhập trực tiếp hàng chục nghìn món: tranh khắc, sách tranh, gốm, đồ đồng. Van Gogh lục kho của ông, mua hàng trăm bản in."], ["Về sau", "Tháng 12/1895 ông khai trương ‘Maison de l’Art Nouveau’; tên cửa hàng thành tên cả một phong cách."], ["Ý nghĩa", "Từ một nhà buôn, Bing trở thành mắt xích nối Japonisme với nghệ thuật trang trí châu Âu."]]}, {"when": "1876", "title": "Guimet và Régamey sang Nhật", "text": "Nhà công nghiệp Lyon Émile Guimet cùng hoạ sĩ Félix Régamey sang Nhật nghiên cứu tôn giáo và gom hiện vật cho bảo tàng.", "detail": [["Niềm tin", "Guimet tin Japonisme không chỉ là mốt mà là cơ hội ‘tái sinh nghệ thuật và tư tưởng phương Tây’."], ["Vỡ mộng", "Régamey thấy ‘thế giới tuyệt diệu, nên thơ’ này sắp chìm vào ‘mớ hỗn độn của văn minh phương Tây’. Guimet tiếc những điều tốt đẹp người Nhật bỏ đi ‘không có lý do’. Cũng thời điểm này, trường mỹ thuật ở Tokyo mở khoa hội hoạ phương Tây."], ["Ý nghĩa", "Cái Nhật mà Paris mê là một nước Nhật đã qua; nước Nhật thật đang hiện đại hoá cấp tốc."]], "src": [7]}, {"when": "1883", "title": "Triển lãm và sách L'Art japonais của Louis Gonse", "text": "Bing và Gonse tổ chức triển lãm nghệ thuật Nhật đầu tiên. Sách của Gonse được Van Gogh đọc.", "src": [0, 1], "detail": [["Bối cảnh", "Nhu cầu hiểu đồ Nhật có hệ thống, không chỉ sưu tầm."], ["Diễn biến", "Louis Gonse, chủ bút Gazette des Beaux-Arts, xuất bản ‘L’Art japonais’ hai tập và tổ chức triển lãm hồi cố nghệ thuật Nhật tại Galerie Georges Petit với khoảng 3.000 hiện vật mượn từ các nhà sưu tầm, trong đó có Bing."], ["Ý nghĩa", "Đồ Nhật được đối xử như một lịch sử nghệ thuật có trường phái và bậc thầy. Van Gogh đọc sách này khi đến Paris (1886–88)."]]}, {"when": "1888–1891", "title": "Tạp chí Le Japon artistique", "text": "Bing xuất bản nguyệt san bằng tiếng Pháp, Anh, Đức trong 3 năm.", "src": [0], "detail": [["Bối cảnh", "Art Nouveau đang hình thành, các nhà thiết kế cần nguồn mẫu."], ["Diễn biến", "Bing ra nguyệt san minh hoạ in màu bằng ba thứ tiếng, 36 số từ tháng 5/1888 đến tháng 4/1891, với bài của Gonse, Burty, Ary Renan, Justus Brinckmann (Hamburg)."], ["Ý nghĩa", "Hình ảnh Nhật đến tay nghệ sĩ, xưởng thủ công và bảo tàng khắp châu Âu, không cần qua Paris."]]}, {"when": "1890", "title": "Học viện trưng bày “Les maîtres japonais”", "text": "Chính thiết chế hàn lâm, nơi dạy dựng khối ba chiều, giờ gọi người Nhật là “bậc thầy”. Người giảng coi đây là dấu hiệu khủng hoảng.", "src": [0], "detail": [["Bối cảnh", "École des Beaux-Arts là pháo đài của giáo dục hàn lâm: giải phẫu, phối cảnh, dựng khối."], ["Diễn biến", "Tháng 4–5/1890 Bing tổ chức ngay tại đây triển lãm tranh khắc Nhật với hơn 700 bản in và khoảng 400 sách tranh. Mary Cassatt xem nhiều lần, rồi làm loạt 10 bản khắc màu (1890–91) theo lối Utamaro."], ["Ý nghĩa", "Thiết chế bảo vệ hệ hình cũ tự gọi người Nhật là ‘bậc thầy’: dấu hiệu rõ nhất của khủng hoảng hệ hình."]]}, {"when": "Thập niên 1890", "title": "Thế hệ sưu tầm đầu tiên qua đời", "text": "Bộ sưu tập của Burty, Goncourt được bán ra, tranh khắc tràn thị trường. Bảo tàng Guimet, Cernuschi hình thành từ các chuyến đi.", "src": [0], "detail": [["Bối cảnh", "Thế hệ sưu tầm từ thập niên 1860 già đi."], ["Diễn biến", "Burty mất 1890, bộ sưu tập bán năm 1891; Edmond de Goncourt mất 1896, bán năm 1897. Émile Guimet sau chuyến đi Nhật 1876 dời bảo tàng từ Lyon về Paris năm 1889; Henri Cernuschi, sau chuyến đi châu Á 1871–73 cùng Théodore Duret, để lại dinh thự thành bảo tàng mở năm 1898."], ["Ý nghĩa", "Đồ Nhật đi từ tủ cá nhân vào bảo tàng công: Japonisme hết là mốt, thành một phần của nền tảng nghệ thuật châu Âu."]]}, {"when": "1900", "title": "Triển lãm thế giới Paris", "text": "Nhật trưng bày báu vật từ bộ sưu tập riêng của Thiên hoàng Minh Trị. Bảo tàng Cernuschi và Guimet đã mở ở Paris.", "detail": [["Sân khấu", "Vũ công Mỹ Loïe Fuller trình diễn với đoàn kịch Nhật trong vở ‘Geisha và hiệp sĩ’; Cocteau tả bà như ‘một bông lan bằng ánh sáng và vải’."], ["Âm nhạc", "Debussy viết ‘La Mer’ (1905), nói được gợi hứng từ tranh Sóng lớn của Hokusai treo trong căn hộ; bìa bản tổng phổ in chính bức tranh này."], ["Ý nghĩa", "Japonisme lên đỉnh: tràn từ hội hoạ sang trang trí, văn chương, múa, âm nhạc, điện ảnh."]], "src": [8], "img": "debussy-mer"}, {"when": "1905–1907", "title": "Avant-garde quay sang hướng khác", "text": "Nhật thắng Nga (1905): hình ảnh một nước Nhật ‘duyên dáng, kỳ lạ’ đổi thành một cường quốc hiện đại, đáng ngại.", "detail": [["Diễn biến", "Từ Dresden đến Paris, nghệ sĩ trẻ chuyển sang nghệ thuật châu Phi và châu Đại Dương. Năm 1907 Picasso vẽ ‘Những cô nàng Avignon’."], ["Ý nghĩa", "Phim kết luận: bài học lớn nhất của Japonisme có lẽ là thôi đặt phương Tây ở trung tâm của mọi thứ."]], "src": [9]}]}, {"type": "story", "title": "Đọc sâu: tranh khắc Nhật và những người buôn tranh", "items": [{"title": "Ukiyo-e là gì", "img": "hokusai-wave", "caption": "Hokusai, Sóng lớn ngoài khơi Kanagawa, khoảng 1831", "paras": ["Ukiyo-e, ‘tranh thế giới phù du’, là dòng tranh của thị dân Edo (Tokyo ngày nay) từ thế kỷ 17 đến 19: kỹ nữ, diễn viên kabuki, đô vật, phong cảnh danh thắng. Một bản in là sản phẩm của bốn người: nhà xuất bản đặt hàng, hoạ sĩ vẽ mẫu, thợ khắc khắc mỗi màu lên một bản gỗ, thợ in in chồng từng màu.", "Từ năm 1765, Suzuki Harunobu phổ biến tranh in nhiều màu (nishiki-e, ‘tranh gấm’). Từ thập niên 1820, màu xanh Phổ nhập từ châu Âu cho phép Hokusai và Hiroshige vẽ trời, nước xanh đậm. In số lượng lớn nên tranh rẻ, được coi là hàng tiêu dùng chứ không phải nghệ thuật cao."], "src": [3]}, {"title": "Hai bộ tranh châu Âu mê nhất", "paras": ["‘Ba mươi sáu cảnh núi Phú Sĩ’ của Hokusai (khoảng 1830–32) có Sóng lớn và Phú Sĩ đỏ: cùng một chủ đề nhìn từ nhiều góc, núi có khi chỉ là chấm nhỏ ở hậu cảnh.", "‘Một trăm danh thắng Edo’ của Hiroshige (1856–58) là nguồn của Van Gogh, Whistler, Monet: tiền cảnh khổng lồ bị cắt (cành mận, chân ngựa, cột cầu), khung dọc, đường chân trời cao. Đây là kho thủ pháp mà trang ‘8 thủ pháp học từ Nhật’ phân tích."], "src": [3]}, {"title": "Hayashi Tadamasa: người Nhật ở giữa thị trường", "paras": ["Hayashi sang Paris năm 1878 làm phiên dịch cho phái đoàn Nhật ở Triển lãm thế giới, rồi ở lại làm nhà buôn. Ông bán cho Degas, Monet, các bảo tàng, đồng thời mua tranh Ấn tượng mang về Nhật.", "Ông giúp Edmond de Goncourt viết hai cuốn chuyên khảo về Utamaro (1891) và Hokusai (1896), và viết bài giới thiệu nước Nhật cho Paris Illustré (1886). Chính bài này khiến Van Gogh tin khí hậu miền Nam nước Pháp giống Nhật."], "src": [3]}, {"title": "Siegfried Bing: từ kho tranh đến Art Nouveau", "paras": ["Gốc Hamburg, Bing bắt đầu với đồ gốm sứ rồi chuyên về đồ Nhật, Trung Hoa, có chi nhánh ở Nhật để mua tận gốc. Kho tranh khắc trên gác cửa hàng ở rue Chauchat là nơi Van Gogh và Theo chọn mua hàng trăm tờ.", "Bing vừa buôn vừa làm giáo dục: tạp chí Le Japon artistique (1888–91), triển lãm tại École des Beaux-Arts (1890). Năm 1895, ông mở Maison de l’Art Nouveau, trưng bày đồ của Tiffany, Gallé, van de Velde. Từ đồ Nhật đến Art Nouveau là một đường thẳng."], "src": [3]}, {"title": "Edmond de Goncourt: nhà văn sưu tầm", "paras": ["Goncourt tự nhận mình là một trong những người đầu tiên mê đồ Nhật. Cuốn ‘La Maison d’un artiste’ (1881) mô tả từng món trong nhà ông ở Auteuil, biến việc sưu tầm thành một cách sống thẩm mỹ.", "Bộ sưu tập được bán đấu giá năm 1897, sau khi ông mất, đưa thêm hàng nghìn món vào thị trường và vào các bảo tàng."], "src": [3]}]}, {"type": "gallery", "title": "Những tờ tranh khắc tràn vào Paris", "layout": "feature", "items": [{"img": "hokusai-wave", "caption": "Hokusai, Sóng lớn, khoảng 1831"}, {"img": "hiro-kameido", "caption": "Hiroshige, Vườn mận Kameido, 1857"}, {"img": "hiro-ohashi", "caption": "Hiroshige, Mưa rào trên cầu Ōhashi, 1857"}, {"img": "kiyonaga-bath", "caption": "Kiyonaga, Phụ nữ ở nhà tắm, khoảng 1780"}]}, {"type": "media", "kicker": "Case study · Video 1, phút 18:25", "title": "Học viện trưng bày “các bậc thầy Nhật Bản”", "img": "v1-1105", "caption": "Áp phích triển lãm “Maîtres Japonais”, Trường Mỹ thuật Paris, 1890 · phút 18:25", "text": "Người giảng dừng lại ở tấm áp phích này vì nó gây sốc: chính Trường Mỹ thuật, nơi dạy dựng khối ba chiều và vẽ mẫu hàn lâm, gọi tranh khắc, sách tranh, kakemono Nhật là tác phẩm của “bậc thầy”. Ban tổ chức có Bing, Burty, Goncourt, Gonse: cả mạng lưới japonisme trong một danh sách.", "bullets": ["Chữ “Maîtres” vốn dành cho Titian, Poussin, Caravaggio.", "Triển lãm gây quỹ cho Alliance Française, một thiết chế rất chính thống."], "src": [2]}, {"type": "cards", "title": "Mốt Nhật: tầng bề mặt", "kicker": "Tầng 1", "items": [{"title": "Whistler, Caprice in Purple and Gold (1864)", "text": "Người phụ nữ mê tranh khắc, có bình phong vàng, bình cắt mép tiền cảnh. Bố cục vẫn kiểu châu Âu.", "src": [0], "img": "whistler-screen"}, {"title": "Monet, La Japonaise (1876)", "text": "Camille Monet mặc kimono đỏ, đội tóc giả vàng để nhắc rằng cô là người châu Âu, tường gắn quạt Nhật. Thuần tuý là mốt.", "src": [0], "img": "monet-japonaise"}, {"title": "Manet, Chân dung Zola (1868)", "text": "Sau lưng Zola có tranh khắc Nhật và bình phong, bên cạnh bản in Olympia. Một lời cảm ơn theo kiểu Nhật.", "src": [0], "img": "manet-zola"}, {"title": "Tissot và Alfred Stevens", "text": "Váy có nơ lớn sau lưng như obi, dáng chữ S, váy bó bước ngắn kiểu geisha. Stevens vẽ “người Paris” trong kimono.", "src": [0]}, {"title": "Nhạc kịch", "text": "La Princesse jaune của Saint-Saëns, The Mikado của Gilbert và Sullivan: Nhật chỉ ở trang phục, âm nhạc không đổi. Phải đến Puccini mới sâu hơn.", "src": [0]}, {"title": "Bách hoá và Zola", "text": "Các cửa hàng bách hoá có gian và catalogue đồ Nhật: ai giàu mua đồ gốc, Gallé, Daum; ai ít tiền mua bản chép. Zola tả trong Au Bonheur des Dames.", "src": [0]}]}]}, "paradigm": {"page": "paradigm", "title": "Khủng hoảng hệ hình", "group": "Bối cảnh", "lead": "Vì sao những người canh giữ chuẩn mực hàn lâm lại đi sưu tầm thứ nghệ thuật phá vỡ mọi luật của họ? Câu trả lời của người giảng: châu Âu đang khủng hoảng hệ hình.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2 Histoire d'un plagiat ?”, phút 18 đến 31", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 2/2”, phút 9 đến 11", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Video 1, phút 26:12: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=1572s", "date": "Art d'Histoire, 2018"}, {"name": "Video 1, phút 28:20: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=1700s", "date": "Art d'Histoire, 2018"}, {"name": "Video 1, phút 28:47: đoạn người giảng đặt hai tác phẩm cạnh nhau", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=1727s", "date": "Art d'Histoire, 2018"}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài hai bài giảng, do người tổng hợp biên soạn", "date": ""}], "blocks": [{"type": "compare", "title": "Hai mô hình nhìn", "left": "Hàn lâm châu Âu", "right": "Tranh khắc Nhật", "rows": [{"label": "Vị trí người xem", "left": "Toàn tri, “cái nhìn của Chúa”: thấy hết, không gì bị che", "right": "Bị che bởi cột, cành cây, mép tranh; phải đoán phần còn lại"}, {"label": "Bố cục", "left": "Đối xứng, cân bằng, lấy tâm (truyền thống Platon, Trường Athens)", "right": "Lệch tâm, mất cân bằng, đường chéo kéo mắt ra xa"}, {"label": "Tính trọn vẹn", "left": "Cảnh đầy đủ, như ghép hình đủ mảnh", "right": "Chỉ một mảnh: một khúc cầu, một chiếc lá"}, {"label": "Không gian", "left": "Phối cảnh, khối ba chiều, sắc độ", "right": "Mảng màu phẳng, đường viền, khoảng trống"}, {"label": "Thứ bậc nghệ thuật", "left": "Nghệ thuật lớn tách khỏi nghệ thuật trang trí", "right": "Cùng một hoạ sĩ làm tranh khắc, bình phong, mẫu kimono"}], "src": [0]}, {"type": "diagram", "title": "Hai mô hình nhìn, vẽ thành hình", "img": "d02", "note": "Sơ đồ minh hoạ do người tổng hợp vẽ theo năm tiêu chí của bảng trên, mỗi sơ đồ đặt cạnh một tác phẩm thật: Raphael, Leonardo, Claude Lorrain, David, Cabanel bên hàn lâm; Hiroshige, Hokusai, Ogata Kōrin bên tranh Nhật. Bấm vào để phóng to."}, {"type": "story", "title": "Đọc sâu: hệ hình hàn lâm và vì sao nó lung lay", "items": [{"title": "‘Hệ hình’ nghĩa là gì", "paras": ["Khái niệm hệ hình (paradigm) được Thomas Kuhn dùng cho lịch sử khoa học (1962): một bộ quy tắc, ví dụ mẫu và câu hỏi hợp lệ mà cả cộng đồng mặc nhiên chấp nhận. Khi có quá nhiều điều hệ hình cũ không giải thích được, khủng hoảng xảy ra và cộng đồng chuyển sang hệ hình mới.", "Người giảng áp dụng ý này cho hội hoạ: châu Âu đã có tranh Nhật trong tay từ thế kỷ 17 nhưng không học, vì hệ hình còn vững. Chỉ khi nó khủng hoảng, tranh Nhật mới trở thành lời giải."], "src": [5], "img": "durer-lute", "caption": "Dürer, Người vẽ cây đàn luýt, 1525: phối cảnh là một bộ máy đo đạc, con mắt cố định ở một điểm."}, {"title": "Hệ hình cũ được xây thế nào", "bullets": ["Phối cảnh tuyến tính: Brunelleschi thử nghiệm ở Florence đầu thế kỷ 15, Alberti hệ thống hoá trong ‘De pictura’ (1435). Mọi đường quy về một điểm tụ, người xem đứng ở vị trí cố định.", "Học viện: Académie royale de peinture et de sculpture thành lập năm 1648; Học viện quyết định cách đào tạo, Giải Roma và Salon chính thức.", "Thứ bậc thể loại (Félibien, 1667): tranh lịch sử cao nhất, rồi chân dung, cảnh sinh hoạt, phong cảnh, tĩnh vật.", "Kỹ thuật: vẽ hình (dessin) trước màu, đánh bóng tạo khối ba chiều, bề mặt mịn không thấy nét cọ.", "Mẫu mực: Raphael, ‘Trường Athens’ (1509–11): kiến trúc đối xứng, điểm tụ ở giữa hai nhà triết học, mọi thứ ổn định và trọn vẹn."], "src": [5], "img": "raphael-athens", "caption": "Raphael, Trường Athens, 1509–11: mẫu mực của hệ hình, mọi đường quy về điểm tụ giữa Platon và Aristote."}, {"title": "Bốn vết nứt thế kỷ 19", "paras": ["Nhiếp ảnh (1839) làm việc mô phỏng hiện thực rẻ và chính xác hơn tay hoạ sĩ, đặt câu hỏi hội hoạ còn để làm gì. Năm 1863, Salon des Refusés trưng bày những tranh bị Salon chính thức loại, trong đó có ‘Bữa trưa trên cỏ’ của Manet. Năm 1874, nhóm Ấn tượng tự tổ chức triển lãm riêng.", "Khoa học về màu (Chevreul, 1839) và về thị giác cho thấy mắt không nhìn như một ô cửa sổ phối cảnh. Triết học (Schopenhauer, Nietzsche, rồi Bergson với ‘Khảo luận về dữ kiện trực tiếp của ý thức’, 1889) đề cao trực giác, ý chí, thời gian sống hơn lý tính.", "Kết quả: những giá trị cũ như trung tâm, cân bằng, trọn vẹn, khối ba chiều bắt đầu bị coi là gò bó. Tranh Nhật, lệch tâm, phẳng, bị cắt, đến đúng lúc như một hệ hình thay thế đã hoàn chỉnh."], "src": [5], "img": "manet-dejeuner", "caption": "Manet, Bữa trưa trên cỏ, 1863: mảng sáng phẳng, phối cảnh lạc, bị Salon loại.", "gallery": [{"img": "daguerre-temple", "caption": "Nhiếp ảnh: Daguerre, Đại lộ Temple, 1838"}, {"img": "cabanel-venus", "caption": "Salon 1863 chọn Cabanel: khoả thân mịn, hàn lâm"}, {"img": "chevreul-cercle", "caption": "Khoa học màu: vòng tròn màu của Chevreul"}, {"img": "palais-industrie", "caption": "Cung Công nghiệp, nơi diễn ra Salon và Salon des Refusés"}]}, {"title": "Vì sao là Nhật mà không phải nơi khác", "paras": ["Châu Âu cũng biết nghệ thuật Trung Hoa, Ấn Độ, Hồi giáo. Nhưng tranh khắc Nhật có ba lợi thế: in hàng loạt nên rẻ và nhiều; vẽ cuộc sống thường ngày giống đề tài mà hoạ sĩ hiện đại đang tìm; và có hệ thống bố cục rõ ràng, dễ học, thay vì chỉ là hoa văn.", "Thời điểm cũng trùng khớp: Nhật mở cửa (1854–58) đúng lúc Paris khủng hoảng hệ hình (1860–90)."], "src": [5], "img": "hiro-kameido", "caption": "Hiroshige, Vườn mận Kameido, 1857: một hệ thống bố cục hoàn chỉnh, in hàng loạt, rẻ và dễ học."}]}, {"type": "media", "kicker": "Case study · Video 1, phút 26:12", "title": "Bảng “khủng hoảng hệ hình” trong bài giảng", "img": "v1-1572", "caption": "Slide: hệ thống lý tính (Trường Athens) đối diện hệ thống khủng hoảng (người Nhật, “đứa trẻ vĩnh cửu”) · phút 26:12", "text": "Người giảng tóm cả lập luận vào một bảng: bên trái là mô hình từ thời Phục Hưng với cái nhìn toàn tri, lấy tâm, cân bằng, đối xứng; bên phải là thứ được ngưỡng mộ lúc này, tranh Nhật mà chính người châu Âu mô tả là ấu trĩ, lệch tâm, thiếu trọn vẹn.", "bullets": ["Trường Athens của Raphael là hình mẫu của cái nhìn toàn tri.", "Hai cột đối lập từng tiêu chí một."], "src": [2]}, {"type": "media", "kicker": "Case study · Video 1, phút 28:20", "title": "Đĩa thời Napoléon III: mọi thứ quy về tâm", "img": "v1-1700", "caption": "Đĩa sứ thời Napoléon III, các đường kẻ cho thấy trục đối xứng · phút 28:20", "text": "Để chứng minh, người giảng dùng thứ đời thường nhất: cái đĩa. Kẻ đường từ các motif viền, tất cả gặp nhau ở tâm; ba ô hoa tạo một tam giác đều; motif giữa đặt chính giữa. Mọi thứ cân bằng, đúng chuẩn hàn lâm.", "bullets": ["Các trục gặp nhau ở tâm đĩa.", "Motif viền lặp đều quanh vành."], "src": [3]}, {"type": "media", "kicker": "Case study · Video 1, phút 28:47", "title": "Đĩa Rousseau: phi logic, thiếu trọn vẹn, khoảng trống", "img": "v1-1727", "caption": "Đĩa bộ Rousseau: tôm hùm với cà tím và chim; lá bầu với cào cào · phút 28:47", "text": "Đặt cạnh đĩa Napoléon III, bộ Rousseau phá mọi luật: tôm hùm đi cùng cà tím và con chim, “như sống trên hành tinh khác”; lá bầu chỉ còn một mảnh, cận cảnh; nửa đĩa để trống. Ở một món đồ ăn, ta đã thấy cả cuộc khủng hoảng thị giác.", "bullets": ["Không còn logic tu từ của bố cục hàn lâm.", "Một bên đầy, một bên rỗng: nghệ thuật khoảng trống."], "src": [4]}, {"type": "text", "title": "Người châu Âu đọc tranh Nhật thế nào", "paras": ["Các nhà phê bình ngưỡng mộ tranh Nhật nhưng mô tả bằng từ của châu Âu: bất đối xứng, mất cân bằng, lệch tâm (Ernest Chesneau). Tức là đo bằng chuẩn của mình.", "Họ tìm lý do sinh lý và khí hậu: mắt người Nhật “nhìn qua đầu to của ống nhòm” nên thấy cận cảnh (Paul Dalloz); không khí trong trẻo nên màu rõ, nét sắc (Théodore Duret). Van Gogh tin điều này nên xuống Arles tìm “khí hậu Nhật”.", "Họ gán cho người Nhật sự hồn nhiên trẻ thơ: “con mắt ngây thơ” (Ruskin), “nghệ sĩ và đứa trẻ”, “không phân biệt mình với thế giới”."], "src": [0]}, {"type": "callout", "tone": "info", "title": "Cách đọc phân tâm học của người giảng", "items": ["Mô tả “không ý thức được giới hạn của bản thân” trùng với “cảm giác vô hạn của cái tôi” ở trẻ sơ sinh trong Malaise dans la civilisation của Freud, và giai đoạn trước “tấm gương” (0 đến 6 tháng) của Lacan.", "Nghịch lý: một học viện tôn thờ sự vĩ đại, lý trí và cái nhìn toàn tri lại ngưỡng mộ thứ nó tự mô tả là ấu trĩ. Đó là dấu hiệu khủng hoảng.", "Đây là diễn giải của người giảng, cố ý “đẩy hơi xa” để làm rõ vấn đề."], "src": [0]}, {"type": "flow", "title": "Ba lớp khủng hoảng cuối thế kỷ 19", "steps": [{"title": "Triết học", "text": "Schopenhauer (ý chí bất lực), Nietzsche (hỗn loạn Dionysos và Apollo), Bergson (trực giác giới hạn lý trí) làm lung lay mô hình Descartes, Kant."}, {"title": "Xã hội", "text": "Xã hội thực chứng hiện đại kiệt sức vì quá nhiều chức năng."}, {"title": "Nghệ thuật tìm lối thoát", "text": "Gauguin tìm cái nguyên sơ, Tượng trưng tìm giấc mơ và tâm linh, Art Nouveau tìm sức sống của cây cỏ. Nhật Bản cung cấp một mô hình sẵn."}], "note": "Bằng chứng ngược: tranh Nhật có ở Hà Lan từ thế kỷ 16, bảo tàng dân tộc học Leiden cạnh nhà Van Gogh có đủ giáp, kimono, tranh khắc, nhưng chẳng ai học cho đến khi hệ hình đổi.", "src": [0, 1]}, {"type": "story", "title": "Phân tích sâu: ba lớp khủng hoảng và câu trả lời từ Nhật", "items": [{"title": "1. Triết học: chủ thể lý tính mất chỗ đứng", "paras": ["Hệ hình cũ dựa trên một hình dung từ Descartes: con người là chủ thể lý tính đứng bên ngoài thế giới, quan sát nó như một đối tượng đo đếm được. Kant thêm rằng không gian và thời gian là khung có sẵn trong tâm trí, mọi trải nghiệm đều được xếp vào đó. Phối cảnh tuyến tính là hình thức thị giác của tư tưởng này: một con mắt duy nhất, đứng yên, mọi đường quy về một điểm. Nhà sử học nghệ thuật Erwin Panofsky về sau (1927) gọi phối cảnh là một ‘hình thức biểu tượng’ của thế giới quan, chứ không phải cách nhìn tự nhiên.", "Cuối thế kỷ 19, hình dung đó bị lật. Schopenhauer (‘Thế giới như ý chí và biểu tượng’, 1818, được đọc rộng ở Pháp từ thập niên 1880) cho rằng đằng sau thế giới ta thấy là một ý chí mù quáng, lý trí chỉ là bề mặt. Nietzsche (‘Sự ra đời của bi kịch’, 1872) đặt Apollo, trật tự và hình thể rõ ràng, đối diện Dionysos, say sưa và hoà tan ranh giới. Bergson (1889) phân biệt thời gian đồng hồ, chia được như không gian, với thời gian sống (durée), chỉ nắm được bằng trực giác."], "bullets": ["Tranh Nhật trả lời: không có một chủ thể cố định. Góc nhìn thay đổi trong cùng một bức, người xem có khi lơ lửng trên cao, có khi sát mặt đất.", "‘Ukiyo’ là thế giới phù du: tranh bắt khoảnh khắc đang trôi (mưa rào, gió thổi, người đang cúi), gần với ý thời gian sống hơn là một cảnh đứng yên vĩnh viễn.", "Tranh không chia rõ chủ thể và cảnh vật: con người chỉ là một phần nhỏ của sóng, núi, cây. Đúng điều các nhà phê bình gọi là người Nhật ‘không phân biệt mình với thế giới’."], "src": [5], "img": "nietzsche", "caption": "Nietzsche, 1882. Cùng năm ông viết Khoa học vui với câu “Thượng đế đã chết”."}, {"title": "2. Xã hội: hiện đại hoá làm con người kiệt sức", "paras": ["Paris thời Đế chế thứ hai được Haussmann cải tạo (1853–70): đại lộ, nhà ga, cửa hàng bách hoá, hàng hoá sản xuất hàng loạt. Chủ nghĩa thực chứng của Auguste Comte tin rằng khoa học và tổ chức hợp lý sẽ giải quyết mọi vấn đề. Nhưng cùng lúc, xã hội chuyên môn hoá cao khiến cá nhân bị chia nhỏ thành những chức năng. Émile Durkheim (1893, 1897) gọi trạng thái mất phương hướng này là anomie.", "Trong nghệ thuật, phản ứng rõ nhất là chống lại hàng công nghiệp: phong trào Arts and Crafts của William Morris ở Anh muốn trả lại vị trí cho người thợ thủ công và xoá ranh giới giữa mỹ thuật và đồ dùng."], "bullets": ["Tranh Nhật trả lời: châu Âu hình dung Nhật là xã hội nơi nghệ thuật chưa tách khỏi đời sống. Một chiếc lược, một cái hộp sơn mài, một tờ tranh in rẻ đều đẹp ngang tranh treo tường.", "Không có thứ bậc giữa ‘mỹ thuật’ và ‘trang trí’: điều này mở đường cho Art Nouveau, Wiener Werkstätte, nơi kiến trúc sư thiết kế từ toà nhà đến chiếc thìa.", "Lưu ý: đây là một hình ảnh lý tưởng hoá. Chính nước Nhật lúc đó đang công nghiệp hoá và Tây hoá nhanh hơn bao giờ hết."], "src": [5], "img": "caillebotte-rain"}, {"title": "3. Nghệ thuật: ba lối thoát, một nguồn chung", "paras": ["Khi hệ hình cũ không còn được tin, nghệ sĩ đi tìm ở ba hướng, và cả ba đều dùng Nhật Bản theo cách riêng."], "bullets": ["Gauguin và nhóm Pont-Aven (1886–91) tìm cái nguyên sơ, trước văn minh: ở Bretagne, rồi Tahiti. Từ tranh Nhật họ lấy mảng màu phẳng, viền đậm, bố cục cắt chéo (‘Thị kiến sau bài giảng’, 1888).", "Chủ nghĩa Tượng trưng (tuyên ngôn của Moréas, 1886; Redon, Moreau, Mallarmé) tìm giấc mơ và tâm linh, muốn gợi chứ không tả. Tranh Nhật cho họ ví dụ về hình ảnh giản lược, để trống, gợi không khí bằng vài nét.", "Art Nouveau tìm sức sống của cây cỏ: đườn
