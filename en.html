ounded in 1648; it decided how artists were trained, the Prix de Rome and the official Salon.", "The hierarchy of genres (Félibien, 1667): history painting at the top, then portraits, genre scenes, landscapes, still lifes.", "Technique: drawing (dessin) before colour, shading to model three dimensions, a smooth surface with no visible brushstrokes.", "The model: Raphael's ‘The School of Athens’ (1509–11): symmetrical architecture, the vanishing point between the two philosophers, everything stable and complete."], "src": [5], "img": "raphael-athens", "caption": "Raphael, The School of Athens, 1509–11: the model of the paradigm, every line converging on the vanishing point between Plato and Aristotle."}, {"title": "Four cracks in the 19th century", "paras": ["Photography (1839) imitated reality more cheaply and accurately than the painter's hand, raising the question of what painting was still for. In 1863 the Salon des Refusés showed paintings rejected by the official Salon, including Manet's ‘Le Déjeuner sur l'herbe’. In 1874 the Impressionists organised their own exhibition.", "The science of colour (Chevreul, 1839) and of vision showed that the eye does not see like a perspective window. Philosophy (Schopenhauer, Nietzsche, then Bergson with his ‘Essay on the Immediate Data of Consciousness’, 1889) valued intuition, will and lived time over reason.", "Old values such as centre, balance, completeness and three-dimensional modelling began to feel restrictive. Japanese prints, off-centre, flat and cropped, offered a ready-made alternative."], "src": [5], "img": "manet-dejeuner", "caption": "Manet, Le Déjeuner sur l'herbe, 1863: flat areas of light, inconsistent perspective, rejected by the Salon.", "gallery": [{"img": "daguerre-temple", "caption": "Photography: Daguerre, Boulevard du Temple, 1838"}, {"img": "cabanel-venus", "caption": "The 1863 Salon chose Cabanel: a smooth, academic nude"}, {"img": "chevreul-cercle", "caption": "The science of colour: Chevreul's colour circle"}, {"img": "palais-industrie", "caption": "The Palais de l'Industrie, home of the Salon and the Salon des Refusés"}]}, {"title": "Why Japan and not somewhere else", "paras": ["Europe also knew Chinese, Indian and Islamic art. But Japanese prints had three advantages: mass-printed, they were cheap and plentiful; they depicted everyday life, the subject modern painters were looking for; and they had a clear, learnable system of composition rather than mere ornament.", "The timing matched too: Japan opened up (1854–58) just as Paris entered its paradigm crisis (1860–90)."], "src": [5], "img": "hiro-kameido", "caption": "Hiroshige, Plum Garden at Kameido, 1857: a complete system of composition, mass-printed, cheap and easy to learn."}]}, {"type": "media", "kicker": "Case study · Video 1, 26:12", "title": "The “paradigm crisis” table in the lecture", "img": "v1-1572", "caption": "Slide: the rational system (The School of Athens) facing the system in crisis (the Japanese, “the eternal child”) · 26:12", "text": "The lecturer sums up the whole argument in one table: on the left, the model inherited from the Renaissance, with its all-knowing, centred, balanced, symmetrical view; on the right, what was now admired, Japanese prints, which Europeans themselves described as childish, off-centre and incomplete.", "bullets": ["Raphael's School of Athens is the model of the all-knowing view.", "Two opposing columns, criterion by criterion."], "src": [2]}, {"type": "media", "kicker": "Case study · Video 1, 28:20", "title": "A Napoleon III plate: everything points to the centre", "img": "v1-1700", "caption": "A Napoleon III porcelain plate, with lines showing the axes of symmetry · 28:20", "text": "To prove the point, the lecturer uses the most everyday object: a plate. Draw lines from the border motifs and they all meet at the centre; three floral panels form an equilateral triangle; the central motif sits dead centre. Everything is balanced, perfectly academic.", "bullets": ["The axes meet at the centre of the plate.", "The border motif repeats evenly around the rim."], "src": [3]}, {"type": "media", "kicker": "Case study · Video 1, 28:47", "title": "The Rousseau plates: illogical, incomplete, empty space", "img": "v1-1727", "caption": "Plates from the Rousseau service: a lobster with an aubergine and a bird; a gourd leaf with a grasshopper · 28:47", "text": "Next to the Napoleon III plate, the Rousseau service breaks every rule: a lobster with an aubergine and a bird, “as if living on another planet”; a gourd leaf reduced to a fragment, in close-up; half the plate left empty. In a single piece of tableware we see the whole crisis of vision.", "bullets": ["The rhetorical logic of academic composition is gone.", "One side full, one side empty: the art of empty space."], "src": [4]}, {"type": "text", "title": "How Europeans read Japanese prints", "paras": ["Critics admired Japanese prints but described them in European words: asymmetrical, unbalanced, off-centre (Ernest Chesneau). That is, they judged them by their own standards.", "They looked for physiological and climatic reasons: the Japanese eye “looks through the wrong end of the telescope”, so it sees in close-up (Paul Dalloz); the clear air makes colours bright and lines sharp (Théodore Duret). Van Gogh believed this and went to Arles in search of a “Japanese climate”.", "They credited the Japanese with childlike innocence: “the innocent eye” (Ruskin), “artist and child”, “not distinguishing themselves from the world”."], "src": [0]}, {"type": "callout", "tone": "info", "title": "The lecturer's psychoanalytic reading", "items": ["The description “not aware of the limits of the self” matches the “oceanic feeling” of the infant ego in Freud's Civilization and Its Discontents, and Lacan's stage before the “mirror” (0 to 6 months).", "The paradox: an academy that worships grandeur, reason and the all-knowing view admires what it itself describes as childish. The lecturer reads this as a sign of crisis.", "This is the lecturer's interpretation, deliberately “pushed a little far” to make the point clear."], "src": [0]}, {"type": "flow", "title": "Three layers of crisis at the end of the 19th century", "steps": [{"title": "Philosophy", "text": "Schopenhauer (the powerless will), Nietzsche (Dionysian chaos versus Apollo) and Bergson (intuition limiting reason) shook the model of Descartes and Kant."}, {"title": "Society", "text": "Modern positivist society is exhausted by too many functions."}, {"title": "Art looks for a way out", "text": "Gauguin looks for the primitive, Symbolism for dreams and the spiritual, Art Nouveau for the life force of plants. Japan offers a ready-made model."}], "note": "Counter-evidence: Japanese pictures had been in the Netherlands since the 16th century, and the ethnographic museum in Leiden near Van Gogh's home had armour, kimonos and prints aplenty, but nobody learned from them until the paradigm changed.", "src": [0, 1]}, {"type": "story", "title": "Analysis: the three layers of crisis and Japan's answer", "items": [{"title": "1. Philosophy: the rational subject loses its footing", "paras": ["The old paradigm rested on an idea inherited from Descartes: the human being is a rational subject standing outside the world, observing it as a measurable object. Kant added that space and time are frameworks built into the mind, into which every experience is sorted. Linear perspective is the visual form of this thinking: a single, motionless eye, every line converging on one point. The art historian Erwin Panofsky later (1927) called perspective a ‘symbolic form’ of a worldview rather than a natural way of seeing.", "At the end of the 19th century, that idea was overturned. Schopenhauer (‘The World as Will and Representation’, 1818, widely read in France from the 1880s) argued that behind the world we see lies a blind will, and reason is only the surface. Nietzsche (‘The Birth of Tragedy’, 1872) set Apollo, order and clear form, against Dionysus, intoxication and dissolving boundaries. Bergson (1889) distinguished clock time, divisible like space, from lived time (durée), graspable only by intuition."], "bullets": ["Japanese prints answer: there is no fixed subject. The viewpoint changes within a single picture; the viewer sometimes floats high above, sometimes is close to the ground.", "‘Ukiyo’ is the floating world: the prints catch a passing moment (a sudden shower, a gust of wind, someone bending over), closer to the idea of lived time than to a scene frozen for ever.", "The prints do not clearly separate subject and scenery: people are only a small part of the waves, mountains and trees. Exactly what the critics meant when they said the Japanese ‘do not distinguish themselves from the world’."], "src": [5], "img": "nietzsche", "caption": "Nietzsche, 1882. The same year he wrote The Gay Science, with the line “God is dead”."}, {"title": "2. Society: modernisation exhausts people", "paras": ["Second Empire Paris was rebuilt by Haussmann (1853–70): boulevards, railway stations, department stores, mass-produced goods. Auguste Comte's positivism believed that science and rational organisation would solve every problem. But at the same time, a highly specialised society broke individuals down into functions. Émile Durkheim (1893, 1897) called this state of disorientation anomie.", "In art, the clearest reaction was against industrial goods: William Morris's Arts and Crafts movement in England wanted to give the craftsman back his place and erase the line between fine art and useful objects."], "bullets": ["Japanese prints answer: Europe imagined Japan as a society where art had not yet been separated from life. A comb, a lacquer box, a cheap print were all as beautiful as a picture on the wall.", "No hierarchy between ‘fine art’ and ‘decoration’: this opened the way for Art Nouveau and the Wiener Werkstätte, where architects designed everything from the building to the spoon.", "Note: this is an idealised picture. At the time, Japan was industrialising and Westernising fast."], "src": [5], "img": "caillebotte-rain"}, {"title": "3. Art: three ways out, one common source", "paras": ["When the old paradigm was no longer believed in, artists searched in three directions, and all three used Japan in their own way."], "bullets": ["Gauguin and the Pont-Aven group (1886–91) looked for the primitive, before civilisation: in Brittany, then Tahiti. From Japanese prints they took flat areas of colour, heavy outlines and diagonal cut-off compositions (‘Vision after the Sermon’, 1888).", "Symbolism (Moréas's manifesto, 1886; Redon, Moreau, Mallarmé) looked for dreams and the spiritual, wanting to suggest rather than describe. Japanese prints gave them examples of simplified images, empty space, atmosphere evoked in a few strokes.", "Art Nouveau looked for the life force of plants: curves growing like stems. Japanese prints and crafts supplied a store of plant and insect motifs and a way of letting a single branch fill a whole surface."], "src": [5], "img": "redon-eye", "caption": "Redon, 1882: Symbolism does not describe the world but evokes dreams."}, {"title": "4. Why Japan was a ‘ready-made model’", "paras": ["The other ways out all had to be built from scratch: Gauguin's primitive was imagined, Symbolism's dream had no rules of drawing. Japanese art, by contrast, was already a complete system, with techniques, compositional conventions and thousands of works that could be bought cheaply in Paris. It was different enough to replace the old paradigm and concrete enough to be learned at once."], "src": [5], "img": "expo1878-japon", "caption": "The Japanese section at the 1878 Exposition: a complete artistic system on sale in the middle of Paris."}, {"title": "5. The limits of this explanation", "paras": ["The ‘paradigm crisis’ model explains well why it happened at this moment: Japanese objects had been in Europe for two centuries but were only learned from in 1860–90. But it needs to be supplemented by at least two factors."], "bullets": ["The market: after 1858 the volume of Japanese prints and goods soared, prices were low, there were professional dealers (Hayashi, Bing) and world's fairs to promote them. Without this supply, the crisis would have had nowhere to look for an answer.", "Projection: Paris's ‘Japan’ was largely an image Europe drew for its own needs: innocent, close to nature, unspoiled by modernity. From the standpoint of Edward Said (‘Orientalism’, 1978), this is also a form of Orientalism, even if an admiring one."], "src": [5], "img": "beato-shamisen", "caption": "Beato photographs sold to Western visitors: a Japan staged to match European expectations."}]}, {"type": "gallery", "title": "Historical documents for the three layers of crisis", "items": [{"img": "schopenhauer", "caption": "Philosophy: Schopenhauer, 1859. ‘The World as Will and Representation’ was widely read by French artists from the 1880s."}, {"img": "marville-opera", "caption": "Society: Paris torn open to build the Avenue de l'Opéra, about 1876–77 (photograph by Marville)."}, {"img": "morris-strawberry", "caption": "Society: William Morris (Arts and Crafts) opposes industrial goods with hand-printed textiles, 1883."}, {"img": "gauguin-vision", "caption": "Art: Gauguin, Vision after the Sermon, 1888: flat areas, a diagonal tree trunk in the manner of Hiroshige."}, {"img": "japon-artistique", "caption": "The ready-made model: Bing's journal Le Japon artistique (1888–91) brought Japanese models all over Europe."}], "src": [5]}, {"type": "table", "title": "Summary: crisis, need, and what Japanese prints supplied", "columns": ["Layer of crisis", "New need", "What Japanese prints supplied", "Examples"], "widths": [18, 26, 30, 26], "rows": [["Philosophy", "Escape from a single fixed rational eye; capture the moment, intuition", "A moving viewpoint, the fleeting moment, people merging into the scene", "Degas, Portrait of Diego Martelli; Monet, painting in series"], ["Society", "Reconcile art and life, resist soulless industrial goods", "Everyday objects are art too; no hierarchy of fine and decorative art", "The Rousseau Service; Gallé; Wiener Werkstätte"], ["Art", "A new visual language: primitive, evocative, the life force of plants", "Flat areas, heavy outlines, simplification, empty space, plant motifs", "Gauguin, Vision after the Sermon; Klimt; Horta"]], "src": [5]}]}, "principles": {"page": "principles", "title": "8 techniques learned from Japan", "group": "Visual language", "lead": "This is the “drop of blood” the lecturer wants listeners to be able to recognise in almost all European painting and sculpture from 1860 to 1910.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2”, 28 to 38 min", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 2/2”, 22 to 46 min", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Video 1, 34:05: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=2045s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, 24:46: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=1486s", "date": "Art d'Histoire, 2018"}, {"name": "Video 1, 37:20: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=2240s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, 32:05: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=1925s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, 43:46: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=2626s", "date": "Art d'Histoire, 2018"}, {"name": "Additional art-history background beyond the two lectures, written by the compiler", "date": ""}], "blocks": [{"type": "principles", "title": "8 techniques", "items": [{"title": "Close-up cropping", "rule": "Enlarge one fragment and cut away the rest.", "why": "Hiroshige shows a section of a bridge; Monet and Whistler also show bridges in close-up. A Rousseau plate shows three quarters of a fish, the rest “on the back of the plate”.", "img": "whistler-nocturne"}, {"title": "The cut-off foreground", "rule": "A branch, a post or a mule blocks the view right in front of the eye.", "why": "Monet places the foot of a bridge across the view; Degas crops a bin and a man in a hat at the edge of the picture.", "img": "hiro-kameido"}, {"title": "Diagonal composition", "rule": "Diagonals pull the eye strongly into the depth or out of the picture.", "why": "It creates rhythm and pull. Found in Munch (The Scream, Girls on the Bridge), Kirchner, Degas and Lautrec.", "img": "hiro-ohashi"}, {"title": "The art of empty space", "rule": "One side empty, the other crowded with detail.", "why": "Hokusai packs a crowd into a few centimetres and leaves the rest empty. Bonnard leaves a quarter of a screen blank.", "img": "degas-dancers"}, {"title": "Flat areas of colour", "rule": "Stacked areas of a single colour, without modelling.", "why": "Carl Thiemann, Degas (the Place de la Concorde as a yellow wall), Bonnard imitating woodblock printing in paint.", "img": "degas-concorde"}, {"title": "The moving viewpoint", "rule": "Each part of the picture is seen from a different height, and the floor tilts up.", "why": "Like a “moving camera”. Portrait of Diego Martelli (1879): the chair seen straight on, the floor seen from above.", "img": "degas-martelli"}, {"title": "Arabesque: repetition with variation", "rule": "Repeat a motif, slightly different each time.", "why": "Hiroshige's and Hokusai's rows of tree trunks; Degas's three dancers; Bonnard's horse-drawn carriage.", "img": "katagami"}, {"title": "Silhouette and outline", "rule": "A dark shape on a light ground, a line around an area of a single colour.", "why": "Shadows behind Japanese paper screens. Lautrec turns the singer Aristide Bruant into a black mass, and Yvette Guilbert into little more than a pair of gloves.", "img": "lautrec-goulue"}], "src": [0, 1]}, {"type": "story", "title": "In depth: each technique, with more European examples", "items": [{"title": "A high horizon, seen from above", "paras": ["Japanese prints often place the viewer high up, with the ground tilted up into a single plane. Monet used this in ‘Garden at Sainte-Adresse’ (1867), which he jokingly called his ‘Chinese painting with flags’. Caillebotte and Pissarro painted Paris boulevards from high windows, the passers-by reduced to small dots."], "src": [7]}, {"title": "Flat areas, heavy outlines: from Japan to ‘cloisonnism’", "paras": ["In 1887–88 Émile Bernard and Louis Anquetin painted flat areas of colour outlined in black, which the critic Édouard Dujardin named ‘cloisonnism’ (after cloisonné enamel). They openly named Japanese prints and stained glass as sources. Gauguin used the method in ‘Vision after the Sermon’ (1888): a flat red ground, a diagonal tree trunk cutting the picture in two as in Hiroshige.", "The Nabis (Sérusier, Bonnard, Vuillard, Maurice Denis) went further. Denis's famous line (1890): a picture, before being a horse or a woman, is a flat surface covered with colours arranged in a certain order."], "src": [7]}, {"title": "Painting in series", "paras": ["Hokusai painted Fuji 36 times, Hiroshige the 53 stations of the Tōkaidō road. The idea of one subject from many angles and at many moments reappears in Monet's Haystacks (1890–91) and Rouen Cathedral series. Henri Rivière even made ‘Thirty-six Views of the Eiffel Tower’ (printed in 1902), borrowing the title of Hokusai's series."], "src": [7]}, {"title": "New formats", "paras": ["Narrow vertical formats like kakemono and pillar prints (hashira-e), round fans and multi-panel screens were tried out by European painters. The 4th Impressionist exhibition (1879) had a whole room of fan paintings by Degas, Pissarro and Forain. Bonnard and Vuillard painted folding screens; Whistler designed frames as part of the work."], "src": [7]}, {"title": "Meaningful empty space", "paras": ["In Japanese prints, the paper left blank stands for mist, water, snow or air. In academic painting, the canvas had to be fully covered. Whistler, then Klimt and the Art Nouveau designers, learned to leave a large part of the surface empty and to treat empty space as an element of composition."], "src": [7]}]}, {"type": "media", "kicker": "Case study · Video 1, 34:05", "title": "Close-up cropping: Whistler next to Hiroshige", "img": "v1-2045", "caption": "Left: Whistler, Nocturne: Old Battersea Bridge. Right: Hiroshige, Kyōbashi Bridge · 34:05", "text": "Europe did paint bridges, but as a detail in a broad landscape, with ruins and a pair of lovers. Here both show only the bridge, in close-up, the pillar cut off by the top edge. The lecturer also points to the boatman standing in his boat in the Whistler: a very Japanese pose.", "bullets": ["Technique 1: close-up cropping.", "Near-monochrome colour evoking lacquerware."], "src": [2]}, {"type": "media", "kicker": "Case study · Video 2, 24:46", "title": "The cut-off foreground: Degas next to Hiroshige", "img": "v2-1486", "caption": "Left: Degas, A Woman Seated beside a Vase of Flowers, 1865. Right: Hiroshige, a cut-off foreground · 24:46", "text": "By academic standards, Degas's picture “does not know what to choose”: the bouquet is cropped, the portrait is cropped, the woman looks out of the frame. Next to Hiroshige, where a large object blocks the view right in front of the eye, that cropping has a clear source and brings the picture to life.", "bullets": ["Technique 2: the cut-off foreground.", "The figure's gaze draws the viewer out of the picture."], "src": [3]}, {"type": "media", "kicker": "Case study · Video 1, 37:20", "title": "Diagonals and “living” trees: Munch next to Hiroshige", "img": "v1-2240", "caption": "Left: Hiroshige, travellers under the moon. Right: Munch · 37:20", "text": "Japanese drawing manuals demanded that trees move from trunk to tip, as if they had arms. Munch keeps both: the twisting row of trees and the diagonal that pulls the viewer's eye into the depth, with a cut-off foreground.", "bullets": ["Technique 3: diagonal composition.", "Technique 7: a row of trees repeated with variation."], "src": [4]}, {"type": "media", "kicker": "Case study · Video 2, 32:05", "title": "Diagonals without perspective: Kirchner next to Hiroshige", "img": "v2-1925", "caption": "Left: Hiroshige, Amanohashidate (black and white). Right: Kirchner, as described in the lecture · 32:05", "text": "The lecturer deliberately shows the Hiroshige in black and white to compare it with a European print: a diagonal strip of land, people walking in a line, drawing the eye into the depth without following the rules of one-point perspective.", "bullets": ["A diagonal across the whole frame.", "No clear vanishing point."], "src": [5]}, {"type": "media", "kicker": "Case study · Video 2, 43:46", "title": "Silhouettes behind paper screens", "img": "v2-2626", "caption": "Left: a print of actors, figures in shadow behind a paper screen. Right: Hiroshige, a row of trees and their shadows · 43:46", "text": "At night in Japan, people saw shadows through paper screens. Prints often used silhouettes: dark shapes on a light ground, even pale tree shadows behind a row of trees. Paris posters took up this device because it could be read from a distance.", "bullets": ["Technique 8: silhouette.", "Continued on the Toulouse-Lautrec page."], "src": [6]}, {"type": "dodont", "title": "Surface and depth", "doTitle": "Real assimilation (the deep layer)", "dontTitle": "Just fashion (the surface layer)", "do": ["Changing the framing and the viewer's position", "Using empty space as an element", "Dropping one-point perspective, several viewpoints in one picture", "Learning the line, its rhythm and simplification"], "dont": ["Dressing models in kimonos", "Hanging fans and screens as backdrops", "Copying Japanese characters without knowing what they mean (Van Gogh even copied a brothel advertisement)", "Copying seals in the belief that they were signatures (they were actually owners' or censors' seals)"], "src": [0, 1]}, {"type": "callout", "tone": "warn", "title": "The lecturer's caveats", "items": ["“The Japanese did not invent perspective; they were not interested in it.” The European eye, trained to look for a vanishing point, still reads perspective into Japanese prints and then finds it “wrong”.", "One could say Degas was influenced by photography, but a historian has remarked that the framing of Place de la Concorde is “photographically impossible”."], "src": [1]}]}, "motifs": {"page": "motifs", "title": "Motifs in the decorative arts", "group": "Visual language", "lead": "In the decorative arts, the “borrowing” is most visible: from porcelain plates and glass vases to jewellery, motifs went straight from Hokusai Manga and Japanese drawing manuals into workshops in France, America and Austria.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2”, 8 to 51 min", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Video 1, 9:15: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=555s", "date": "Art d'Histoire, 2018"}, {"name": "Video 1, 40:15: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=2415s", "date": "Art d'Histoire, 2018"}, {"name": "Video 1, 41:20: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=2480s", "date": "Art d'Histoire, 2018"}, {"name": "Video 1, 42:15: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=2535s", "date": "Art d'Histoire, 2018"}, {"name": "Additional art-history background beyond the two lectures, written by the compiler", "date": ""}], "blocks": [{"type": "table", "title": "Motifs and where they appear in the West", "columns": ["Motif", "Japanese source", "Appears in", "Why it matters"], "widths": [16, 22, 32, 30], "rows": [["Lobster, grasshopper, gourd", "Hokusai Manga", "The Bracquemond–Rousseau dinner service (1867), Lambert–Rousseau", "Almost a copy; pairing a lobster with an aubergine and a bird is illogical by academic standards"], ["Gourd plants, tendrils", "Hokusai", "Tiffany, Gallé's screens", "Proliferating plants symbolise the energy Art Nouveau needed"], ["Stylised waves and foam", "Dragon screen, Hiroshige", "Bing's chased silver, Ernest Chaplet's ceramic vases", "A way of drawing waves completely unlike the realism of English cloud paintings"], ["Carp leaping through water", "Symbol of courage and energy", "Vase by Chaplet", "European artists most likely did not know the symbolic meaning"], ["Irises", "Japanese drawing manuals", "Otto Eckmann, Eugène Grasset, Marcus & Co, Lalique, Van Gogh", "Relearning how to draw flowers from Japanese models; rediscovering cloisonné enamel"], ["Butterflies with spread wings", "Stencil pattern books", "Théodore Deck plates, jewellery, Whistler's butterfly signature", "Simplified almost to abstraction, keeping only the outline"], ["Dragonflies", "Hokusai, inro boxes", "Daum and Gallé lamps and vases, hairpins", "Judith Gautier translated about 80 Japanese poems in Poèmes de la libellule"], ["Bats", "Kabuki actors' kimonos", "Vase by Gallé", "18th-century Rococo never decorated with bats"], ["Eels, snakes, sinuous curves", "Hokusai", "Lalique sugar box", "Rising curves"], ["Tsuba (sword guards)", "Metalworkers lost their jobs when wearing swords was banned", "Belt buckles, Lautrec's signature", "Skills in metalworking, chasing and embossing moved into export goods"], ["Open fans", "Fan-shaped prints", "Degas's fans", "The challenge of painting on an arc-shaped field with an empty centre"], ["Shoji screen lattice", "Japanese architecture", "Mackintosh chairs, Godwin interiors (1867)", "A black grid on a paper ground became the language of the Glasgow School"]], "note": "Titles and dates of works as given in the lecture; the lecturer herself says she is “not sure” about some details."}, {"type": "story", "title": "In depth: craftsmen and workshops", "items": [{"title": "Émile Gallé and the School of Nancy", "paras": ["In Nancy, the glassmaker Émile Gallé befriended Takashima Hokkai, a Japanese forestry engineer studying at the Nancy forestry school (1885–88) who was also a painter. Gallé's glass vases carry dragonflies, carp and irises, often with lines of poetry engraved on the body.", "Gallé did not copy Japanese prints but learned to observe nature in close-up and to let a single branch occupy the whole surface of an object."], "src": [5]}, {"title": "Ceramics and glazes in Paris", "paras": ["Théodore Deck and Ernest Chaplet studied the glazes of East Asian ceramics: crackle, flowing glazes, copper red. Chaplet rediscovered the ‘sang-de-bœuf’ (oxblood) glaze in the 1880s. The Christofle workshop made cloisonné-enamelled bronzes in the Japanese manner for the World's Fairs."], "src": [5]}, {"title": "Tiffany in New York", "paras": ["Louis Comfort Tiffany and the silver designer Edward C. Moore of Tiffany & Co. both collected Japanese objects. Tiffany silver at the 1878 Exposition featured fish, dragonflies and gourd leaves, inlaid with several metals using Japanese techniques. Louis C. Tiffany's lamps and stained glass later used dragonflies, wisteria and lotus."], "src": [5]}, {"title": "Common motifs", "bullets": ["Waves: from Hokusai to Chaplet's ceramics, Art Nouveau patterns, even Van Gogh's skies.", "Irises: from Hiroshige and Hokusai to Van Gogh, Gallé, Liberty fabrics and wrought iron.", "Dragonflies, grasshoppers, carp: insects and fish raised to main subjects, something rare in European decoration.", "Chrysanthemums, cherry blossom, plum branches: usually placed off to one corner, with the rest left empty.", "Mon (round crests): becoming repeated circles on fabrics, clothes and the backgrounds of Klimt's paintings."], "src": [5]}]}, {"type": "media", "title": "Example: a plate from the Rousseau Service", "img": "bracquemond", "text": "Bracquemond copied motifs from Hokusai Manga onto a dinner service for the ceramics dealer Rousseau. The plates caused a sensation at the 1867 World's Fair.", "bullets": ["Motifs placed off-centre, most of the plate left empty: “the art of empty space”.", "Each plate shows an unrelated fragment of nature, breaking the logic of academic composition.", "The lecturer: “this time we have reached the threshold of plagiarism”."], "src": [0]}, {"type": "media", "kicker": "Case study · Video 1, 9:15", "title": "Plates next to their models: lobster, gourd, grasshopper", "img": "v1-0555", "caption": "On the slide: the left column shows plates from the Rousseau service, the right column the Japanese models (below: Utamaro, 1788) · 9:15", "text": "The lecturer places the plates and the originals side by side: the lobster, the gourd and the grasshopper are copied almost exactly. When Rousseau went on to work with Lambert, the same grasshopper reappeared; she says “this time we reach the threshold of plagiarism”.", "bullets": ["Compare each line of the lobster's legs and the leaf stems.", "Off-centre motifs, most of the plate left empty."], "src": [1]}, {"type": "media", "kicker": "Case study · Video 1, 40:15", "title": "Waves: a Chaplet vase next to Hiroshige", "img": "v1-2415", "caption": "Left: ceramic vase by Ernest Chaplet. Right: Hiroshige, the sea at Suruga · 40:15", "text": "Hiroshige's claw-like foam is carved almost identically on the French vase. The lecturer guesses that the back shows a carp leaping through water, a Japanese symbol of courage whose meaning European artists probably did not know.", "bullets": ["Until then Europe had drawn waves and clouds realistically.", "Here the wave is a stylised pattern."], "src": [2]}, {"type": "media", "kicker": "Case study · Video 1, 41:20", "title": "Irises: relearning how to draw from Japanese books", "img": "v1-2480", "caption": "Left: a Japanese drawing manual. Centre and right: European iris designs (Eckmann and Grasset, according to the lecture) · 41:20", "text": "European artists “relearned” how to draw irises from Japanese books: spear-like leaves, clearly outlined petals, straight stems. Otto Eckmann and Eugène Grasset copied the models almost exactly.", "bullets": ["Outline instead of modelling.", "Leaves and stems cut off at the edge of the frame."], "src": [3]}, {"type": "media", "kicker": "Case study · Video 1, 42:15", "title": "Gourds: Utamaro next to Tiffany", "img": "v1-2535", "caption": "Left: Utamaro, grasshopper and gourd, 1788. Right: an enamelled ornament (Tiffany, according to the lecture) · 42:15", "text": "Art Nouveau looked for energy in proliferating plants, and the gourd with its tendrils was a chosen motif. The fruit, leaves and tendrils of the Japanese print reappear in Tiffany's decorative objects.", "bullets": ["Tendrils help the plant cling and spread.", "The motif spread flat over the surface of the object."], "src": [4]}, {"type": "gallery", "title": "Iris and wave motifs: from Japan to Europe", "items": [{"img": "hiro-iris", "caption": "Hiroshige, Iris Garden at Horikiri, 1857"}, {"img": "vg-irises", "caption": "Van Gogh, Irises, 1889"}, {"img": "hokusai-wave", "caption": "Hokusai, The Great Wave, about 1831"}, {"img": "hokusai-manga", "caption": "Hokusai Manga: a pattern book for European artists"}]}, {"type": "keypoints", "title": "Three takeaways", "items": ["There was no hierarchy in Japan. Japanese artists made prints, screens and kimono designs alike; Europe began to erase that boundary with Gallé, Bonnard and Art Nouveau.", "Japanese crafts were luxury goods. The rich bought originals, Gallé, Daum; those with less money bought crude copies, but everyone could “Japanise” their interior.", "Once they had learned, they matched the masters. The lecturer stresses that European goldsmiths and glassmakers ended up “no less skilled than the Japanese”."], "src": [0]}]}, "textile": {"page": "textile", "title": "Textiles, Klimt and Art Nouveau", "group": "Visual language", "lead": "Japanese fabrics and stencils changed decoration, architecture and portraiture: figures sink into pattern, and pattern lies flat, parallel to the picture surface.", "sources": [{"name": "Art d'Histoire, “Japonisme 2/2”, 0 to 8 min", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 1/2”, 49 to 52 min", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Video 2, 1:52: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=112s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, 6:27: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=387s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, 7:07: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=427s", "date": "Art d'Histoire, 2018"}, {"name": "Additional art-history background beyond the two lectures, written by the compiler", "date": ""}], "blocks": [{"type": "flow", "title": "From mulberry-paper stencils to 20th-century design", "steps": [{"title": "Katagami", "text": "Stencils made of mulberry bark used to print patterns on wool and silk, in place of costly embroidered kimonos.", "img": "katagami"}, {"title": "Museums bought hundreds", "text": "The Vienna Museum of Art and Industry bought them and gave them to Vienna Secession artists as models."}, {"title": "The Secession and the Wiener Werkstätte", "text": "Klimt led the Secession; the Wiener Werkstätte workshop laid the groundwork for 20th-century design, and then came the Bauhaus."}, {"title": "Belgian Art Nouveau", "text": "Victor Horta's “whiplash” lines in columns, railings and mosaics look as if they stepped out of katagami."}], "src": [0]}, {"type": "story", "title": "In depth: from paper stencils to Vienna", "items": [{"title": "How katagami are made", "paras": ["Katagami are stencils for dyeing fabric (the katazome technique): several layers of mulberry paper laminated with fermented persimmon juice (kakishibu) to make them tough and water-resistant, then cut with knives and punches into very fine patterns. The craftsman lays the stencil on the cloth, applies rice paste, dyes it and washes the paste out: the pasted areas keep the ground colour.", "Thousands of katagami were bought by European museums and schools of applied arts in the late 19th century as teaching models. Their repeating patterns, fine curves and positive–negative contrasts reappear in wallpaper, wrought iron and stained glass."], "src": [5]}, {"title": "Art Nouveau: the ‘whiplash’ curve", "paras": ["In Brussels, Victor Horta built the Hôtel Tassel (1893): iron columns, banisters and murals are all curves winding like creepers. In Paris, Hector Guimard designed the métro entrances (from 1900). The two main sources of this curve were botany and Japanese decorative art."], "src": [5]}, {"title": "Vienna: the Secession and the Wiener Werkstätte", "paras": ["The Vienna Secession was founded in 1897 with Klimt as president, in opposition to the academic artists' association. In 1900 its 6th exhibition was devoted to Japanese art. Josef Hoffmann and Koloman Moser founded the Wiener Werkstätte (1903), a craft workshop built around squares, grids and black-and-white planes, close to the checked patterns on kimonos and katagami stencils.", "Klimt collected kimonos, silk robes and Japanese and Chinese prints. In ‘The Kiss’ and ‘Portrait of Adele Bloch-Bauer I’, the bodies are flat and sink into a patterned robe; only the faces and hands are modelled, a treatment similar to Japanese prints of courtesans."], "src": [5]}, {"title": "Mary Cassatt and her ten colour prints", "paras": ["After seeing the print exhibition at the École des Beaux-Arts in 1890, Mary Cassatt made a series of ten colour prints (1890–91) combining drypoint and aquatint, printing each colour separately as in Japanese prints. The subjects are women's everyday lives: bathing a child, writing a letter, trying on a dress. The patterns of clothes and wallpaper are treated as flat areas."], "src": [5]}]}, {"type": "media", "kicker": "Case study · Video 2, 1:52", "title": "Katagami next to a Horta house", "img": "v2-0112", "caption": "Left: a katagami stencil. Right: a staircase in a building by Victor Horta · 1:52", "text": "The “whiplash” curves of the banisters, columns and glass ceiling in Horta's architecture look as if they stepped out of a Japanese stencil: proliferating plants, swirls, covering the whole surface.", "bullets": ["Compare the curling lines of the stencil with the iron banister.", "Art Nouveau carries flat pattern into architecture itself."], "src": [2]}, {"type": "principles", "title": "Three lessons Klimt took from kimonos and Japanese theatre", "items": [{"title": "The figure sinks into the costume", "rule": "In noh and kabuki, the role lies more in the costume than in the actor.", "why": "Portrait of Adele Bloch-Bauer: an unreal face, lost in a universe of fabric.", "img": "klimt-adele"}, {"title": "Pattern spread flat", "rule": "Pattern parallel to the picture surface, not following the curves of the body.", "why": "Japanese prints show the whole mon crest even when the robe flutters in the wind; Renoir or Monet would have left only a few dabs."}, {"title": "Rosettes on an organic or geometric ground", "rule": "Large motifs placed on a repeating ground.", "why": "The Kiss: ovals and mon-like circles on the woman's robe, black rectangles on the man's.", "img": "klimt-kiss"}], "src": [0]}, {"type": "media", "kicker": "Case study · Video 2, 6:27", "title": "A fabric with mon next to The Kiss", "img": "v2-0387", "caption": "Left: Japanese fabric with round mon crests. Right: Klimt, The Kiss, 1907–08 · 6:27", "text": "Japanese fabric scatters mon circles across a flat ground. Klimt takes exactly that grammar: ovals and circles on the woman's robe, black rectangles on the man's, all parallel to the picture surface, not following the body.", "bullets": ["Flat pattern, no shading.", "The body almost disappears behind the robe."], "src": [3]}, {"type": "media", "kicker": "Case study · Video 2, 7:07", "title": "A checked kimono next to Mary Cassatt", "img": "v2-0427", "caption": "Left: Japanese print, a checked kimono against a striped ground. Right: Mary Cassatt, The Letter, 1890–91 · 7:07", "text": "Japanese prints give priority to costume and background: a checked kimono against vertical stripes. Cassatt places the woman in a patterned dress in front of floral wallpaper; the face sinks between the patterned surfaces.", "bullets": ["The pattern of the dress overlaps the pattern of the wall.", "Something never seen before Japanese prints."], "src": [4]}, {"type": "cards", "title": "Figures absorbed into pattern", "items": [{"title": "Klimt", "text": "Collected kakemono, prints and kimonos, even samurai armour in his studio; wore kimonos of his own design in Vienna.", "src": [0], "img": "klimt-kiss"}, {"title": "Mary Cassatt, La Lettre", "text": "A checked dress against floral wallpaper: something never seen before Japanese prints.", "src": [0], "img": "cassatt-letter"}, {"title": "Vuillard", "text": "The woman seems swallowed by the wallpaper; face and hands are secondary to the checked fabric.", "src": [0]}, {"title": "Godwin, Mackintosh", "text": "Wallpaper with Japanese imperial mon; the black grid of shoji screens became the Glasgow interior.", "src": [0, 1]}]}]}, "vangogh": {"page": "vangogh", "title": "Van Gogh: learning the Japanese line", "group": "Artists", "lead": "“All my work is, so to speak, founded on Japanese art.” The dashes, dots and swirls that make Van Gogh were learned from Hokusai and Japanese drawing manuals more than from “madness”.", "sources": [{"name": "Art d'Histoire, “Japonisme 2/2”, 8 to 22 min", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 1/2”, 20 to 21 and 46 min", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Video 2, 13:32: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=812s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, 14:44: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=884s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, 19:08: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=1148s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, 31:06: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=1866s", "date": "Art d'Histoire, 2018"}, {"name": "Additional art-history background beyond the two lectures, written by the compiler", "date": ""}, {"name": "Artistik TV, “Japonisme : comment l'art japonais a-t-il révolutionné la peinture occidentale ?” (from the film “Quand les impressionnistes découvrent le Japon”, directed by Jérôme Lambert and Philippe Picard, Andana Films)", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4", "date": "2018"}, {"name": "ADN documentary, 32:45: Van Gogh in Paris and Arles", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=1965s", "date": "Artistik TV"}], "blocks": [{"type": "timeline", "title": "Van Gogh and Japanese prints, year by year", "items": [{"when": "1874–75", "title": "Working at Goupil", "text": "Probably came into contact with Japanese art, but without changing how he saw.", "src": [0]}, {"when": "1885", "title": "First mention of Japanese prints in his letters", "text": "Pinned a few sheets on the wall in Antwerp but did not copy them: the realist model still dominated.", "src": [0]}, {"when": "1886–88", "title": "Paris, buying prints at Bing's", "text": "The two brothers gathered more than 500 sheets at a few sous each. The exhibition at the café Le Tambourin was a financial failure, but he was proud to have introduced Japanese art to Bernard and Anquetin.", "src": [0]}, {"when": "1887", "title": "Père Tanguy and the copies", "text": "Japanese prints become the focus behind Père Tanguy. He copies Hiroshige (Kameido) with tracing paper and a grid, and copies Eisen's Courtesan from the cover of Paris Illustré.", "src": [0], "img": "vg-tanguy"}, {"when": "1888", "title": "Going south to Arles in search of a “Japanese climate”", "text": "He read Hayashi's article saying Japan's climate was like Italy's. He wrote: “we see with Japanese eyes”, “I no longer need Japanese prints, I only need to open my eyes”.", "src": [0, 1], "img": "eisen-cover"}, {"when": "1888", "title": "Self-portrait as a monk", "text": "Shaved head, a Japanese-style green background. He dreamed of an artists' community like a monastic order, exchanging gifts like surimono. Only Gauguin came, and it ended with the ear incident.", "src": [0], "img": "vg-bonze"}, {"when": "1890", "title": "Almond Blossom", "text": "A branch right in front of the eye against a single-colour ground, closer to Japanese porcelain than to prints.", "src": [0], "img": "vg-almond"}]}, {"type": "story", "title": "In depth: Van Gogh through his letters and his collection", "items": [{"title": "The brothers' collection", "paras": ["Most of Vincent and Theo's print collection is now in the Van Gogh Museum, Amsterdam: a few hundred sheets, mostly by Hiroshige, Kunisada and Kuniyoshi, largely cheap 19th-century impressions rather than precious ones.", "This matters: Van Gogh did not learn from museum masterpieces but from popular prints for townspeople, with scenes of daily life, landscapes and actors. He cared about how they were made more than their value to collectors."], "src": [6]}, {"title": "Three copies from 1887", "paras": ["In Paris in 1887 he painted three copies in oil: Plum Garden at Kameido and Sudden Shower over Ōhashi Bridge after Hiroshige, and The Courtesan after Eisen. He used tracing paper and a grid to enlarge the image accurately, but made the colours stronger and denser than the originals, and added borders with Chinese characters copied from other prints, without understanding them.", "Copying was the Academy's traditional way of learning (copying in the Louvre). What was new was the model: cheap Japanese prints instead of Raphael."], "src": [6]}, {"title": "Arles: ‘seeing with Japanese eyes’", "paras": ["In February 1888 he went south to Arles. In letters to Theo he wrote that he felt as if he were in Japan, and that all his work was to some extent founded on Japanese art. The blossoming orchards of spring 1888 were a direct answer to Hiroshige's plum garden.", "He also dreamed of a ‘Studio of the South’: a community of artists living simply and exchanging paintings, as he imagined Japanese artists did. Gauguin arrived in Arles in October 1888; the project collapsed two months later."], "src": [6]}, {"title": "The reed pen", "paras": ["In the summer of 1888 he made many drawings in reed pen and ink, such as the Montmajour and Saintes-Maries-de-la-Mer series: no shading, no modelling, only dots, short dashes and curves of varying thickness to create areas of light and dark and texture. It is a translation of the Japanese brush line into a European tool."], "src": [6]}]}, {"type": "story", "title": "More from the documentary: Paris, the Tambourin, Arles", "items": [{"title": "The café Le Tambourin", "img": "vg-tambourin", "paras": ["Arriving in Paris in 1886, Van Gogh regularly went to Bing's shop to buy prints. He made the café Le Tambourin his ‘headquarters’, met Gauguin there, painted the owner Agostina Segatori and persuaded her to let him show his print collection."], "src": [8]}, {"title": "Père Tanguy as a Buddha", "img": "vg-tanguy", "paras": ["Against a background of Japanese prints, the colour merchant Tanguy, who supplied paint to most of the Impressionists, sits facing us with his hands clasped. The film reads this pose as that of a Japanese sage or a benevolent Buddha: Van Gogh honours the man who ground his colours and also ‘Japanises’ him."], "src": [8]}, {"title": "‘A country that will be our Japan’", "paras": ["In a letter to Theo, he wrote that the Impressionists loved Japanese prints and had felt their influence, so why not go to a country that would be our Japan, the South? The future of modern painting lay in the South.", "Arriving in Arles in 1888, he described trees covered in snow, white peaks and a sky bright as ice, ‘like the winter landscapes the Japanese painted’. Gauguin came but did not care for that ascetic community, worried about his friend's mental health and left in December 1888."], "src": [8]}]}, {"type": "media", "kicker": "Case study · Video 2, 13:32", "title": "Van Gogh copies the Kameido plum garden", "img": "v2-0812", "caption": "Left: Hiroshige, 1857. Right: Van Gogh, Japonaiserie: prunier en fleurs, 1887 · 13:32", "text": "Van Gogh traced the Hiroshige and enlarged it square by square. He kept the plum trunk right in front of the eye and the tiny background, but pushed up the colour and added a frame of Chinese characters he could not read.", "bullets": ["The foreground trunk is cut off in both pictures.", "The frames of characters on either side are Van Gogh's addition."], "src": [2]}, {"type": "media", "kicker": "Case study · Video 2, 14:44", "title": "Eisen's Courtesan, with a tracing grid", "img": "v2-0884", "caption": "Left: Keisai Eisen, Courtesan, 1840 (via the cover of Paris Illustré, overlaid with a grid). Right: Van Gogh, 1887 · 14:44", "text": "The image shows how Van Gogh worked: the courtesan on the cover of Paris Illustré was squared up with a grid to enlarge it. The oil painting keeps the black outlines and the flat kimono pattern, set in a yellow frame among a pond, bamboo, cranes and frogs.", "bullets": ["The grid is the method of enlargement.", "The figure is reversed compared with Eisen's original."], "src": [3]}, {"type": "media", "title": "The focus: the line", "text": "The lecturer chooses to concentrate on drawing (dessin), because an exhibition on Van Gogh's Japonisme “would never end”.", "bullets": ["Trees: Japanese manuals demanded movement from trunk to tip; Van Gogh's branches twist exactly like that.", "Pens: he cut his own reed pens (calame) and used sepia and bistre ink; unlike Lautrec, who imported brushes and ink from Japan.", "Line: short dashes, dots and swirls like Hokusai's. From the Saintes-Maries-de-la-Mer drawings to The Starry Night.", "Album: he wanted to make a set of 6 to 12 drawings to exchange with Gauguin and Bernard, like gifts between Japanese artists. It never happened."], "src": [0], "img": "vg-starry", "caption": "Van Gogh, The Starry Night, 1889: stick-like strokes and swirls"}, {"type": "media", "kicker": "Case study · Video 2, 19:08", "title": "Trees in Japanese drawing manuals and Van Gogh's trees", "img": "v2-1148", "caption": "Left: a Japanese drawing manual. Right: Van Gogh, The Parsonage Garden in Winter, 1884 · 19:08", "text": "Japanese manuals demanded that trees move from trunk to tip. The lecturer places next to it a Van Gogh drawing: twisting, almost tormented branches, which later found their way into his oil paintings too.", "bullets": ["Look at the direction in which the trunk and branches twist.", "The drawing dates from 1884, before the Paris period."], "src": [4]}, {"type": "media", "kicker": "Case study · Video 2, 31:06", "title": "Arc compositions and stick-like strokes", "img": "v2-1866", "caption": "Left: Hiroshige, a coastline seen from above. Right: a drawing by Van Gogh · 31:06", "text": "The shoreline curves into an arc sweeping across the picture, creating rhythm and pulling the eye out of the frame. Van Gogh repeats that composition with dashes, dots and stick-like strokes learned from Japanese sketches.", "bullets": ["Compare the great arcs on both sides.", "Dashes and dots instead of filled areas."], "src": [5]}, {"type": "callout", "tone": "good", "title": "The lecturer's conclusion", "items": ["Van Gogh learned his “bundle of sticks” line from the Japanese, then made it his own. In the lecturer's view, that absorption is what made him great."], "src": [0]}]}, "degas": {"page": "degas", "title": "Degas: learning composition and viewpoint", "group": "Artists", "lead": "There are no kimonos or fans in Degas's paintings. Yet an academically trained painter who revered Ingres let Japan seep into his greatest strength: composition.", "sources": [{"name": "Art d'Histoire, “Japonisme 2/2”, 21 to 38 min", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Video 2, 24:46: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=1486s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, 36:21: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=2181s", "date": "Art d'Histoire, 2018"}, {"name": "Additional art-history background beyond the two lectures, written by the compiler", "date": ""}], "blocks": [{"type": "stats", "title": "Collection", "items": [{"value": "117", "label": "Japanese prints found at his death"}, {"value": "Kiyonaga", "label": "Prints of women bathing hung in his bedroom"}, {"value": "Hokusai", "label": "None, but he certainly saw them at Bing's"}], "src": [0]}, {"type": "story", "title": "Five works, five lessons", "items": [{"title": "A Woman Seated beside a Vase of Flowers (1865)", "text": "Both the bouquet and the portrait are cropped. The woman looks out of the frame, drawing the viewer's eye to the museum wall. Incomplete, but lively.", "src": [0], "img": "degas-chrys"}, {"title": "Portrait of Diego Martelli (1879)", "text": "The chair seen straight on, the floor tilting up so we see the soles of his slippers, the table too close yet the paper in the distance still readable. Each part has its own viewpoint, like a moving camera.", "src": [0], "img": "degas-martelli"}, {"title": "Place de la Concorde", "text": "The ground becomes a flat yellow area; every figure is a cut-off foreground; each person looks in a different direction, as in a Kiyonaga print.", "src": [0], "img": "degas-concorde"}, {"title": "Dancers", "text": "In the dancer series, the lecturer points out: diagonals, empty space set against a crowded corner, a staircase or pillar cropped in the foreground, dancers repeated with variation. The illustration (1877): two dancers pushed into the upper corner, the lower half an empty wooden floor running diagonally.", "src": [0], "img": "degas-dancers"}, {"title": "Women in the tub", "text": "Poses taken from Hokusai Manga, like shorthand for movement. The tub seen from above, the floor tilted, the tabletop like an upright wall. Huysmans said he “pulled woman off her pedestal”.", "src": [0], "img": "degas-tub"}]}, {"type": "story", "title": "In depth: Degas, photography and fan paintings", "items": [{"title": "Two sources for the same way of seeing", "paras": ["Besides Japanese prints, Degas was also influenced by photography, and he took many photographs in the 1890s. Snapshots also cut people off at the edge of the frame and catch a moment in mid-movement. The two sources reinforced each other: Japanese prints showed him that cropping was an aesthetic choice, photography showed that it was also how the human eye really sees."], "src": [3]}, {"title": "Fan paintings", "paras": ["Around 1878–80, Degas painted about twenty fans, mostly of dancers, in gouache with gold and silver powder on silk. The semicircular format forced him into off-centre compositions with large empty areas, like Japanese fans. Some were shown at the 1879 Impressionist exhibition."], "src": [3]}, {"title": "Dancers and bathers", "paras": ["Degas's two great subjects are bodies in everyday movement, seen from unusual angles: from above, from behind, bending over. He said he wanted to paint women as if seen through a keyhole, unposed, unaware of being watched. This is what Kiyonaga's bath prints and Hokusai Manga had done, whereas the academic nude was always a posed figure.", "The series of bathers in pastel was shown at the last Impressionist exhibition (1886), including Le Tub."], "src": [3]}, {"title": "His heirs", "paras": ["Mary Cassatt was invited by Degas to join the Impressionists in 1877. Toulouse-Lautrec admired Degas and took up his cropping and diagonal viewpoints in scenes of cafés and theatres. Through Degas, Japanese-style composition entered posters and illustration."], "src": [3]}]}, {"type": "media", "kicker": "Case study · Video 2, 24:46", "title": "A Woman Seated beside a Vase of Flowers, next to Hiroshige", "img": "v2-1486", "caption": "Left: Degas, 1865. Right: Hiroshige, a cut-off foreground · 24:46", "text": "The lecturer places the Degas next to a Hiroshige in which a large object blocks the view close to the eye: Degas's cropping of the bouquet and the portrait follows the same logic of “the fragment instead of the whole”.", "bullets": ["Two things cropped at once: the bouquet and the woman.", "The figure's gaze leads out of the frame."], "src": [1]}, {"type": "media", "kicker": "Case study · Video 2, 36:21", "title": "Hokusai Manga next to Le Tub", "img": "v2-2181", "caption": "Left: Hokusai Manga. Right: Degas, Le Tub, 1886 · 36:21", "text": "The same pose of a body bending over a washtub. Degas took the pose from the manga, then added the view from above and the tilted floor, also learned from Japanese prints.", "bullets": ["The poses almost coincide.", "The tub seen from above."], "src": [2]}, {"type": "callout", "tone": "info", "title": "Who was influenced next", "items": ["Bonnard's bathers: diagonal curtains, tilted floors, a view almost from above.", "Manet, Berthe Morisot: railings and grids learned from prints."], "src": [0]}]}, "lautrec": {"page": "lautrec", "title": "Toulouse-Lautrec: the brush line and the silhouette", "group": "Artists", "lead": "Lautrec imported brushes and ink from Japan, signed inside a tsuba shape, and turned the Paris poster into a lesson in printmaking: diagonals, close-up cropping, black masses, caricature.", "sources": [{"name": "Art d'Histoire, “Japonisme 2/2”, 38 to 49 min", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Video 2, 41:30: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=2490s", "date": "Art d'Histoire, 2018"}, {"name": "Video 2, 43:46: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=PubHMeST-tg&t=2626s", "date": "Art d'Histoire, 2018"}, {"name": "Additional art-history background beyond the two lectures, written by the compiler", "date": ""}, {"name": "ADN documentary, 45:17: Lautrec and the hierarchy of the arts", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2717s", "date": "Artistik TV"}], "blocks": [{"type": "principles", "title": "Five Japanese marks in Lautrec", "items": [{"title": "Signature", "rule": "A monogram inside a tsuba or an elephant shape.", "why": "The ex-libris for Maurice Joyant is also inside a tsuba shape.", "img": "lautrec-mirliton"}, {"title": "Poster composition", "rule": "Close-up cropping, diagonals, a diagonal floor.", "why": "The Jane Avril poster: the bespectacled musician's head, the enlarged neck of the double bass, the diagonal floor. Divan Japonais: a tilted glass that looks about to spill.", "img": "lautrec-avril"}, {"title": "Railings and grids", "rule": "Rows of railings as in Utamaro's prints.", "why": "La Goulue and La Môme Fromage; also found in Degas and Vuillard.", "img": "lautrec-goulue-sister"}, {"title": "Shorthand for movement", "rule": "Poses taken from manga like a “freeze-frame”.", "why": "Jane Avril kicking her leg; the clown Chocolat dancing.", "img": "lautrec-chocolat"}, {"title": "Caricature", "rule": "Distorted mouths and faces, as in Japanese actor prints.", "why": "Aristide Bruant; Yvette Guilbert, who in 1894–95 looked pretty in other artists' hands and “25 years older” in Lautrec's.", "img": "lautrec-yvette"}], "src": [0]}, {"type": "media", "kicker": "Case study · Video 2, 41:30", "title": "Jane Avril next to Hokusai Manga", "img": "v2-2490", "caption": "Left: Toulouse-Lautrec, Jane Avril, 1893. Right: Hokusai Manga · 41:30", "text": "Manga “freeze-frames” the middle of a movement. Lautrec uses exactly that for Jane Avril's high kick; the poster also has the close-up, cropped neck of the double bass and a diagonal floor.", "bullets": ["Compare the raised legs.", "The close-up neck of the bass is a cut-off foreground."], "src": [1]}, {"type": "media", "title": "The silhouette: what posters need most", "text": "At night in Japan, people saw shadows through paper screens. The silhouette came back into fashion through Japanese prints, and suited posters perfectly because it could be read from afar.", "bullets": ["Jane Avril, Sarah Bernhardt, the crowd at the Moulin Rouge: black masses, a few outlines.", "Divan Japonais: Jane Avril stands out as a black mass; the singer Yvette Guilbert is reduced to a pair of gloves.", "The brush allows no correction: quick, simplified, almost abstract strokes.", "Standing in the print shop to choose the colours: blue against black."], "src": [0], "img": "lautrec-goulue", "side": "right"}, {"type": "story", "title": "In depth: Lautrec and the art of the poster", "items": [{"title": "Colour lithography", "paras": ["Lautrec made about thirty posters, starting with ‘Moulin Rouge: La Goulue’ (1891). The technique was colour lithography: drawing on stone, one stone per colour, printed on top of one another. The process resembles the printing of multi-colour Japanese prints, and likewise forces the image to be simplified into areas.", "He used the ‘crachis’ technique: spattering ink with a brush to create speckled areas, the equivalent of the colour gradations in Japanese prints."], "src": [3]}, {"title": "Divan Japonais", "paras": ["The poster ‘Divan Japonais’ (1893) advertises a café-concert with a Japanese name: Jane Avril in a black dress, the critic Édouard Dujardin beside her, the singer Yvette Guilbert on stage with her head cut off, leaving only her black gloves. In the foreground the neck of a double bass cuts diagonally across the frame, like a bridge pillar in a Hiroshige print."], "src": [3]}, {"title": "Seal and costume", "paras": ["Lautrec signed his pictures with an HTL monogram inside a circle, in the manner of the red seals on Japanese prints. A famous photograph from around 1892 shows him in Japanese costume, holding a fan and a doll. He favoured Japanese brushes and ink for his drawings."], "src": [3]}, {"title": "After Lautrec", "paras": ["Paris posters of the 1890s (Chéret, Bonnard, Steinlen, Mucha) all use flat areas, clear outlines and lettering merged into the image. In London, Aubrey Beardsley illustrated ‘Salome’ (1894) in black-and-white masses and fine lines, drawing on Japanese prints. The modern graphic language, from advertising to comics, descends from here."], "src": [3]}]}, {"type": "media", "kicker": "Case study · Video 2, 43:46", "title": "The source of the silhouette: shadows behind paper screens", "img": "v2-2626", "caption": "Left: a print of actors, figures in shadow behind a paper screen. Right: Hiroshige, a row of trees and their shadows · 43:46", "text": "The lecturer explains why Japanese prints are full of silhouettes: at night, through paper screens, all one sees are shadows. Lautrec turned this into the language of the poster.", "bullets": ["A dark shape on a light ground.", "Inner detail is left out."], "src": [2]}, {"type": "media", "title": "No subject is too low", "img": "lautrec-divan", "text": "The documentary stresses another lesson Lautrec took from Hokusai and Hiroshige: no subject is unworthy of being painted. Bars, Montmartre music halls, brothels and Paris nightlife all deserve it; what counts is style and the truthfulness of the scene.", "bullets": ["The late 19th-century avant-garde wanted to break the hierarchy between fine art and decorative art, a hierarchy that did not exist in Japan.", "That is why Lautrec treated the poster, the most popular medium of the time, as the equal of oil painting.", "‘Divan Japonais’ (1893) is an example: a café with a Japanese name, a diagonal cut-off composition, the flat black mass of Jane Avril's dress."], "src": [4]}, {"type": "callout", "tone": "good", "title": "The end of the lecture series", "items": ["Picasso in 1901, at the start of his career, looked to Lautrec, Degas and Bonnard: upended carpets, tubs seen from above, bouquets cropped in the foreground. He learned from Japan indirectly.", "Conclusion: most of the great artists who became the avant-garde “we are so proud of” learned their art and their modernity from Japanese art."], "src": [0]}]}, "glossary": {"page": "glossary", "title": "Terms and people", "group": "Reference", "lead": "Words and names that come up in the two lectures.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2”", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 2/2”", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}], "blocks": [{"type": "table", "title": "Term", "columns": ["Term", "Meaning"], "widths": [26, 74], "rows": [["Japonisme", "The influence of Japanese art and crafts on Western art, roughly 1860 to 1910. Not the study of Japan."], ["Japonaiserie", "Japanese or imitation-Japanese objects used as fashion and decoration; the surface layer."], ["Estampe / ukiyo-e", "Japanese multi-colour woodblock prints (Hokusai, Hiroshige, Utamaro, Kiyonaga, Eisen)."], ["Hokusai Manga", "Hokusai's sketchbooks; “manga” here means spontaneous drawings, sketches."], ["Kakemono", "A hanging scroll."], ["Katagami", "A fabric-printing stencil made of mulberry-bark paper."], ["Mon", "A Japanese family crest, equivalent to a European coat of arms."], ["Tsuba", "The hand guard of a Japanese sword."], ["Inro", "A small box worn at the sash, because kimonos have no pockets."], ["Surimono", "Privately printed prints made as gifts, exchanged at New Year."], ["Shoji", "Sliding screens of black wooden lattice covered with rice paper."], ["A paradigm in crisis", "When an old model of thought (the Academy, Cartesian reason) loses its persuasive power, opening the way for a new model."], ["Nishiki-e", "‘Brocade pictures’: multi-colour woodblock prints, popular from 1765 with Suzuki Harunobu."], ["Bijin-ga", "Pictures of beautiful women and courtesans: the main subject of Utamaro, Kiyonaga and Eisen."], ["Meisho-e", "Pictures of famous places: Hokusai's Fuji series, Hiroshige's One Hundred Famous Views of Edo."], ["Hashira-e", "Pillar prints: a very narrow vertical format, hung on the posts of a house."], ["Sakoku", "The closed-country policy of the Tokugawa shogunate (1630s–1854); only the Dutch and Chinese could trade, through Nagasaki."], ["Dejima", "An artificial island off Nagasaki harbour, the Dutch trading post from 1641 to 1859."], ["Cloisonnism", "Bernard and Anquetin's style of flat colour areas with heavy outlines (1887–88), named after cloisonné enamel."], ["Nabis", "A group of young painters (Sérusier, Bonnard, Vuillard, Denis) from 1888 onwards, championing the flat surface and decoration."], ["Art Nouveau", "The decorative style of 1890–1910 with plant-like curves; named after Bing's shop."], ["Vienna Secession", "The Secession, a group of artists who broke away from the academic association in 1897, with Klimt as president."], ["Katazome", "A fabric-dyeing technique using katagami stencils and rice paste as a resist."], ["Paradigm", "The set of rules and model examples that a community takes for granted (after Thomas Kuhn)."], ["Shunga", "Japanese erotic prints; bought by Paris collectors such as Goncourt."], ["Netsuke", "Small ivory or wooden figures used as toggles to hang pouches from a kimono sash; a popular collectible."], ["The Batignolles group", "The name of the circle of Manet, Monet, Renoir and Degas before they became the ‘Impressionists’ (1874)."], ["Nabi", "Hebrew for ‘prophet’; the name of the group of Bonnard, Vallotton and Denis."]]}, {"type": "table", "title": "People who often appear", "columns": ["Name", "Role in the story"], "widths": [26, 74], "rows": [["Samuel (Siegfried) Bing", "German-born dealer in Paris; his shop L'Art japonais (1874) later became Art Nouveau; publisher of Le Japon artistique."], ["Louis Gonse", "Author of L'Art japonais (1883); organised exhibitions with Bing."], ["Philippe Burty", "Coined the word “japonisme” around 1872."], ["Félix Bracquemond", "The first to work directly from Hokusai Manga, for the Rousseau dinner service."], ["Whistler, Monet, Manet, Tissot, Stevens", "The first generation, mostly at the level of fashion; later some (Monet, Whistler) went on to structure."], ["Van Gogh, Degas, Toulouse-Lautrec", "Three cases of deep assimilation, analysed in video 2."], ["Klimt, Horta, Mackintosh", "Art Nouveau and the Vienna Secession, learning from Japanese textiles and architecture."], ["Gallé, Daum, Lalique, Tiffany", "Art Nouveau glass and jewellery using Japanese motifs."], ["Théodore Duret", "Critic and champion of the Impressionists; travelled to Japan with Cernuschi (1871–73)."], ["Henri Cernuschi", "Banker and collector; his mansion became the Musée Cernuschi."], ["Émile Guimet", "Lyon industrialist who went to Japan in 1876 and founded the Musée Guimet."], ["Félix Régamey", "Painter who went to Japan with Guimet and recorded his disillusion with a Westernising Japan."], ["Henri Rivière", "Woodblock artist, shadow theatre at the Chat Noir; ‘Thirty-six Views of the Eiffel Tower’."], ["Pierre Bonnard", "Nabi painter, nicknamed ‘le Japonard’."], ["Félix Vallotton", "Swiss Nabi painter, black-and-white woodcuts, ‘The Waltz’."]]}]}, "sources": {"page": "sources", "title": "Sources", "group": "Reference", "lead": "All sources, page by page. The two videos are the main sources; Wichmann's book is the reference cited in the videos.", "sources": [{"name": "Siegfried Wichmann, Japonisme: The Japanese Influence on Western Art since 1858, Thames and Hudson, 1999 (as described in the videos, not checked directly)", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "1999"}, {"name": "The “Le Japonisme” playlist, Art d'Histoire channel", "url": "https://www.youtube.com/playlist?list=PLI9v7o9esYUjf1sxRMSWQMa-dhganiYtn", "date": "updated 21/04/2020"}], "blocks": [{"type": "allsources", "title": "Sources by page"}]}, "compare": {"page": "compare", "title": "Paintings compared: Japan and Europe", "group": "Reading the paintings", "lead": "9 pairs of paintings side by side, the Japanese work on the left and the European one on the right. Each pair points to a specific technique that changed how Europeans built space, framed the picture and placed the viewer.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2 Histoire d'un plagiat ?”", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 2/2, van Gogh, Degas et Lautrec”", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Images of works: Wikimedia Commons (public domain / CC0); a link for each image is in the caption when enlarged", "url": "https://commons.wikimedia.org/", "date": "accessed 10/2026"}, {"name": "Additional art-history background beyond the two lectures, written by the compiler", "date": ""}], "blocks": [{"type": "callout", "tone": "info", "title": "How to view this page", "items": ["Click an image to enlarge it. The enlarged caption links to the original page on Wikimedia Commons.", "Pairs 1, 2 and 3 are paintings Van Gogh copied directly from Japanese prints, mentioned in video 2. Pairs 4 and 6 are based on what the lecturer says about Whistler and Degas.", "Pairs 5, 7, 8 and 9 were chosen by the compiler to illustrate the lectures' argument; they are not evidence that the painter saw that particular print."]}, {"type": "story", "title": "In depth: how to compare a pair of paintings yourself", "items": [{"title": "Six questions to ask when placing two pictures side by side", "bullets": ["Frame: where is the picture cropped, is any foreground cut off?", "Viewpoint: where does the viewer stand, high or low, far or close?", "Space: is there a perspective vanishing point, or flat stacked layers?", "Colour: flat areas or shading, are there outlines?", "Empty space: which part is left empty, and what role does it play?", "Changes: what did the European painter keep, drop or add compared with the Japanese model?"], "src": [3]}, {"title": "Copying, borrowing, assimilating", "paras": ["The pairs on this page sit on a three-step scale. Copying: Van Gogh copies Hiroshige and Eisen almost image for image. Borrowing: Whistler and Monet take a composition (a bridge, a framed view) and paint a European scene. Assimilating: Degas and Lautrec keep no trace of Japanese imagery, only the cropping and the line.", "The third step is where what the lecturer calls ‘plagiarism’ is hardest to spot, and also where the influence is deepest."], "src": [3]}]}, {"type": "diagram", "kicker": "Close-up, cut-off foreground", "title": "1. Hiroshige and Van Gogh: the Kameido plum garden", "img": "p01", "note": "Hiroshige places a huge plum trunk right in front of the eye, its top and base cut off by the edges of the picture; the garden and the strollers are tiny behind it. Depth comes not from receding perspective but from two layers, “very near” and “very far”. Van Gogh copied it with tracing paper and a grid, but pushed up the colour: a deeper red sky set against green and yellow. He added a border of Chinese characters copied from other prints without understanding them; according to the lecturer, some of them advertise a brothel."}, {"type": "diagram", "kicker": "Diagonals, rain as ruled lines", "title": "2. Hiroshige and Van Gogh: the bridge in the rain", "img": "p02", "note": "The bridge thrusts diagonally across the frame from the lower corner, neither end visible; the far bank is just a blurred strip, with no horizon. The rain is drawn as parallel straight lines covering the whole scene, something academic painting never did. Van Gogh keeps the diagonal, turns the rain into strokes of paint, makes the bridge yellow and the water deep green, and again surrounds it with a home-made frame of Japanese characters."}, {"type": "diagram", "kicker": "Black outlines, flat pattern", "title": "3. Eisen via the cover of Paris Illustré, and Van Gogh: the courtesan", "img": "p03", "note": "The cover of the special “Le Japon” issue (May 1886) printed a reversed image of a courtesan by Keisai Eisen; according to the lecturer, this issue is also where Van Gogh read Hayashi's article saying Japan's climate was like Italy's, which is why he went to Arles. Van Gogh enlarged the figure, kept the thick black outlines and the kimono spread flat like a patterned surface, without modelling. He set her in a yellow frame, surrounded by a pond, bamboo, frogs and cranes assembled from other prints."}, {"type": "diagram", "kicker": "A bridge in close-up, almost monochrome", "title": "4. Hiroshige and Whistler: the bridge at night", "img": "p04", "note": "Hiroshige lets a pillar of the Kyōbashi bridge block the frame, with a full moon and a boatman standing with his pole. Whistler enlarges a pillar of Battersea Bridge until it is cut off by the top edge, reduced to almost two colours, blue and gold, like lacquerware. The lecturer even points to the pose of the boatman standing in his boat: very Japanese, and unlikely to be the habit of an English ferryman. London is now seen through “Japanese eyes”."}, {"type": "diagram", "kicker": "A frame within a frame, no more sky", "title": "5. Hiroshige and Monet: looking through, looking close", "img": "p05", "note": "Hiroshige makes the viewer look through a ring of coiled pine branches: a frame within the frame, the distant view hemmed in. Monet actually built a “Japanese bridge” in his garden at Giverny and painted it so close that both ends are cut off, with no sky or horizon left; the surface of the water-lily pond stands upright like a flat plane. The lecturer recalls that Monet covered the walls of his dining room with Japanese prints and painted in series, like the series of views of Edo and Fuji."}, {"type": "diagram", "kicker": "Seen from above, the floor tilting up", "title": "6. Kiyonaga and Degas: women bathing", "img": "p06", "note": "Kiyonaga's bathhouse print is one of those Degas hung in his bedroom. An everyday scene, bodies at work rather than posing, a wooden floor receding along a diagonal and seen from above. In Le Tub, Degas looks straight down into the tub; the shelf on the right stands upright like a flat wall while the objects on it are seen from above. Each thing has its own viewpoint, and woman is “pulled off her pedestal”, as Huysmans remarked."}, {"type": "diagram", "kicker": "Shorthand for movement, empty space", "title": "7. Hokusai Manga and Degas: catching movement midway", "img": "p07", "note": "Hokusai Manga consists of quick sketches catching bodies in the middle of climbing, falling or wrestling: the lecturer calls it a “shorthand” for movement. Degas pushes two dancers into the upper corner, legs raised along the barre at the exact moment of the stretch. Almost half the picture is an empty wooden floor running diagonally: empty space used as an element, set against the crowded corner."}, {"type": "diagram", "kicker": "Flowers in close-up, overflowing the frame", "title": "8. Hiroshige and Van Gogh: irises", "img": "p08", "note": "The iris is a classic Japanese motif; according to the lecturer, European artists relearned how to draw it from Japanese drawing manuals. Hiroshige lets the iris stems rise beyond the frame, cut off at the top, with the field behind shrunk down. Van Gogh drops sky and horizon altogether: flowers and leaves overflow every edge of the canvas, each bloom clearly outlined, the blue areas laid flat, a single white iris as an accent."}, {"type": "diagram", "kicker": "Repeated strokes, swirling rhythm", "title": "9. Hokusai and Van Gogh: from waves to sky", "img": "p09", "note": "Hokusai's wave is built from repeated curves and claw-like foam, with a tiny Mount Fuji in the background. The lecturer argues that the stick-like strokes and wave rhythm in Van Gogh's paintings and drawings, right up to the sky of The Starry Night, were learned directly from Hokusai's drawing manuals and then made his own. The cypress cut off by the top edge is also a Japanese-style cropped foreground."}, {"type": "table", "title": "Summary of the 9 pairs", "columns": ["Pair", "Japanese technique", "What Europe did with it"], "widths": [30, 30, 40], "rows": [["1. Kameido → Van Gogh", "A trunk right in front of the eye, a tiny background", "Copied, pushed complementary colours, added a frame of characters"], ["2. Ōhashi → Van Gogh", "A diagonal bridge, rain as ruled lines", "Turned the ruled lines into brushstrokes"], ["3. Eisen → Van Gogh", "Outlines, flat pattern", "Enlarged, framed, assembled motifs"], ["4. Kyōbashi → Whistler", "A bridge pillar blocking the frame, a man standing in a boat", "A near-monochrome close-up, London in the Japanese manner"], ["5. Ueno → Monet", "A frame within a frame", "A bridge cut off at both ends, the sky dropped"], ["6. Kiyonaga → Degas", "An everyday bath scene, seen from above", "Several viewpoints in one picture"], ["7. Manga → Degas", "Shorthand for movement", "Catching the moment, diagonal empty space"], ["8. Horikiri → Van Gogh", "Flowers in close-up, cut off at the edge", "Overflowing t
