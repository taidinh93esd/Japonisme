<style>
/* v2: same index rail + one reading column, but rebuilt for comfortable reading:
   larger type, whitespace instead of boxes, fixed-ratio photo frames, diagrams in the flywheel language. */
:root{
  --bg:#F2F2EE; --surface:#FFFFFF; --ink:#141619; --text:#24272C; --muted:#5C626A; --faint:#80868E;
  --line:#D8DAD3; --hair:#E4E5DF; --soft:#F7F7F4; --th:#ECEFF6;
  --accent:#2340C4; --accent-ink:#FFFFFF; --accent-soft:#E3E8FA; --accent-line:#B4C1F0;
  --good:#1C7549; --good-soft:#E2F1E7; --warn:#8F5600; --warn-soft:#F9EFD9; --risk:#AE2A20; --risk-soft:#F9E4E0; --info-soft:#E8ECF6;
  --z-art:#DCE3FB; --z-sale:#F4F4F0; --z-service:#DBEFE1; --z-back:#E2E3DF;
  --display:"Newsreader","Iowan Old Style","Times New Roman",serif;
  --body:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --rhythm:68px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1012; --surface:#17191C; --ink:#EEEFF1; --text:#D8DBE0; --muted:#9CA3AD; --faint:#7C838D;
  --line:#2D3137; --hair:#25282D; --soft:#1C1F23; --th:#1D2230;
  --accent:#8FA3FF; --accent-ink:#0F1012; --accent-soft:#1E2649; --accent-line:#3B4885;
  --good:#5CC38C; --good-soft:#13261A; --warn:#E2A64C; --warn-soft:#2A2111; --risk:#F08B80; --risk-soft:#2D1614; --info-soft:#1A1F2B;
  --z-art:#202A55; --z-sale:#1E2125; --z-service:#15291C; --z-back:#282B30; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1012; --surface:#17191C; --ink:#EEEFF1; --text:#D8DBE0; --muted:#9CA3AD; --faint:#7C838D;
  --line:#2D3137; --hair:#25282D; --soft:#1C1F23; --th:#1D2230;
  --accent:#8FA3FF; --accent-ink:#0F1012; --accent-soft:#1E2649; --accent-line:#3B4885;
  --good:#5CC38C; --good-soft:#13261A; --warn:#E2A64C; --warn-soft:#2A2111; --risk:#F08B80; --risk-soft:#2D1614; --info-soft:#1A1F2B;
  --z-art:#202A55; --z-sale:#1E2125; --z-service:#15291C; --z-back:#282B30; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
p{margin:0}
h1,h2,h3{color:var(--ink)}
.muted{color:var(--muted)}

/* ---------- app frame */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:26px 22px 40px}
.brand{display:grid;gap:4px;margin-bottom:20px}
.brand .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand .name{font-family:var(--display);font-size:26px;line-height:1.12;font-weight:500;color:var(--ink)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink);font:inherit;font-size:14.5px}
.navg{margin-top:22px}
.navg h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.navg a{display:block;padding:6px 10px;margin-inline:-10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.45}
.navg a:hover{background:var(--soft)}
.navg a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sidefoot{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.55}
.topbar{display:none;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
.topbar .t{font-family:var(--display);font-size:19px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:9px}
.burger{width:14px;height:10px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;position:relative}
.burger::after{content:"";position:absolute;left:0;right:0;top:2px;border-top:2px solid currentColor}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(10,11,13,.4)}
main{min-width:0;padding:52px clamp(20px,4.2vw,64px) 120px}
.wrap{max-width:1060px;margin-inline:auto;container-type:inline-size;container-name:wrap;min-width:0}

/* ---------- page head */
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,3.7vw,50px);line-height:1.06;letter-spacing:-.012em;margin:10px 0 16px;text-wrap:balance;max-width:20em}
.lead{font-size:19px;line-height:1.62;color:var(--ink);max-width:62ch}
.toc{margin-top:30px;display:grid;gap:10px}
.toc-h{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.toc-c{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tchip{flex:none;display:inline-block;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.tchip:hover{border-color:var(--accent);color:var(--accent)}
@container wrap (min-width:600px){ .toc-c{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none} }

/* ---------- section rhythm */
.block{margin-top:var(--rhythm);scroll-margin-top:28px;min-width:0}
.block.hd{border-top:1px solid var(--line);padding-top:28px}
.kick{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 10px}
h2{font-family:var(--display);font-weight:500;font-size:27px;line-height:1.16;letter-spacing:-.006em;margin:0 0 22px;text-wrap:balance;max-width:30em}
@container wrap (min-width:600px){ h2{font-size:32px;margin-bottom:26px} }
h3{font-size:17px;line-height:1.4;margin:0;font-weight:600}
.lab{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px;line-height:1.5}
.note{font-size:14px;color:var(--muted);margin-top:16px;max-width:80ch;line-height:1.6}
.nd{font-weight:600;color:var(--accent)}
.src1{font-size:.86em;color:var(--warn);white-space:nowrap}
.prose{display:grid;gap:16px;max-width:68ch}
ul.bl{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.bl li{position:relative;padding-left:20px}
ul.bl li::before{content:"";position:absolute;left:3px;top:calc(.85em - 3px);width:6px;height:6px;border-radius:50%;background:var(--accent)}
ul.bl.sm li{font-size:14.5px;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;line-height:1.6;border-radius:99px;padding:1px 9px;color:var(--muted);background:var(--soft);border:1px solid var(--hair)}

/* ---------- source references: at most 3 shown, rest behind +N */
sup.s{font-size:.62em;line-height:0;vertical-align:super;margin-left:.3em;font-weight:600;letter-spacing:0;font-style:normal;white-space:nowrap}
sup.s .rest{white-space:normal}
sup.s a,sup.s .n,sup.s .more{color:var(--muted);text-decoration:none;background:var(--soft);border:1px solid var(--hair);border-radius:4px;padding:.05em .38em;font-variant-numeric:tabular-nums}
sup.s a:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
sup.s .more{font:inherit;line-height:1.25;cursor:pointer;margin:0;vertical-align:baseline}
sup.s .more:hover{color:var(--accent);border-color:var(--accent-line)}

/* ---------- photos: fixed-ratio frames, cover crop, lightbox on click */
.fig{margin:0;min-width:0}
.frame{display:block;position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:10px;background:var(--soft);padding:0;border:0;cursor:zoom-in;appearance:none}
.frame.r32{aspect-ratio:3/2} .frame.r169{aspect-ratio:16/9} .frame.r21{aspect-ratio:21/9}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.frame:hover img{transform:scale(1.025)}
.fig figcaption{font-size:13px;line-height:1.5;color:var(--muted);margin-top:9px}
.fig .cr{color:var(--faint)}
.fig .cr a{color:inherit}

/* gallery: uniform 12-col grid, rows balanced so there are no holes */
.gal{display:grid;grid-template-columns:minmax(0,1fr);gap:24px 18px}
.gal.one{max-width:760px}
@container wrap (min-width:600px){
  .gal{grid-template-columns:repeat(12,minmax(0,1fr))}
  .gal>.fig{grid-column:span var(--st,6)}
  .gal.one{grid-template-columns:minmax(0,1fr)}
  .gal.one>.fig{grid-column:auto}
}
@container wrap (min-width:900px){
  .gal>.fig{grid-column:span var(--sd,4)}
  .gal>.fig.gbig{grid-row:span 2;display:flex;flex-direction:column}
  .gal>.fig.gbig .frame{flex:1 1 auto;aspect-ratio:auto;min-height:280px}
}

/* ---------- summary rows */
.sum{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:52px}
.sum li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:18px 0 20px;border-top:1px solid var(--hair)}
.sum li:first-child{border-top:0;padding-top:2px}
.sn{font-family:var(--display);font-size:25px;line-height:1.05;color:var(--accent);font-variant-numeric:lining-nums tabular-nums}
.st{font-size:17.5px;line-height:1.42;margin-bottom:5px}
@container wrap (min-width:880px){
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sum li{grid-template-columns:46px minmax(0,1fr)}
  .sum li:nth-child(2){border-top:0;padding-top:2px}
  .sn{font-size:27px}
}

/* ---------- media and story: image beside its claim */
.media{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.mtx{display:grid;gap:14px;align-content:start;max-width:68ch;min-width:0}
.mtx h3{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.22}
.story{display:grid;gap:52px}
@container wrap (min-width:640px){
  .media{grid-template-columns:minmax(0,45fr) minmax(0,55fr);gap:36px}
  .media.imgr{grid-template-columns:minmax(0,55fr) minmax(0,45fr)}
  .media.imgr>.fig{order:2}
  .story{gap:60px}
}
dl.facts{margin:4px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:10px;overflow:hidden}
dl.facts>div{background:var(--surface);padding:10px 14px;min-width:0}
dl.facts>div:last-child:nth-child(odd){grid-column:1/-1}
dl.facts dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
dl.facts dd{margin:2px 0 0;font-weight:600;color:var(--ink);font-size:15.5px;line-height:1.45}

/* ---------- timeline and years: vertical rail */
.tl,.yrs{list-style:none;margin:0;padding:0}
.tl>li,.yr{display:grid;grid-template-columns:minmax(0,1fr);row-gap:6px;position:relative;padding:0 0 32px 30px}
.tl>li::before,.yr::before{content:"";position:absolute;left:5px;top:14px;bottom:-14px;width:2px;background:var(--line)}
.tl>li:last-child::before,.yr:last-child::before{display:none}
.tl>li::after,.yr::after{content:"";position:absolute;left:0;top:8px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent)}
.tw,.yw{font-family:var(--display);font-size:20px;line-height:1.25;color:var(--accent);font-variant-numeric:lining-nums}
.tc{display:grid;gap:6px;max-width:66ch;min-width:0}
.tc h3{font-size:17.5px}
.tc p{font-size:16px}
.tlth{width:160px;height:120px;aspect-ratio:auto;border-radius:8px}
@container wrap (min-width:600px){
  .tl>li,.yr{grid-template-columns:96px minmax(0,1fr);column-gap:34px;padding-left:0}
  .tl>li.has-th{grid-template-columns:96px minmax(0,1fr) 160px}
  .tl>li::before,.yr::before{left:112px}
  .tl>li::after,.yr::after{left:107px}
  .tw,.yw{text-align:right;font-size:22px}
}
.yb{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.yg,.yx{border-radius:12px;padding:13px 17px 15px}
.yg{background:var(--good-soft)} .yx{background:var(--risk-soft)}
.yg .lab{color:var(--good)} .yx .lab{color:var(--risk)}
.yg p,.yx p,.yg li,.yx li{font-size:15.5px;line-height:1.62;color:var(--ink)}
.yev{grid-column:1/-1;font-size:13.5px;color:var(--muted);line-height:1.6}
details.yev summary{cursor:pointer;font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:8px}
details.yev summary::-webkit-details-marker{display:none}
details.yev summary::before{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 1.8px 1.8px 0;transform:rotate(-45deg);transition:transform .15s}
details.yev[open] summary::before{transform:rotate(45deg)}
details.yev p{margin-top:6px}
@container wrap (min-width:600px){ .yb{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} }

/* ---------- phases: numbered stages on a cobalt rail */
.ph{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:14px;position:relative;padding-bottom:46px}
.ph::before{content:"";position:absolute;left:16px;top:40px;bottom:6px;width:2px;background:var(--accent-line)}
.ph:last-child::before{display:none}
.ph-n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:500 18px/1 var(--display)}
.ph-c{display:grid;gap:18px;min-width:0}
.ph-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;padding-top:2px}
.ph-h h3{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.2}
.chip{display:inline-block;font-size:12px;letter-spacing:.05em;font-weight:700;border-radius:6px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);line-height:1.5}
.ph-sum{max-width:70ch}
.ph-did ul.bl{display:block}
.ph-did ul.bl li{margin-bottom:8px;break-inside:avoid;font-size:15.5px;line-height:1.62}
.gb{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.gb ul.bl li::before{background:currentColor;opacity:.5}
.ph-num{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:13px 17px;font-size:15.5px;line-height:1.62}
.ph-next{background:var(--accent-soft);border-radius:12px;padding:13px 17px;font-size:15.5px;line-height:1.62;color:var(--ink)}
.ph-next .lab{color:var(--accent)}
@container wrap (min-width:640px){
  .ph{grid-template-columns:44px minmax(0,1fr);column-gap:22px}
  .ph::before{left:21px;top:52px}
  .ph-n{width:44px;height:44px;font-size:21px}
  .ph-h{padding-top:6px}
  .ph-h h3{font-size:26px}
  .gb{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container wrap (min-width:900px){ .ph-did ul.bl{columns:2;column-gap:40px} }

/* ---------- flow: numbered white boxes joined by cobalt arrows */
.flow{display:grid}
.frow{display:grid;grid-template-columns:minmax(0,1fr);align-items:stretch}
.fstep{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.fstep .frame{border-radius:0;margin-top:auto}
.fb{padding:16px 18px 18px;display:grid;gap:7px;align-content:start}
.fn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 14px/1 var(--body)}
.fstep h3{font-family:var(--display);font-weight:500;font-size:20px;line-height:1.25}
.fstep p{font-size:15px;line-height:1.62}
.farr,.fturn{display:flex;justify-content:center;align-items:center;min-height:38px}
.farr svg,.fturn svg{display:block;overflow:visible}
.ah-h{display:none!important}
.fturn i{display:none}
@container wrap (min-width:760px){
  .frow{grid-template-columns:var(--tpl)}
  .farr{min-height:0}
  .ah-h{display:block!important;width:44px;height:14px}
  .ah-v{display:none!important}
  .fturn{--half:calc((100% - (var(--cols) - 1) * 44px) / (2 * var(--cols)));position:relative;height:48px;min-height:0;display:block}
  .fturn::before{content:"";position:absolute;top:0;height:calc(50% + 1px);left:calc(var(--half) + 10px);right:calc(var(--half) - 1px);border:solid var(--accent);border-width:0 2.2px 2.2px 0;border-bottom-right-radius:12px}
  .fturn::after{content:"";position:absolute;top:calc(50% - 1.1px);bottom:8px;left:calc(var(--half) - 1.1px);width:12px;border:solid var(--accent);border-width:2.2px 0 0 2.2px;border-top-left-radius:12px}
  .fturn i{display:block;position:absolute;left:calc(var(--half) - 6px);bottom:0;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--accent)}
}

/* ---------- mindmap: cobalt core, white branches, cobalt connectors */
.mm{display:grid;gap:12px}
.mm-c{order:-1}
.mm-side{display:grid;gap:12px;min-width:0}
.mm-b{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px 14px;min-width:0}
.mm-b h3{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.25}
.mm-b ul{margin:6px 0 0;padding:0 0 0 18px;font-size:14.5px;line-height:1.55;display:grid;gap:3px}
.mm-b li::marker{color:var(--accent)}
.mm-core{position:relative;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px 18px;text-align:center;display:grid;gap:4px}
.mm-core b{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.2}
.mm-core span{font-size:14px;line-height:1.5;opacity:.92}
@container wrap (max-width:759px){
  .mm-side{padding-left:24px}
  .mm-b::before{content:"";position:absolute;left:-18px;top:-13px;bottom:-1px;width:2px;background:var(--accent)}
  .mm-b::after{content:"";position:absolute;left:-18px;top:50%;width:18px;height:2px;background:var(--accent)}
  .mm-r .mm-b:last-child::before,.mm.one .mm-l .mm-b:last-child::before{bottom:50%}
}
@container wrap (min-width:760px){
  .mm{grid-template-columns:minmax(0,1fr) 56px minmax(170px,230px) 56px minmax(0,1fr);gap:0;align-items:center}
  .mm-l{grid-column:1;grid-row:1} .mm-c{grid-column:3;grid-row:1} .mm-r{grid-column:5;grid-row:1}
  .mm-side{gap:16px}
  .mm-l .mm-b::after{content:"";position:absolute;top:calc(50% - 1px);left:100%;width:29px;height:2px;background:var(--accent)}
  .mm-r .mm-b::after{content:"";position:absolute;top:calc(50% - 1px);right:100%;width:29px;height:2px;background:var(--accent)}
  .mm-l .mm-b::before{content:"";position:absolute;left:calc(100% + 27px);width:2px;background:var(--accent);top:-9px;bottom:-9px}
  .mm-r .mm-b::before{content:"";position:absolute;right:calc(100% + 27px);width:2px;background:var(--accent);top:-9px;bottom:-9px}
  .mm-side .mm-b:first-child::before{top:calc(50% - 1px)}
  .mm-side .mm-b:last-child::before{bottom:calc(50% - 1px)}
  .mm-side .mm-b:only-child::before{display:none}
  .mm-core{padding:22px 18px}
  .mm-core::before{content:"";position:absolute;top:calc(50% - 1px);right:100%;width:28px;height:2px;background:var(--accent)}
  .mm-core::after{content:"";position:absolute;top:calc(50% - 1px);left:100%;width:28px;height:2px;background:var(--accent)}
  .mm.one .mm-core::after{display:none}
}

/* ---------- anatomy: illustrative floor plan */
.an-note{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:4px 12px;margin-bottom:16px;line-height:1.5}
.an-note::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.an-plan{position:relative;max-width:880px;margin:0 0 42px}
.an-plan svg{display:block;width:100%;height:auto;overflow:visible}
.an-out{fill:var(--surface);stroke:var(--muted);stroke-width:.4}
.az rect{stroke:var(--line);stroke-width:.22}
.az-art rect{fill:var(--z-art);stroke:var(--accent-line)} .az-sale rect{fill:var(--z-sale)} .az-service rect{fill:var(--z-service)} .az-back rect{fill:var(--z-back)}
.az-id{fill:var(--ink);font-family:var(--display);font-size:5px;font-weight:600}
.az-nm{display:none;fill:var(--text);font-family:var(--body);font-size:1.85px;font-weight:500}
.az-sh{display:none;fill:var(--muted);font-family:var(--body);font-size:1.7px;font-weight:700}
.ad{stroke:var(--accent);stroke-width:1.5;stroke-linecap:round}
.adh{fill:var(--accent)}
.an-door{position:absolute;top:calc(100% + 8px);transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap;line-height:1.4}
.an-keys{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin:0 0 14px}
.ak{display:inline-flex;align-items:center;gap:7px}
.ak i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
i.az-art,.al-id.az-art{background:var(--z-art)} i.az-sale,.al-id.az-sale{background:var(--z-sale)} i.az-service,.al-id.az-service{background:var(--z-service)} i.az-back,.al-id.az-back{background:var(--z-back)}
.an-leg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:0 36px}
.an-leg li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;padding:13px 0;border-top:1px solid var(--hair)}
.al-id{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;font:600 17px/1 var(--display);color:var(--ink);border:1px solid var(--line)}
.an-leg b{color:var(--ink)}
.al-sh{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);border:1px solid var(--hair);border-radius:99px;padding:0 8px;line-height:1.6}
.an-leg p{font-size:15px;line-height:1.62;margin-top:3px}
@container wrap (min-width:600px){
  .az-id{font-size:3.4px}
  .az-nm,.az-sh{display:inline}
  .an-leg{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---------- cards and principles: uniform equal-height grid */
.grid3{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@container wrap (min-width:600px){ .grid3{grid-template-columns:repeat(12,minmax(0,1fr))} .grid3>*{grid-column:span var(--st,6)} }
@container wrap (min-width:900px){ .grid3>*{grid-column:span var(--sd,4)} }
.card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .frame{border-radius:0}
.cb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.card h3{font-size:17px;line-height:1.38}
.card .meta{font-size:13px;color:var(--muted);line-height:1.5}
.card p{font-size:15px;line-height:1.62}
.cgb{border-top:1px solid var(--hair);padding-top:9px}
.cgb .lab{margin-bottom:3px}
.cgb.g .lab{color:var(--good)} .cgb.b .lab{color:var(--risk)}
.card .tags{margin-top:auto;padding-top:6px}
.pn{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 13px/1 var(--body);letter-spacing:.02em}
.rule{color:var(--ink)}
.card .why{font-size:14px;color:var(--muted);padding-top:2px}
.why b{color:var(--ink);font-weight:600}

/* ---------- compare: aligned rows */
.cmp{border-top:1px solid var(--line)}
.cmp-h{display:none}
.cmp-r{display:grid;grid-template-columns:minmax(0,1fr);border-bottom:1px solid var(--hair);padding:12px 0}
.cmp-r>div{font-size:15.5px;line-height:1.6;min-width:0}
.cmp-l{font-weight:700;color:var(--ink);margin-bottom:6px}
.cmp-a,.cmp-b{padding:8px 12px;border-radius:9px}
.cmp-b{background:var(--accent-soft);margin-top:6px}
.cmp-a::before,.cmp-b::before{content:attr(data-h);display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.cmp-b::before{color:var(--accent)}
@container wrap (min-width:640px){
  .cmp-h{display:grid;grid-template-columns:22% minmax(0,1fr) minmax(0,1fr);border-bottom:1.5px solid var(--ink)}
  .cmp-h>div{padding:12px 18px;font-family:var(--display);font-size:21px;line-height:1.25;color:var(--ink)}
  .cmp-h>div:last-child{color:var(--accent)}
  .cmp{border-top:0}
  .cmp-r{grid-template-columns:22% minmax(0,1fr) minmax(0,1fr);padding:0}
  .cmp-r>div{padding:14px 18px}
  .cmp-l{margin:0;padding-left:0!important}
  .cmp-a,.cmp-b{border-radius:0;margin:0}
  .cmp-b{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
  .cmp-a::before,.cmp-b::before{display:none}
}

/* ---------- do and don't */
.dd{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.dd-c{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px 20px 20px}
.dd-t{font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.dd-c.do .dd-t{color:var(--good)} .dd-c.dont .dd-t{color:var(--risk)}
.dd ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.dd li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;font-size:15.5px;line-height:1.6}
.ic{width:24px;height:24px;border-radius:50%;position:relative;margin-top:1px}
.ic.ok{background:var(--good-soft)}
.ic.ok::after{content:"";position:absolute;left:8.5px;top:5px;width:5.5px;height:10.5px;border:solid var(--good);border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
.ic.no{background:var(--risk-soft)}
.ic.no::before,.ic.no::after{content:"";position:absolute;left:11px;top:6px;width:2.4px;height:12px;background:var(--risk);border-radius:1px;transform:rotate(45deg)}
.ic.no::after{transform:rotate(-45deg)}
@container wrap (min-width:640px){ .dd{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px} }

/* ---------- tables: fixed layout, computed widths; cards on phone */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:15px;line-height:1.55}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:13px 16px;border-bottom:1px solid var(--hair);overflow-wrap:anywhere}
.tbl th{background:var(--th);font-size:13px;font-weight:700;color:var(--ink);line-height:1.4;letter-spacing:.01em}
.tbl tbody tr:nth-child(even) td{background:var(--soft)}
.tbl td:first-child{font-weight:600;color:var(--ink)}
.tbl table.dense th,.tbl table.dense td{padding:12px 12px;font-size:14.5px}
.tbl tr:last-child td{border-bottom:none}
@container wrap (max-width:639px){
  .tbl{border:0;background:transparent;overflow:visible;border-radius:0}
  .tbl table{min-width:0!important;table-layout:auto}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:auto}
  .tbl tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:10px}
  .tbl tbody tr:nth-child(even) td{background:transparent}
  .tbl td{border:0;padding:5px 0}
  .tbl td::before{content:attr(data-l);display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.5}
  .tbl td:first-child{font-size:16px;padding-top:0}
  .tbl td:first-child::before{display:none}
  .tbl td:empty{display:none}
}

/* ---------- stats */
.stats{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stat{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px 20px 20px;min-width:0}
.sv{font-family:var(--display);font-size:32px;line-height:1.08;color:var(--ink);letter-spacing:-.01em}
.sl{font-size:14.5px;color:var(--muted);margin-top:8px;line-height:1.55}
@container wrap (min-width:480px){ .stats{grid-template-columns:repeat(12,minmax(0,1fr))} .stat{grid-column:span var(--st,6)} }
@container wrap (min-width:900px){ .stat{grid-column:span var(--sd,4)} .sv{font-size:35px} }

/* ---------- quotes */
.qgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@container wrap (min-width:760px){ .qgrid.two{grid-template-columns:repeat(12,minmax(0,1fr))} .qgrid.two>*{grid-column:span var(--sq,6)} }
.q{margin:0;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:16px 22px 18px;display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.q::before{content:"\201C";font-family:var(--display);font-size:52px;line-height:1;height:24px;color:var(--accent);display:block}
.q blockquote{margin:0}
.qp{font-family:var(--display);font-size:19.5px;line-height:1.48;color:var(--ink)}
.qo{margin-top:10px;font-size:14px;line-height:1.6;color:var(--muted);font-style:italic}
.qby{margin-top:auto;padding-top:14px;font-size:13px;color:var(--muted);line-height:1.5}
.sent{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:8px;line-height:1.6}
.sent.positive{background:var(--good-soft);color:var(--good)} .sent.negative{background:var(--risk-soft);color:var(--risk)} .sent.mixed{background:var(--warn-soft);color:var(--warn)}

/* ---------- callout: one tinted panel, never one box per paragraph */
.co{border-radius:16px;padding:22px 22px 14px;background:var(--info-soft)}
.co-good{background:var(--good-soft)} .co-warn{background:var(--warn-soft)} .co-risk{background:var(--risk-soft)}
.co-t{display:flex;align-items:center;gap:10px;font-size:18px;line-height:1.35;margin-bottom:14px;color:var(--accent)}
.co-good .co-t{color:var(--good)} .co-warn .co-t{color:var(--warn)} .co-risk .co-t{color:var(--risk)}
.co-i{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.co-l{list-style:none;margin:0;padding:0}
.co-l li{position:relative;padding-left:20px;margin-bottom:12px;break-inside:avoid;font-size:16px;line-height:1.65;color:var(--ink)}
.co-l li::before{content:"";position:absolute;left:2px;top:calc(.82em - 3px);width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.6}
.co-good li::before{background:var(--good)} .co-warn li::before{background:var(--warn)} .co-risk li::before{background:var(--risk)}
@container wrap (min-width:600px){ .co{padding:26px 30px 16px} }
@container wrap (min-width:900px){ .co-l.cols{columns:2;column-gap:48px} }

/* ---------- store profile */
.st-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.st-head h2{margin:0}
.code{font-size:12px;letter-spacing:.08em;font-weight:700;border-radius:6px;padding:3px 9px;background:var(--accent);color:var(--accent-ink);line-height:1.5}
.st-meta{color:var(--muted);font-size:15px;line-height:1.6;max-width:80ch;margin:10px 0 26px}
.st-prof{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
.st-gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;align-content:start}
.st-gal>.fig:first-child{grid-column:1/-1}
.st-gal.n2>.fig:first-child{grid-column:auto}
.st-gal .fig:not(:first-child) figcaption{font-size:12.5px}
.fl{list-style:none;margin:0;padding:0}
.fl li{padding:11px 0;border-top:1px solid var(--hair);font-size:15.5px;line-height:1.6}
.fl li:first-child{border-top:0;padding-top:0}
.st-secs{display:grid;gap:34px;margin-top:38px}
.nl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:14px 36px}
.nl li{padding-top:12px;border-top:1px solid var(--hair);min-width:0}
.nl b{display:block;color:var(--ink);font-size:15.5px;line-height:1.45;margin-bottom:3px}
.nl b.when{color:var(--accent);font-size:13.5px;letter-spacing:.02em}
.nl p{font-size:15px;line-height:1.62}
.ckl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:36px}
.ckl li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--hair);font-size:15px;line-height:1.58;min-width:0}
.cid{font:700 11.5px/1.9 var(--body);letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 7px;height:fit-content;white-space:nowrap}
.go-btn{display:inline-flex;align-items:center;gap:12px;margin-top:16px;padding:10px 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:14.5px;line-height:1.4}
.go-btn:hover{filter:brightness(1.08)}
.chev{width:7px;height:7px;border:solid currentColor;border-width:2px 2px 0 0;transform:rotate(45deg);flex:none}
@container wrap (min-width:760px){ .nl{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container wrap (min-width:820px){ .st-prof{grid-template-columns:minmax(0,57fr) minmax(0,43fr);gap:36px} }
@container wrap (min-width:900px){ .ckl.two{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- theme */
.th-meta{margin:-12px 0 16px}
.freq{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);line-height:1.6}
.verdict{font-size:17.5px;line-height:1.65;color:var(--ink);max-width:68ch;margin-bottom:22px}
.t-theme .gal{margin-top:22px}

/* ---------- flywheel (unchanged from v1) */
.fly-svg{display:none;max-width:900px}
.fly-list{display:block}
.fly-svg svg{width:100%;height:auto}
.fw-node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.fw-core{fill:var(--accent)}
.fw-t{fill:var(--ink);font-family:var(--body);font-size:14px}
.fw-tb{fill:var(--ink);font-family:var(--display);font-size:19px}
.fw-c{fill:var(--accent-ink);font-family:var(--body);font-size:13.5px}
.fw-cb{fill:var(--accent-ink);font-family:var(--display);font-size:19px}
.fw-a{stroke:var(--accent);stroke-width:2.2;fill:none}
.fw-ah{fill:var(--accent)}
.fw-cap{fill:var(--muted);font-family:var(--body);font-size:12.5px;font-style:italic}
.fly-list ol{margin:0;padding-left:20px;display:grid;gap:10px}
@container wrap (min-width:640px){ .fly-svg{display:block} .fly-list{display:none} }

/* ---------- elements of the formula */
.el{padding:34px 0 40px;border-top:1px solid var(--hair);scroll-margin-top:28px}
.el:first-child{border-top:0;padding-top:4px}
.elh{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.eln{font-family:var(--display);font-size:44px;line-height:.92;color:var(--accent);min-width:30px}
.elh h3{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.2}
.layer{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:3px}
.elg{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.eli{display:grid;gap:10px;align-content:start}
.eli .thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.eli .thumbs .frame{border-radius:7px}
.elt{display:grid;gap:12px;align-content:start;max-width:68ch}
.claim{font-size:17.5px;color:var(--ink);line-height:1.62}
.elt ul.bl li{font-size:15.5px;line-height:1.62}
.elb{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:22px}
.box{border-radius:12px;padding:13px 17px 15px;font-size:15px;line-height:1.6;color:var(--ink)}
.box.v{background:var(--info-soft)} .box.h{background:var(--warn-soft)}
.box.v .lab{color:var(--accent)} .box.h .lab{color:var(--warn)}
@container wrap (min-width:600px){ .elb{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container wrap (min-width:720px){ .elg.has-img{grid-template-columns:minmax(0,44fr) minmax(0,56fr);gap:34px} .elh h3{font-size:27px} .eln{font-size:52px} }

/* ---------- verify checklist */
.vsum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.vsum span{font-size:13.5px;border-radius:99px;padding:4px 12px;background:var(--surface);border:1px solid var(--line)}
.vavail{font-size:13.5px;color:var(--muted);margin-bottom:16px;max-width:70ch}
.vchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.vchips a{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.04em}
.vchips a span{font-weight:500;color:var(--muted);letter-spacing:0}
.vg{margin-top:36px;scroll-margin-top:28px}
.vg h3{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--display);font-weight:500;font-size:23px;line-height:1.25;margin-bottom:4px}
.vg h3 .chip{font-family:var(--body)}
.vitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;display:grid;gap:10px;scroll-margin-top:28px}
.vitem.ok{background:var(--good-soft);border-color:transparent} .vitem.no{background:var(--risk-soft);border-color:transparent} .vitem.unclear{background:var(--warn-soft);border-color:transparent}
.vt{font-size:15.5px;line-height:1.6;color:var(--ink)}
.vid{font-size:11.5px;font-weight:700;color:var(--accent);margin-right:8px;letter-spacing:.04em}
.vbtns{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- cover: collage (Francis Bacon ref) ---------- */
.jhero{container-type:inline-size;position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));height:clamp(560px,52vw,760px);margin:-54px calc(-1 * clamp(20px,4.2vw,64px)) 0;background:#050505;color:var(--ink);overflow:hidden}

.jh-a{grid-column:1/6;grid-row:1/6}

.jidx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);align-items:start;margin:0 calc(-1 * clamp(20px,4.2vw,64px)) 80px;padding:clamp(40px,5vw,72px) clamp(20px,4.2vw,64px) 0;background:#050505}

, "page": "https://www.youtube.com/watch?v=PubHMeST-tg&t=427s"}, "d02": {"file": "d-04.png", "w": 1920, "h": 2980, "cap": "Two models of seeing: each criterion as an illustrative diagram next to a real work", "credit": "Diagrams: the compiler. Images of works: Wikimedia Commons, public domain"}, "manet-boating": {"file": "manet-boating.jpg", "w": 1200, "h": 906, "cap": "Manet, En bateau, 1874", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Edouard_Manet_Boating.jpg"}, "monet-impression": {"file": "monet-impression.jpg", "w": 1200, "h": 931, "cap": "Monet, Impression, Sunrise, 1872", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Monet_-_Impression,_Sunrise.jpg"}, "monet-stacks": {"file": "monet-stacks.jpg", "w": 1200, "h": 712, "cap": "Monet, Haystacks (End of Summer), 1890–91", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Stacks_of_Wheat_(End_of_Summer)_-_1985.1103_-_Art_Institute_of_Chicago"}, "monet-bridge": {"file": "monet-bridge.jpg", "w": 1195, "h": 1500, "cap": "Monet, Bridge over a Pond of Water Lilies, 1899", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Bridge_over_a_Pond_of_Water_Lilies_MET_DT1854.jpg"}, "gauguin-vision": {"file": "gauguin-vision.jpg", "w": 1200, "h": 958, "cap": "Gauguin, Vision after the Sermon, 1888", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:La_vision_après_le_sermon_(Paul_Gauguin).jpg"}, "bonnard-femmes": {"file": "bonnard-femmes.jpg", "w": 1200, "h": 968, "cap": "Bonnard, Women in the Garden, four decorative panels, 1890–91", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Pierre_Bonnard_-_Panneaux_décoratifs_-_Femmes_au_jardin_-_1982-0024.a-d_-_Kunsthaus_Z"}, "vallotton-valse": {"file": "vallotton-valse.jpg", "w": 1200, "h": 1469, "cap": "Vallotton, The Waltz, 1893", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Félix_Vallotton,_1893_-_La_Valse.jpg"}, "fantin-batignolles": {"file": "fantin-batignolles.jpg", "w": 1200, "h": 889, "cap": "Fantin-Latour, A Studio at Les Batignolles, 1870", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Henri_Fantin-Latour_-_A_Studio_at_Les_Batignolles_-_Google_Art_Project.jpg"}, "whistler-balcony": {"file": "whistler-balcony.jpg", "w": 1194, "h": 1500, "cap": "Whistler, Variations in Flesh Colour and Green: The Balcony, 1864–70", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:James_McNeill_Whistler_-_Variations_in_Flesh_Colour_and_Green—The_Balcony_-_Google_Ar"}, "riviere-eiffel": {"file": "riviere-eiffel.jpg", "w": 1200, "h": 966, "cap": "Henri Rivière, cover of Thirty-six Views of the Eiffel Tower, 1902", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Trente-six_vues_de_la_tour_Eiffel_-_couverture.jpg"}, "debussy-mer": {"file": "debussy-mer.jpg", "w": 991, "h": 1500, "cap": "Cover of the score of Debussy's La Mer, 1905, after Hokusai's Great Wave", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Claude_Debussy_La_mer_couverture.PNG"}, "monet-nympheas": {"file": "monet-nympheas.jpg", "w": 1200, "h": 1153, "cap": "Monet, Water Lilies, 1906", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Water_Lilies_-_1906,_Ryerson.jpg"}, "vg-tambourin": {"file": "vg-tambourin.jpg", "w": 1200, "h": 1446, "cap": "Van Gogh, Agostina Segatori in the Café du Tambourin, 1887", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:In_het_café_Agostina_Segatori_in_Le_Tambourin_-_s0017V1962_-_Van_Gogh_Museum.jpg"}, "lautrec-divan": {"file": "lautrec-divan.jpg", "w": 1138, "h": 1500, "cap": "Toulouse-Lautrec, Divan Japonais poster, 1893", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:1893_color_lithograph_by_de_Toulouse-Lautrec_-_Divan_Japonais.jpg"}, "nietzsche": {"file": "nietzsche.jpg", "w": 1124, "h": 1500, "cap": "Friedrich Nietzsche, photographed in 1882", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Nietzsche1882.jpg"}, "schopenhauer": {"file": "schopenhauer.jpg", "w": 1173, "h": 1500, "cap": "Arthur Schopenhauer, photograph by J. Schäfer, 1859", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Arthur_Schopenhauer_by_J_Schäfer,_1859b.jpg"}, "caillebotte-rain": {"file": "caillebotte-rain.jpg", "w": 1200, "h": 932, "cap": "Caillebotte, Paris Street; Rainy Day, 1877: a Haussmann boulevard, passers-by kept apart", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Gustave_Caillebotte_-_Paris_Street,_Rainy_Day_-_1964.336_-_Art_Institute_of_Chicago.jpg"}, "marville-opera": {"file": "marville-opera.jpg", "w": 1200, "h": 868, "cap": "Charles Marville, the opening of the Avenue de l'Opéra, about 1876–77: old Paris demolished to build the new", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Percement_de_l'avenue_de_l'Opéra_Butte_des_Moulins_(de_la_rue_d'Argenteuil),_PH937.jpg"}, "beato-shamisen": {"file": "beato-shamisen.jpg", "w": 815, "h": 1000, "cap": "Felice Beato, a woman playing the shamisen, hand-coloured photograph, 1860s", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Felice_Beato_Shamisen.jpg"}, "redon-eye": {"file": "redon-eye.jpg", "w": 1148, "h": 1500, "cap": "Odilon Redon, The Eye Like a Strange Balloon Mounts Toward Infinity, 1882", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:To_Edgar_Poe_(The_Eye,_Like_a_Strange_Balloon,_Mounts_toward_Infinity)_(A_Edgar_Poe_(L'oei"}, "morris-strawberry": {"file": "morris-strawberry.jpg", "w": 1200, "h": 779, "cap": "William Morris, Strawberry Thief printed fabric, 1883", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Morris_Strawberry_Thief_1883.jpg"}, "expo1878-japon": {"file": "expo1878-japon.jpg", "w": 1200, "h": 807, "cap": "Paris World's Fair 1878: the façade of the Japanese section on the Street of Nations", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:La_rue_des_nations._Façade_de_la_section_japonaise.jpg"}, "japon-artistique": {"file": "japon-artistique.jpg", "w": 1200, "h": 795, "cap": "Cover of an issue of S. Bing's Le Japon artistique, 1888", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Le_Japon_Artistique_S._Bing.jpg"}, "durer-lute": {"file": "durer-lute.jpg", "w": 998, "h": 710, "cap": "Dürer, Man Drawing a Lute, 1525: string and gridded frame used to construct perspective", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Dürer_-_Man_Drawing_a_Lute.jpg"}, "daguerre-temple": {"file": "daguerre-temple.jpg", "w": 1200, "h": 862, "cap": "Daguerre, Boulevard du Temple, 1838: one of the first photographs to show people", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Boulevard_du_Temple_by_Daguerre.jpg"}, "manet-dejeuner": {"file": "manet-dejeuner.jpg", "w": 1200, "h": 946, "cap": "Manet, Le Déjeuner sur l'herbe, 1863: rejected by the Salon, shown at the Salon des Refusés", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Édouard_Manet_-_Le_Déjeuner_sur_l'herbe.jpg"}, "cabanel-venus": {"file": "cabanel-venus.jpg", "w": 1200, "h": 695, "cap": "Cabanel, The Birth of Venus, 1863: praised at the Salon, bought by Napoleon III", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Cabanel,_La_naissance_de_Vénus,_1863_(5613956032).jpg"}, "chevreul-cercle": {"file": "chevreul-cercle.jpg", "w": 1200, "h": 1496, "cap": "Chevreul's colour circle, 19th century", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Cercle_chromatique_Chevreul_1.jpg"}, "palais-industrie": {"file": "palais-industrie.jpg", "w": 1200, "h": 934, "cap": "The Palais de l'Industrie, home of the official Salon and the 1863 Salon des Refusés (photograph by Édouard Baldus)", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:Palais_de_l'Industrie_-_Édouard_Baldus.jpg"}}, "pages": {"overview": {"page": "overview", "title": "Overview", "group": "Start", "lead": "Japonisme is not the study of Japan. It is the influence of Japanese art and craft on European art, so deep that Manet, Monet, Impressionism, Symbolism, Art Nouveau and the Vienna Secession would hardly look as we know them without it.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2 Histoire d'un plagiat ?” (YouTube, 52 min)", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "06/02/2018"}, {"name": "Art d'Histoire, “Japonisme 2/2, van Gogh, Degas et Lautrec” (YouTube, 50 min)", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "13/02/2018"}, {"name": "Additional art-history background beyond the two lectures, written by the compiler", "date": ""}, {"name": "Artistik TV, “Japonisme : comment l'art japonais a-t-il révolutionné la peinture occidentale ?” (from the film “Quand les impressionnistes découvrent le Japon”, directed by Jérôme Lambert and Philippe Picard, Andana Films)", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4", "date": "2018"}], "blocks": [{"type": "summary", "title": "5 main ideas from the two lectures", "items": [{"title": "“Plagiarism” is a deliberately strong word", "text": "The lecturer calls Japonisme “the history of a plagiarism” to make a point: much of what was new in the European avant-garde came from Japan, even if it was later absorbed into personal styles.", "src": [0]}, {"title": "What Japan threw away became Europe's modernity", "text": "After the opening of the country (1854) and the Meiji era (1868), the Japanese sold off prints, armour and kimonos as outdated things. In Paris, those same objects became “modern”.", "src": [0]}, {"title": "Two layers of influence", "text": "The surface layer is fashion: kimonos, fans, motifs. The deep layer is structure: close-up cropping, diagonal composition, empty space, flat areas of colour, a moving viewpoint. The lectures set out to find the “drop of Japanese blood” in that deep layer.", "src": [0, 1]}, {"title": "It could only happen once the old paradigm was in crisis", "text": "Japanese prints had reached the Netherlands in the 16th century and nobody noticed. Only when the academic model and Cartesian reason began to falter was Europe ready to learn.", "src": [0, 1]}, {"title": "Van Gogh, Degas and Lautrec learned three different things", "text": "Van Gogh learned the line of Japanese drawing manuals; Degas learned composition and viewpoint; Lautrec learned the brush line, the silhouette and caricature. Picasso in 1901 inherited it indirectly through them.", "src": [1]}]}, {"type": "diagram", "title": "How Japonisme worked, in one diagram", "img": "d01", "note": "Diagram redrawn by the compiler from the argument of the two lectures."}, {"type": "story", "title": "In depth: the four phases of Japonisme", "items": [{"title": "1856–1867: discovery", "paras": ["A familiar anecdote says that in 1856 Félix Bracquemond found a volume of Hokusai Manga used as packing paper in a crate of porcelain sent to Paris. Whether or not the detail is true, it sums up the situation: Japanese prints reached Europe as by-products, and only a small circle of artists and writers saw their value.", "The first circle included Bracquemond, Manet, Whistler, Fantin-Latour, the Goncourt brothers and Baudelaire. They bought from shops such as Desoye and passed prints from hand to hand."], "src": [2]}, {"title": "1867–1878: fashion", "paras": ["The 1867 Paris World's Fair, the first Japan took part in, made Japanese goods fashionable. Fans, screens and kimonos appeared in salons and in paintings: Monet painted his wife in a kimono (La Japonaise, 1876), Whistler arranged blue-and-white porcelain and screens around his models.", "This is the layer of ‘japonaiserie’: Japanese objects as props. Composition, perspective and the construction of the picture remain entirely European."], "src": [2]}, {"title": "1878–1890: learning to see", "paras": ["The 1878 World's Fair and the arrival of the dealers Hayashi Tadamasa and Siegfried Bing brought tens of thousands of prints and picture books into Paris. Critics began to write studies (Louis Gonse, 1883).", "Artists no longer copied objects but learned structure: cropping, the high viewpoint, flat areas of colour, outlines. Degas, Van Gogh, Gauguin, Émile Bernard and Toulouse-Lautrec belong to this phase."], "src": [2]}, {"title": "1890–1910: spreading out and dissolving into modernism", "paras": ["The exhibition of prints at the École des Beaux-Arts (1890) marked official recognition. Japonisme then spread into the decorative arts and architecture: Art Nouveau in Paris, Nancy and Brussels; the Vienna Secession (its 6th exhibition, in 1900, was devoted to Japanese art); the Aesthetic Movement in London; Tiffany in New York.", "By about 1910, what had been learned from Japan had become the common grammar of modern art, so people stopped calling it Japonisme."], "src": [2]}, {"title": "Japonisme beyond Paris", "bullets": ["London: Liberty & Co. opened in 1875, selling silks and Japanese goods; the architect E. W. Godwin designed ‘Anglo-Japanese’ interiors; Whistler was the bridge between Paris and London.", "The Nabis: Pierre Bonnard, nicknamed ‘le Nabi très japonard’ by his friends, painted multi-panel screens, flat areas of colour and patterned clothing.", "Vienna: Klimt, Koloman Moser and Josef Hoffmann studied patterns, kimonos and katagami stencils; the Wiener Werkstätte was founded in 1903.", "America: Louis Comfort Tiffany, the educator Arthur Wesley Dow (who taught composition based on Japanese prints), and the architect Frank Lloyd Wright, who collected and dealt in prints."], "src": [2]}]}, {"type": "gallery", "title": "Four pictures that tell the story", "items": [{"img": "hiro-kameido", "caption": "Hiroshige, 1857: a tree trunk right in front of the eye, a tiny background"}, {"img": "vg-plum", "caption": "Van Gogh's copy, 1887"}, {"img": "monet-japonaise", "caption": "Monet, 1876: surface-level Japonisme"}, {"img": "degas-tub", "caption": "Degas, 1886: structural Japonisme"}]}, {"type": "stats", "title": "A few numbers from the lectures", "items": [{"value": "1854", "label": "Treaty of Kanagawa: Japan opens to trade with the United States"}, {"value": "1872", "label": "Roughly when Philippe Burty coined the word “japonisme”"}, {"value": "1–5 francs", "label": "Price of one print at the Desoye shop in Paris"}, {"value": "500+", "label": "Japanese prints owned by the Van Gogh brothers, now in the Van Gogh Museum"}, {"value": "117", "label": "Japanese prints found in Degas's collection at his death"}, {"value": "1890", "label": "The Paris École des Beaux-Arts shows “the Japanese masters”"}]}, {"type": "callout", "tone": "info", "title": "The quotation taken as the spirit of the lectures", "items": ["Samuel Bing, Le Japon artistique: Japanese art mixes into our art like a drop of blood into the bloodstream, and can no longer be filtered out.", "Van Gogh to Theo: all my work is, so to speak, founded on Japanese art."]}, {"type": "callout", "tone": "good", "title": "A third perspective: the documentary ‘Quand les impressionnistes découvrent le Japon’", "items": ["A critic of the time wrote that it took albums of prints arriving in Paris before anyone dared sit on a riverbank and set side by side on a canvas a red roof, a white wall, a green poplar, a yellow road and blue water.", "The film tells Japonisme as a wave lasting under 50 years (1853–1905), passing through the Impressionists, Van Gogh, Gauguin, the Nabis and Lautrec, then spilling into opera, operetta, dance and music.", "The film's conclusion: perhaps the greatest lesson of Japonisme is to stop putting the West at the centre. See the new pages ‘Monet and the Impressionists’, ‘Gauguin, Rivière and the Nabis’ and ‘Beyond painting’."], "src": [3]}]}, "history": {"page": "history", "title": "The Japanese wave, 1854 to 1890", "group": "Context", "lead": "From a treaty forced by gunboats to the Paris École des Beaux-Arts showing “the Japanese masters”: about 35 years for an exotic commodity to become a standard.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2 Histoire d'un plagiat ?”", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 2/2, van Gogh, Degas et Lautrec”", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Video 1, 18:25: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=1105s", "date": "Art d'Histoire, 2018"}, {"name": "Additional art-history background beyond the two lectures, written by the compiler", "date": ""}, {"name": "Artistik TV, “Japonisme : comment l'art japonais a-t-il révolutionné la peinture occidentale ?” (from the film “Quand les impressionnistes découvrent le Japon”, directed by Jérôme Lambert and Philippe Picard, Andana Films)", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4", "date": "2018"}, {"name": "ADN documentary, 3:15: Goncourt, Zola and their cabinets of Japanese objects", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=195s", "date": "Artistik TV"}, {"name": "ADN documentary, 15:59: Duret and Cernuschi travel around the world", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=959s", "date": "Artistik TV"}, {"name": "ADN documentary, 26:18: Guimet and Régamey go to Japan", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=1578s", "date": "Artistik TV"}, {"name": "ADN documentary, 47:23: the 1900 Exposition, Loïe Fuller, Debussy", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2843s", "date": "Artistik TV"}, {"name": "ADN documentary, 49:34: 1905, Picasso and the final lesson", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2974s", "date": "Artistik TV"}], "blocks": [{"type": "timeline", "title": "Key milestones", "items": [{"when": "16th century", "title": "The Dutch trade at Nagasaki", "text": "The Dutch East India Company has a trading post on an artificial island off Nagasaki harbour. Porcelain shipped to Europe is wrapped in prints, but nobody pays attention.", "src": [1], "detail": [["Context", "The Portuguese reached Japan in 1543. The Dutch set up a trading post at Hirado in 1609; when the Tokugawa shogunate closed the country (sakoku), from 1641 they were the only Europeans allowed to trade, confined to the artificial island of Dejima, about 1.3 hectares."], ["What happened", "Arita and Imari porcelain, lacquer and silk sailed to Amsterdam. Ukiyo-e woodblock prints were so cheap they were used as packing paper."], ["Significance", "More than two centuries of contact without any change in how Europe saw: having Japanese objects in hand was not enough to produce Japonisme."]]}, {"when": "1812", "title": "Drouot sells a Nagasaki collection cheaply", "text": "Japanese objects were then seen only as curiosities. The old paradigm was not yet in crisis, so nobody “learned” from them.", "src": [1], "detail": [["Context", "Napoleonic Paris: taste was led by the Neoclassicism of David and Ingres, and the Academy held the right to define what painting was."], ["What happened", "A collection brought back from Nagasaki was put up for sale and went for low prices, as exotic ornaments."], ["Significance", "The lecturer uses this milestone to prove a point: while the old paradigm stands firm, the other is merely a ‘curiosity’, and nobody treats it as a lesson."]]}, {"when": "1853", "title": "Whistler meets Japanese art early", "text": "Goods from a Japanese ship washed up on the California coast were shown in New York. An exceptional case.", "src": [0], "detail": [["Context", "Whistler was still in America then; in 1855 he went to Paris to study painting and later settled in London."], ["What happened", "He later collected blue-and-white porcelain, prints and screens, painted ‘Caprice in Purple and Gold: The Golden Screen’ (1864) and the Nocturne series, which borrowed Hiroshige's way of staging bridges and rivers."], ["Significance", "An example showing that personal contact could come early, but it took the Paris of the 1860s for it to become a movement."]]}, {"when": "1854", "title": "Treaty of Kanagawa", "text": "Commodore Perry of the US Navy used “gunboat diplomacy” to force the shogunate to open up. Russia, France, Britain and the Netherlands signed similar treaties soon after.", "src": [0], "detail": [["Context", "In July 1853 Perry's squadron of ‘black ships’ entered Edo Bay, delivered a letter from the US President and promised to return."], ["What happened", "In March 1854 the Treaty of Kanagawa opened two ports, Shimoda and Hakodate. In 1858 the Ansei commercial treaties with the US, the Netherlands, Russia, Britain and France opened Yokohama, Nagasaki and Kobe to free trade."], ["Significance", "Japanese goods began to flow into Europe in large quantities, no longer through Dejima as the only gateway."]]}, {"when": "1868", "title": "The Meiji era", "text": "Japan modernises and sells off samurai armour, swords, kimonos and prints without perspective as relics of backwardness. “Their backwardness made our modernity.”", "src": [0], "detail": [["Context", "The shogunate collapses, power returns to Emperor Meiji, with the slogan ‘civilisation and enlightenment’ and a drive to learn from the West."], ["What happened", "In 1871 the feudal domains are abolished; in 1876 the wearing of swords is banned and the samurai class loses its status. Armour, swords, kimonos and prints are dumped for next to nothing; Western-style oil painting (yōga) is encouraged."], ["Significance", "The central paradox: what Japan discarded as ‘backward’ was exactly what Europe used to escape perspective and the Academy."]]}, {"when": "1861–1870", "title": "The collectors' salons", "text": "The documentary tells how the Goncourt brothers bought Japanese prints at the shop ‘La Porte chinoise’; Zola described their house as ‘a little museum’.", "detail": [["What happened", "Edmond de Goncourt wrote that he had never seen an art so ‘fantastic, admirable and poetic’. Their cabinets held netsuke (small ivory or wood figures), porcelain, small swords and bronzes picked out as soon as crates from the Far East were opened."], ["High society", "The collector Clémence d’Ennery displayed Japanese objects in her mansion, frequented by the Parisian art and political world, from the composer Gounod to the statesman Gambetta."], ["Significance", "At this point Japanese objects are precious, heaped-up collectibles, closer to a cabinet of curiosities than to an artistic lesson."]], "src": [5]}, {"when": "The 1860s", "title": "The first shops and collectors", "text": "Madame Desoye opens a shop in Paris; her customers include Manet, Fantin-Latour, Carolus-Duran, the Goncourt brothers, Champfleury, Zola, Baudelaire, the director of the Sèvres porcelain works and even the director of the Louvre.", "src": [0], "detail": [["Context", "Paris is the capital of art, and a group of young artists is looking for a way out of the Salon."], ["What happened", "Around 1862, the Desoye couple open a shop of Japanese goods at 220 rue de Rivoli. Regulars include Manet, Fantin-Latour, Whistler, the Goncourt brothers, Zola, Baudelaire and people from the Louvre and the Sèvres porcelain works."], ["Traces", "In his ‘Portrait of Émile Zola’ (1868), Manet painted a print of a sumo wrestler and a Japanese screen on the wall."], ["Significance", "Japanese objects entered the worlds of creation, criticism and institutions at the same time, so the influence spread very fast."]]}, {"when": "1867", "title": "The Bracquemond–Rousseau dinner service causes a sensation", "text": "Bracquemond copied almost directly from Hokusai Manga onto a porcelain dinner service, shown at the World's Fair and reissued until quite recently.", "src": [0], "img": "bracquemond", "detail": [["Context", "The 1867 Paris World's Fair is Japan's first, with a pavilion of the shogunate and of the two domains of Satsuma and Saga."], ["What happened", "The dealer Eugène Rousseau commissions Félix Bracquemond to decorate a porcelain dinner service: birds, fish and plants taken almost directly from Hokusai Manga and Hiroshige prints, with off-centre compositions and plenty of empty space."], ["Significance", "A great commercial success, produced for decades. But it stays at layer 1: copying motifs without changing the way of seeing."]]}, {"when": "1871–1873", "title": "Duret and Cernuschi travel around the world", "text": "The critic Théodore Duret and the banker Henri Cernuschi gather nearly 4,000 objects in Japan, including a bronze Buddha weighing several tonnes from Meguro.", "detail": [["Context", "Steamships and railways make the Earth ‘shrink’; the same year Jules Verne writes ‘Around the World in Eighty Days’ (1872)."], ["What happened", "In Yokohama, Duret noted: ‘as soon as we stepped off the ship, we started buying’. The Buddha was cut into pieces, shipped to Paris and placed in the middle of Cernuschi's mansion, now the Musée Cernuschi."], ["Discovery", "Duret loved Hokusai Manga because he found in it the people he met in the street, far from Europe's clichéd Japan."], ["Paradox", "By then the Japanese were tired of prints and had taken to photography. Felice Beato's photographs in Yokohama in turn built an idealised image of an old Japan that was disappearing."]], "src": [6]}, {"when": "1872", "title": "The word “japonisme” is born", "text": "Philippe Burty coins the word. Astruc, Goncourt and Bracquemond's Jinglar society meets monthly to “live the Japanese way”.", "src": [0], "detail": [["Context", "After the Franco-Prussian War of 1870–71, the Paris collecting world recovers quickly."], ["What happened", "The critic Philippe Burty coins the word ‘japonisme’ in a series of articles in the journal La Renaissance littéraire et artistique. The Jinglar society (Astruc, Bracquemond, Burty, Fantin-Latour...) meets monthly, wearing kimonos, eating with chopsticks and drinking sake."], ["Significance", "Having a name means a phenomenon is recognised. But this phase is still mostly about ‘playing with Japanese things’."]]}, {"when": "1874", "title": "Samuel Bing opens his shop L'Art japonais", "text": "He imports tens of thousands of items from Japan. The shop grows, and by the late 1890s becomes the “Art Nouveau” shop that named a whole movement.", "src": [0], "detail": [["Context", "Demand for Japanese goods outstrips the scattered supply."], ["What happened", "Siegfried (Samuel) Bing, originally from Hamburg, opens a shop in Paris and sets up an agency in Japan to import tens of thousands of items directly: prints, picture books, ceramics, bronzes. Van Gogh rummaged through his stockroom and bought hundreds of prints."], ["Later", "In December 1895 he opens the ‘Maison de l’Art Nouveau’; the name of the shop becomes the name of a whole style."], ["Significance", "From a dealer, Bing becomes the link between Japonisme and the European decorative arts."]]}, {"when": "1876", "title": "Guimet and Régamey go to Japan", "text": "The Lyon industrialist Émile Guimet and the painter Félix Régamey travel to Japan to study religion and collect objects for a museum.", "detail": [["Belief", "Guimet saw Japonisme as a chance for ‘the rebirth of Western art and thought’, more than a fashion."], ["Disillusion", "Régamey saw this ‘marvellous, poetic world’ about to sink into ‘the chaos of Western civilisation’. Guimet regretted the good things the Japanese abandoned ‘for no reason’. At the same time, the art school in Tokyo opened a department of Western painting."], ["Significance", "The Japan that Paris adored was a Japan of the past; the real Japan was modernising at breakneck speed."]], "src": [7]}, {"when": "1883", "title": "Louis Gonse's exhibition and book L'Art japonais", "text": "Bing and Gonse organise the first exhibition of Japanese art. Van Gogh read Gonse's book.", "src": [0, 1], "detail": [["Context", "A need to understand Japanese objects systematically, not just collect them."], ["What happened", "Louis Gonse, editor of the Gazette des Beaux-Arts, publishes the two-volume ‘L’Art japonais’ and organises a retrospective of Japanese art at the Galerie Georges Petit with about 3,000 objects lent by collectors, Bing among them."], ["Significance", "Japanese objects are treated as an art history with schools and masters. Van Gogh read this book when he came to Paris (1886–88)."]]}, {"when": "1888–1891", "title": "The journal Le Japon artistique", "text": "Bing publishes a monthly in French, English and German for 3 years.", "src": [0], "detail": [["Context", "Art Nouveau is taking shape, and designers need sources of models."], ["What happened", "Bing issues an illustrated monthly printed in colour in three languages, 36 issues from May 1888 to April 1891, with articles by Gonse, Burty, Ary Renan and Justus Brinckmann (Hamburg)."], ["Significance", "Japanese images reach artists, workshops and museums all over Europe without going through Paris."]]}, {"when": "1890", "title": "The Academy shows “Les maîtres japonais”", "text": "The academic school that taught three-dimensional modelling calls Japanese artists “masters”. The lecturer sees this as a sign of crisis.", "src": [0], "detail": [["Context", "The École des Beaux-Arts is the fortress of academic training: anatomy, perspective, modelling."], ["What happened", "In April–May 1890 Bing holds an exhibition of Japanese prints right there, with more than 700 prints and about 400 picture books. Mary Cassatt visited several times, then made a series of 10 colour prints (1890–91) in the manner of Utamaro."], ["Significance", "The institution that guarded academic standards called the Japanese ‘masters’. The lecturer reads this as a sign of paradigm crisis."]]}, {"when": "The 1890s", "title": "The first generation of collectors dies", "text": "The Burty and Goncourt collections are sold, flooding the market with prints. The Guimet and Cernuschi museums grow out of the travels.", "src": [0], "detail": [["Context", "The collectors of the 1860s are growing old."], ["What happened", "Burty died in 1890 and his collection was sold in 1891; Edmond de Goncourt died in 1896 and his was sold in 1897. After his 1876 trip to Japan, Émile Guimet moved his museum from Lyon to Paris in 1889; Henri Cernuschi, after his 1871–73 trip to Asia with Théodore Duret, left his mansion to become a museum that opened in 1898."], ["Significance", "Japanese objects move from private cabinets into public museums: Japonisme stops being a fashion and becomes part of the foundations of European art."]]}, {"when": "1900", "title": "Paris World's Fair", "text": "Japan shows treasures from Emperor Meiji's private collection. The Cernuschi and Guimet museums have opened in Paris.", "detail": [["Theatre", "The American dancer Loïe Fuller performs with a Japanese theatre troupe in ‘The Geisha and the Knight’; Cocteau described her as ‘an orchid of light and fabric’."], ["Music", "Debussy writes ‘La Mer’ (1905), said to be inspired by Hokusai's Great Wave hanging in his apartment; the cover of the score reproduces the print."], ["Significance", "By now Japonisme had spread from painting into decoration, literature, dance, music and film."]], "src": [8], "img": "debussy-mer"}, {"when": "1905–1907", "title": "The avant-garde turns elsewhere", "text": "Japan defeats Russia (1905): the image of a ‘charming, exotic’ Japan turns into that of a modern, worrying great power.", "detail": [["What happened", "From Dresden to Paris, young artists turn to African and Oceanic art. In 1907 Picasso paints ‘Les Demoiselles d'Avignon’."], ["Significance", "The film concludes: perhaps the greatest lesson of Japonisme is to stop putting the West at the centre of everything."]], "src": [9]}]}, {"type": "story", "title": "In depth: Japanese prints and the print dealers", "items": [{"title": "What is ukiyo-e", "img": "hokusai-wave", "caption": "Hokusai, The Great Wave off Kanagawa, about 1831", "paras": ["Ukiyo-e, ‘pictures of the floating world’, is the art of the townspeople of Edo (today's Tokyo) from the 17th to the 19th century: courtesans, kabuki actors, wrestlers, famous landscapes. A print is the work of four people: the publisher who commissions it, the artist who draws the design, the carver who cuts each colour into a woodblock, and the printer who prints the colours one on top of another.", "From 1765, Suzuki Harunobu popularised multi-colour prints (nishiki-e, ‘brocade pictures’). From the 1820s, Prussian blue imported from Europe let Hokusai and Hiroshige paint deep blue skies and water. Printed in large numbers, prints were cheap and seen as consumer goods rather than high art."], "src": [3]}, {"title": "The two series Europe loved most", "paras": ["Hokusai's ‘Thirty-six Views of Mount Fuji’ (about 1830–32) includes the Great Wave and Red Fuji: one subject seen from many angles, the mountain sometimes just a small dot in the background.", "Hiroshige's ‘One Hundred Famous Views of Edo’ (1856–58) was a source for Van Gogh, Whistler and Monet: huge cropped foregrounds (a plum branch, a horse's legs, a bridge pillar), vertical formats, high horizons. This is the toolbox analysed on the page ‘8 techniques learned from Japan’."], "src": [3]}, {"title": "Hayashi Tadamasa: a Japanese man in the middle of the market", "paras": ["Hayashi came to Paris in 1878 as an interpreter for the Japanese delegation at the World's Fair and stayed on as a dealer. He sold to Degas, Monet and museums, while buying Impressionist paintings to take back to Japan.", "He helped Edmond de Goncourt write two monographs, on Utamaro (1891) and Hokusai (1896), and wrote an article introducing Japan for Paris Illustré (1886). This article led Van Gogh to believe that the climate of the south of France resembled Japan's."], "src": [3]}, {"title": "Siegfried Bing: from print stockroom to Art Nouveau", "paras": ["Originally from Hamburg, Bing started with ceramics and porcelain, then specialised in Japanese and Chinese goods, with a branch in Japan to buy at the source. The print stockroom above his shop on rue Chauchat is where Van Gogh and Theo picked out hundreds of sheets.", "Bing was both dealer and educator: the journal Le Japon artistique (1888–91), the exhibition at the École des Beaux-Arts (1890). In 1895 he opened the Maison de l’Art Nouveau, showing work by Tiffany, Gallé and van de Velde. The same man went from selling Japanese goods to naming Art Nouveau."], "src": [3]}, {"title": "Edmond de Goncourt: the writer-collector", "paras": ["Goncourt claimed to be one of the first to love Japanese art. His book ‘La Maison d’un artiste’ (1881) describes every object in his house at Auteuil, turning collecting into an aesthetic way of life.", "His collection was auctioned in 1897, after his death, putting thousands more objects onto the market and into museums."], "src": [3]}]}, {"type": "gallery", "title": "The prints flooding into Paris", "layout": "feature", "items": [{"img": "hokusai-wave", "caption": "Hokusai, The Great Wave, about 1831"}, {"img": "hiro-kameido", "caption": "Hiroshige, Plum Garden at Kameido, 1857"}, {"img": "hiro-ohashi", "caption": "Hiroshige, Sudden Shower over Ōhashi Bridge, 1857"}, {"img": "kiyonaga-bath", "caption": "Kiyonaga, Women at a Bathhouse, about 1780"}]}, {"type": "media", "kicker": "Case study · Video 1, 18:25", "title": "The Academy shows “the Japanese masters”", "img": "v1-1105", "caption": "Poster for the “Maîtres Japonais” exhibition, École des Beaux-Arts, Paris, 1890 · 18:25", "text": "The lecturer stops on this poster because it is shocking: the École des Beaux-Arts itself, where three-dimensional modelling and academic life drawing were taught, calls Japanese prints, picture books and kakemono the work of “masters”. The organisers include Bing, Burty, Goncourt and Gonse: the whole japonisme network in one list.", "bullets": ["The word “Maîtres” had been reserved for Titian, Poussin and Caravaggio.", "The exhibition raised funds for the Alliance Française, a thoroughly establishment institution."], "src": [2]}, {"type": "cards", "title": "Japanese fashion: the surface layer", "kicker": "Layer 1", "items": [{"title": "Whistler, Caprice in Purple and Gold (1864)", "text": "A woman absorbed in prints, a gold screen, a vase cropped at the edge of the foreground. The composition is still European.", "src": [0], "img": "whistler-screen"}, {"title": "Monet, La Japonaise (1876)", "text": "Camille Monet in a red kimono and a blonde wig, a reminder that she is European, with Japanese fans on the wall. Pure fashion.", "src": [0], "img": "monet-japonaise"}, {"title": "Manet, Portrait of Zola (1868)", "text": "Behind Zola hang a Japanese print and a screen, next to a print of Olympia. A thank-you in the Japanese manner.", "src": [0], "img": "manet-zola"}, {"title": "Tissot and Alfred Stevens", "text": "Dresses with a big bow at the back like an obi, the S-shaped silhouette, tight skirts taking short geisha-like steps. Stevens painted “Parisiennes” in kimonos.", "src": [0]}, {"title": "Opera", "text": "Saint-Saëns's La Princesse jaune, Gilbert and Sullivan's The Mikado: Japan only in the costumes, the music unchanged. It took Puccini to go deeper.", "src": [0]}, {"title": "Department stores and Zola", "text": "Department stores had Japanese sections and catalogues: the rich bought originals, Gallé, Daum; those with less money bought copies. Zola describes it in Au Bonheur des Dames.", "src": [0]}]}]}, "paradigm": {"page": "paradigm", "title": "A paradigm in crisis", "group": "Context", "lead": "Why would the guardians of academic standards collect an art that broke all their rules? The lecturer's answer: Europe was in a paradigm crisis.", "sources": [{"name": "Art d'Histoire, “Japonisme 1/2 Histoire d'un plagiat ?”, 18 to 31 min", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI", "date": "2018"}, {"name": "Art d'Histoire, “Japonisme 2/2”, 9 to 11 min", "url": "https://www.youtube.com/watch?v=PubHMeST-tg", "date": "2018"}, {"name": "Video 1, 26:12: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=1572s", "date": "Art d'Histoire, 2018"}, {"name": "Video 1, 28:20: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=1700s", "date": "Art d'Histoire, 2018"}, {"name": "Video 1, 28:47: the lecturer places the two works side by side", "url": "https://www.youtube.com/watch?v=vhleOd5WmqI&t=1727s", "date": "Art d'Histoire, 2018"}, {"name": "Additional art-history background beyond the two lectures, written by the compiler", "date": ""}], "blocks": [{"type": "compare", "title": "Two models of seeing", "left": "European academic tradition", "right": "Japanese prints", "rows": [{"label": "Position of the viewer", "left": "All-knowing, the “eye of God”: sees everything, nothing hidden", "right": "Blocked by a post, a branch, the edge of the picture; the rest must be guessed"}, {"label": "Composition", "left": "Symmetrical, balanced, centred (the Platonic tradition, The School of Athens)", "right": "Off-centre, unbalanced, diagonals pulling the eye into the distance"}, {"label": "Completeness", "left": "The whole scene, like a jigsaw with every piece", "right": "Only a fragment: a section of bridge, a single leaf"}, {"label": "Space", "left": "Perspective, three-dimensional modelling, tonal values", "right": "Flat areas of colour, outlines, empty space"}, {"label": "Hierarchy of the arts", "left": "Fine art separated from decorative art", "right": "The same artist makes prints, screens and kimono designs"}], "src": [0]}, {"type": "diagram", "title": "The two models of seeing, drawn as diagrams", "img": "d02", "note": "Illustrative diagrams drawn by the compiler from the five criteria in the table above, each placed next to a real work: Raphael, Leonardo, Claude Lorrain, David and Cabanel for the Academy; Hiroshige, Hokusai and Ogata Kōrin for Japanese art. Click to enlarge."}, {"type": "story", "title": "In depth: the academic paradigm and why it faltered", "items": [{"title": "What a ‘paradigm’ means", "paras": ["Thomas Kuhn used the concept of the paradigm for the history of science (1962): a set of rules, model examples and legitimate questions that a whole community takes for granted. When too much cannot be explained by the old paradigm, a crisis occurs and the community moves to a new one.", "The lecturer applies this idea to painting: Europe had Japanese pictures in hand from the 17th century but did not learn from them, because the paradigm still held. Only when it went into crisis did Japanese art become the answer."], "src": [5], "img": "durer-lute", "caption": "Dürer, Man Drawing a Lute, 1525: perspective as a measuring machine, the eye fixed at one point."}, {"title": "How the old paradigm was built", "bullets": ["Linear perspective: Brunelleschi experimented in Florence in the early 15th century, and Alberti systematised it in ‘De pictura’ (1435). All lines converge on a vanishing point, and the viewer stands in a fixed position.", "The Academy: the Académie royale de peinture et de sculpture was f
