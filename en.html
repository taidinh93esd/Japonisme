he frame, clear outlines, flat colour"], ["9. The Wave → Van Gogh", "Repeated curves, rhythm", "Stick-like strokes, swirls in the sky"]]}]}, "culture": {"page": "culture", "title": "Beyond painting: theatre, music, literature", "group": "Context", "lead": "According to the Artistik TV documentary, in under 50 years Japonisme spilled from painting into the decorative arts, opera, operetta, the novel, dance and music. For the most part it was an imagined Japan.", "sources": [{"name": "Artistik TV, “Japonisme : comment l'art japonais a-t-il révolutionné la peinture occidentale ?” (from the film “Quand les impressionnistes découvrent le Japon”, directed by Jérôme Lambert and Philippe Picard, Andana Films)", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4", "date": "2018"}, {"name": "ADN documentary, 7:57: geishas, Burty, Le Figaro", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=477s", "date": "Artistik TV"}, {"name": "ADN documentary, 9:29: Saint-Saëns, La Princesse jaune", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=569s", "date": "Artistik TV"}, {"name": "ADN documentary, 29:41: The Mikado and the definition of ukiyo-e", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=1781s", "date": "Artistik TV"}, {"name": "ADN documentary, 47:23: Loïe Fuller, Debussy", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2843s", "date": "Artistik TV"}], "blocks": [{"type": "timeline", "title": "Works that brought Japan to the stage and the page", "items": [{"when": "1872", "title": "Saint-Saëns, ‘La Princesse jaune’", "text": "A one-act opera, the first time French music spoke of Japan, or rather of the French idea of Japan.", "detail": [["Plot", "The character Cornélius falls in love with a geisha in a print, making his fiancée jealous. The film calls it ‘the height of the cult’."]], "src": [2]}, {"when": "1885", "title": "Gilbert and Sullivan, ‘The Mikado’", "text": "An operetta first performed in London in March 1885, running for years in London and New York.", "detail": [["Reaction", "A London newspaper wrote the next day: ‘We are all Japanese’. Audiences came to laugh at the ‘strange and charming’ customs of the Japanese."], ["A second reading", "The film argues that this ‘light’ form of entertainment actually suited the spirit of ukiyo-e: living for the present, going with the flow of life like a gourd floating on the water."]], "src": [3]}, {"when": "1887", "title": "Pierre Loti, ‘Madame Chrysanthème’", "text": "A best-selling novel about a French naval officer's temporary affair in Nagasaki, reinforcing the image of the geisha in the European imagination.", "src": [3]}, {"when": "1900", "title": "Loïe Fuller and ‘The Geisha and the Knight’", "text": "At the World's Fair, Loïe Fuller presented a Japanese theatre troupe on her stage; Cocteau saw her as ‘an orchid of light and fabric’.", "src": [4]}, {"when": "1905", "title": "Debussy, ‘La Mer’", "text": "Debussy said he was inspired by Hokusai's Great Wave hanging in his apartment; the cover of the score reproduces the print. Some call it impressionist music.", "src": [4], "img": "debussy-mer"}]}, {"type": "story", "title": "The geisha: symbol of an imagined Japan", "items": [{"title": "From prints to salon paintings", "paras": ["After the 1867 World's Fair, painters favoured by the bourgeoisie in Brussels, London and Paris, such as James Tissot, Alfred Stevens and John Singer Sargent, painted European women in kimonos among Japanese objects. The film calls this a variant of Orientalism.", "The figure of the geisha appeared everywhere, at once distant and seductive, becoming the symbol of a ‘dream country’."], "src": [1], "img": "monet-japonaise", "caption": "Monet, La Japonaise, 1876: the kimono-fashion layer"}, {"title": "Mocking voices", "paras": ["Le Figaro wrote that Japonisme was ‘a passion, a religion, a fever’, but that its devotees never painted a real, living Japan: most knew Japan only through albums of prints or a few objects bought on the rue Vivienne.", "The criticism is fair for the surface layer. But it was from such albums that the avant-garde painters learned a way of seeing, as the page ‘A paradigm in crisis’ explains."], "src": [1]}, {"title": "Shunga: the part less often told", "paras": ["Albums of erotic prints (shunga) also reached Europe and were bought by collectors such as Edmond de Goncourt. The film stresses one difference: unlike European erotic pictures of the time, shunga show women taking as much pleasure as men, and Goncourt saw them as a play of composition, props and poses more than of desire."], "src": [3]}]}, {"type": "callout", "tone": "info", "title": "Ukiyo-e as defined by Asai Ryōi (17th century)", "items": ["Living only for the moment; gazing at cherry blossoms and autumn leaves; loving wine, women and song; letting the current of life carry you along like a gourd floating on the water: this is what we call ukiyo, the floating world."], "src": [3]}]}, "impression": {"page": "impression", "title": "Monet and the Impressionists", "group": "Artists", "lead": "Before they were called ‘Impressionists’, the Batignolles group was once known as ‘the Japanese’. From Manet's cropping to Monet's Water Lilies series, Japanese prints are present at every stage.", "sources": [{"name": "Artistik TV, “Japonisme : comment l'art japonais a-t-il révolutionné la peinture occidentale ?” (from the film “Quand les impressionnistes découvrent le Japon”, directed by Jérôme Lambert and Philippe Picard, Andana Films)", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4", "date": "2018"}, {"name": "ADN documentary, 11:35: Fantin-Latour, A Studio at Les Batignolles", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=695s", "date": "Artistik TV"}, {"name": "ADN documentary, 13:58: Whistler, The Balcony", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=838s", "date": "Artistik TV"}, {"name": "ADN documentary, 19:22: Manet, En bateau; Monet's studio boat", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=1162s", "date": "Artistik TV"}, {"name": "ADN documentary, 21:23: the 1874 exhibition and the word ‘impressionniste’", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=1283s", "date": "Artistik TV"}, {"name": "ADN documentary, 27:38: Monet at Giverny", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=1658s", "date": "Artistik TV"}, {"name": "ADN documentary, 38:56: Monet and painting in series", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2336s", "date": "Artistik TV"}], "blocks": [{"type": "story", "title": "Five stages of Japonisme among the Impressionists", "items": [{"title": "1870: a statue of Minerva and a Japanese vase", "img": "fantin-batignolles", "paras": ["In ‘A Studio at Les Batignolles’, Fantin-Latour paints Manet at his easel, surrounded by Renoir, Monet, Zola and other young friends. Next to Manet are two objects: a plaster statuette of the goddess Minerva, standing for antiquity, and a Japanese ceramic vase, standing for the new.", "The film reads this as the choice of a whole generation: they still respected antiquity, but could not bear those who had ‘embalmed’ it, namely the Academy. Manet mocked one of Meissonier's battle paintings: ‘Everything is made of steel, except the armour’."], "src": [1]}, {"title": "1870–71: London, Whistler and the balcony", "img": "whistler-balcony", "paras": ["Fleeing the Franco-Prussian War, Monet, Pissarro and Sisley went to London and saw Turner at the National Gallery. Monet frequented the studio of Whistler, a collector of Japanese objects.", "According to the film, Whistler's ‘The Balcony’ takes its composition from a print in Hokusai's Thirty-six Views of Mount Fuji, but replaces Fuji with the bank of the Thames and its factory chimneys. Here Monet met Théodore Duret again, one of the few critics to defend the Batignolles group."], "src": [2]}, {"title": "1874: Manet cuts the boat in half", "img": "manet-boating", "paras": ["In the summer of 1874, Manet went to paint with Monet and Renoir at Argenteuil. In ‘En bateau’, the frame is tight and keeps only the stern of the boat, the water rising to fill the whole background, with no horizon. The film sees this as a composition clearly influenced by Hokusai's prints.", "Monet built himself a studio boat to paint in the middle of the river. He said he wanted to paint ‘the air around the bridge, the house, the boat’, which he himself called impossible."], "src": [3]}, {"title": "1874: from ‘the Japanese’ to ‘the Impressionists’", "img": "monet-impression", "paras": ["In April 1874 the group organised its own exhibition in the photographer Nadar's former studio on the boulevard des Capucines, with about 30 painters, including Cézanne, Degas, Monet, Sisley, Pissarro, Renoir and Berthe Morisot. The paper Le Charivari mocked Monet's ‘Impression, Sunrise’.", "One critic replied: at first people called them ‘the Japanese’, but if a word was needed to explain them, a new one had to be coined, ‘impressionniste’, because they painted not the landscape but the sensation the landscape produced. The exhibition was a financial failure; the group held seven more before breaking up."], "src": [4]}, {"title": "1883–1926: Giverny, Monet's Japanese garden", "img": "monet-bridge", "paras": ["From 1883 Monet lived at Giverny. He hung his collection of Japanese prints throughout the house, mostly Utamaro, Hiroshige and Hokusai, and had a Japanese-style bridge built across the water-lily pond. The chrysanthemums, irises and peonies in the garden went straight into his paintings.", "Duret wrote that Monet was the first to dare push colour so far, and was mocked because ‘the lazy eye of the European’ still saw the subtle palette of Japanese artists as garish daubing."], "src": [5]}]}, {"type": "media", "title": "Painting in series: from Fuji to haystacks", "img": "monet-stacks", "text": "Admiring the Thirty-six Views of Mount Fuji, Monet chose a subject with a simple shape, the haystack, and painted it again and again at different hours and seasons to capture the fleeting impressions of light. From then on, almost all his work came in series.", "bullets": ["Haystacks (1890–91), Rouen Cathedral, then hundreds of Water Lilies.", "At the same time, Henri Rivière made ‘Thirty-six Views of the Eiffel Tower’, prepared with a camera (see the page Gauguin, Rivière and the Nabis).", "Unlike Hokusai, who changed his viewpoint around one mountain, Monet kept the viewpoint and changed the moment: the real subject is time and light."], "src": [6]}, {"type": "media", "title": "Water Lilies: almost abstract", "img": "monet-nympheas", "side": "right", "text": "Monet said he planted water lilies without thinking he would paint them, then ‘suddenly’ saw the magic of the pond and from then on painted nothing else. No banks, no horizon, only the water, reflected clouds and leaves: the last canvases are almost abstract.", "bullets": ["The film links this ‘exhausting of a subject’ to the Japanese spirit: capturing the beauty of the moment, accepting impermanence.", "The film compares the way the old Monet looked at nature to Shintō. Guimet once wrote that in Japan a god lives in every tree and every rock, and the landscape is like a person with moods."], "src": [6]}, {"type": "callout", "tone": "info", "title": "An open question", "items": ["The film stresses that photography and Japanese prints freed painters from imitation at the same time. The two sources reinforced each other: both crop unexpectedly and catch the moment. It is hard to separate what belongs to Japan and what to the lens."], "src": [4]}]}, "nabis": {"page": "nabis", "title": "Gauguin, Rivière and the Nabis", "group": "Artists", "lead": "The generation after Impressionism did not learn from Japan how to capture light, but how to paint in flat areas of colour, abandoning volume and depth. From Gauguin's ‘Vision after the Sermon’ to ‘Bonnard le Japonard’.", "sources": [{"name": "Artistik TV, “Japonisme : comment l'art japonais a-t-il révolutionné la peinture occidentale ?” (from the film “Quand les impressionnistes découvrent le Japon”, directed by Jérôme Lambert and Philippe Picard, Andana Films)", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4", "date": "2018"}, {"name": "ADN documentary, 36:50: Gauguin at Pont-Aven", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2210s", "date": "Artistik TV"}, {"name": "ADN documentary, 37:56: Henri Rivière, the Chat Noir, the Eiffel Tower", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2276s", "date": "Artistik TV"}, {"name": "ADN documentary, 42:08: Le Japon artistique, 1891, and the Nabis", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2528s", "date": "Artistik TV"}, {"name": "ADN documentary, 44:09: Vallotton, La Valse", "url": "https://www.youtube.com/watch?v=m86FnVMP9_4&t=2649s", "date": "Artistik TV"}], "blocks": [{"type": "media", "title": "Gauguin: a diagonal trunk dividing two worlds", "img": "gauguin-vision", "text": "‘Vision after the Sermon’ (1888), painted at Pont-Aven, marks Gauguin's break with Impressionism: flat areas of colour instead of small brushstrokes. Nothing in the subject recalls Japan, but the influence lies in the structure.", "bullets": ["Two scales and two spaces coexist in the picture: the Breton women in the foreground and Jacob wrestling with the angel on a red ground.", "An apple-tree trunk running diagonally across the picture separates the two worlds, borrowed, according to the film, from a Hiroshige print.", "Gauguin did not believe in Van Gogh's ‘Japanese South’; Japan's influence on him was a visual language, not a geographical dream."], "src": [1]}, {"type": "media", "title": "Henri Rivière: Hokusai in Paris", "img": "riviere-eiffel", "side": "right", "text": "Rivière staged shadow-puppet shows at the Chat Noir cabaret in Montmartre: black cut-out figures on a white screen. From 1888 he worked on ‘Thirty-six Views of the Eiffel Tower’, a tribute both to the new tower and to Hokusai, whose Thirty-six Views of Mount Fuji he owned.", "bullets": ["He cut his own woodblocks like a Japanese craftsman; each sheet is a variation on the same subject, changing the figures and the framing with the seasons.", "Unlike the Impressionists painting on the spot, Rivière prepared with a camera: the camera, now small and widespread, became the new sketchbook."], "src": [2]}, {"type": "callout", "tone": "info", "title": "Le Japon artistique, 1891", "items": ["An article in Bing's journal declared that the influence of the Far East was an accomplished fact, comparable only to the impact of antiquity on the Renaissance."], "src": [3]}, {"type": "story", "title": "The Nabis: ‘the prophets’", "items": [{"title": "A spiritual, anti-realist vision", "paras": ["At the end of the century, Maurice Denis, Félix Vallotton, Pierre Bonnard and their friends called themselves Nabis, Hebrew for ‘prophets’, to underline their ambition to renew painting. They defended a spiritual view of the world and rejected realism."], "src": [3]}, {"title": "Bonnard, ‘le Japonard’", "img": "bonnard-femmes", "paras": ["His friends called him ‘Bonnard le Japonard’. He said that through contact with those popular prints he understood that colour could express everything without volume or shading: light, form and character could all be rendered by colour alone.", "For ‘Women in the Garden’ he borrowed the narrow vertical format of the kakemono, the hanging silk scroll. The figures float in a space like that of a Japanese print, but the style and world are entirely his own."], "src": [3]}, {"title": "Vallotton goes further", "img": "vallotton-valse", "paras": ["The Swiss painter Félix Vallotton also took his organisation of space from Japan. In ‘The Waltz’ (1893), the couples weave into sinuous ellipses, their bodies seeming to float off the floor, far from reality. Are the patches of colour around them space, light or movement? The film leaves the question open."], "src": [4]}]}]}}}</script>
<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('site-data').textContent);
const P = DATA.pages || {}, NAV = DATA.nav || [], IMG = DATA.images || {};
const view = document.getElementById('view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const arr = a => Array.isArray(a) ? a : (a == null || a === '' ? [] : [a]);
const it = x => (typeof x === 'string' || typeof x === 'number') ? {text: String(x)} : (x && typeof x === 'object' ? x : {});
const pad2 = n => String(n).padStart(2, '0');
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let CUR = null, ONPAGE = false;

// ---------- text helpers
function fmt(s){
  let h = esc(s);
  h = h.replace(/^Nhận định:/, '<span class="nd">Nhận định:</span>');
  return h.replace(/\(1 nguồn\)/g, '<span class="src1">(1 nguồn)</span>');
}
function sup(page, list){
  const srcs = (page && page.sources) || [];
  const ids = [];
  arr(list).forEach(i => { i = Number(i); if(Number.isInteger(i) && srcs[i] && !ids.includes(i)) ids.push(i); });
  if(!ids.length) return '';
  const one = i => { const s = srcs[i] || {}; const t = esc((s.name||'') + (s.date ? ', ' + s.date : '')); return s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${t}">${i+1}</a>` : `<span class="n" title="${t}">${i+1}</span>`; };
  const rest = ids.slice(3);
  return `<sup class="s">${ids.slice(0,3).map(one).join(' ')}${rest.length ? ` <button type="button" class="more" aria-expanded="false" title="Show ${rest.length} more sources">+${rest.length}</button><span class="rest" hidden> ${rest.map(one).join(' ')}</span>` : ''}</sup>`;
}
function line(p, x){ x = it(x); return fmt(x.text) + sup(p, x.src); }
function tags(list){ list = arr(list).filter(Boolean); return list.length ? `<div class="tags">${list.map(g => `<span class="tag">${esc(g)}</span>`).join('')}</div>` : ''; }
function splitLead(s){
  s = String(s || '');
  if(/^Nhận định:/.test(s)) return null;
  const re = /[.!?]\s+(?=[\p{Lu}\d"“(])/gu; let m;
  while((m = re.exec(s))){ const cut = m.index + 1; if(cut > 130) break; if(cut >= 25 && s.length - cut >= 20) return [s.slice(0, cut), s.slice(cut).trim()]; }
  return null;
}

// ---------- images
function imgSrc(id){ const m = IMG[id] || {}; return m.url || ('img/' + (m.file || (id + '.jpg'))); }
function frame(id, cap, cls){
  const m = IMG[id]; if(!m) return '';
  const c = cap || m.cap || '';
  return `<button type="button" class="frame ${cls||''}" data-img="${esc(id)}" data-cap="${esc(c)}" aria-label="Enlarge image${c ? ': ' + esc(c) : ''}"><img src="${esc(imgSrc(id))}" alt="${esc(c)}" loading="lazy" decoding="async"${m.url ? ' referrerpolicy="no-referrer" onerror="this.parentNode.hidden=true"' : ''}${m.w && m.h ? ` width="${+m.w}" height="${+m.h}"` : ''}></button>`;
}
function credit(m){ if(!m.credit && !m.page) return ''; return `<span class="cr">Image: ${esc(m.credit||'')}${m.page ? `${m.credit ? ', ' : ''}<a href="${esc(m.page)}" target="_blank" rel="noopener">source</a>` : ''}</span>`; }
function fig(id, cap, fcls, style, figcls){
  const m = IMG[id]; if(!m) return '';
  const c = cap || m.cap || '';

// balanced rows of at most c items; each item gets a span on a 12-column grid

  items = arr(items).map(x => typeof x === 'string' ? {img: x} : it(x)).filter(x => x.img && IMG[x.img]);

  if(n === 1) return `<div class="gal one">${fig(items[0].img, items[0].caption, 'r43')}</div>`;
  const tc = n % 2 === 0 ? 2 : 3;

      const sd = spanList(n - 3, 3), st = spanList(n - 1, tc);
      return `<div class="gal feat">${items.map((x, i) => i === 0
        ? fig(x.img, x.caption, 'r43', '--sd:8;--st:12', 'gbig')
        : fig(x.img, x.caption, 'r43', `--sd:${i < 3 ? 4 : sd[i-3]};--st:${st[i-1]}`)).join('')}</div>`;

function qcard(p, x, meta, span){

 anatomy(b, p){
   const TONES = {art: 'Art, installation', sale: 'Sales', service: 'Services', back: 'Storage, logistics'};
   const zones = arr(b.zones).map(it);
   const tone = z => TONES[z.tone] ? z.tone : 'sale';
   const num = (v, d) => { v = Number(v); return Number.isFinite(v) ? v : d; };
   const r1 = v => Math.round(v * 100) / 100;
   const wrapW = (s, max) => { const lines = []; let cur = ''; String(s || '').split(/\s+/).filter(Boolean).forEach(w => { if(!cur) cur = w; else if((cur + ' ' + w).length <= max) cur += ' ' + w; else { lines.push(cur); cur = w; } }); if(cur) lines.push(cur); return lines; };
   const g = zones.map(z => {
     const x = Math.max(0, Math.min(96, num(z.x, 0))), y = Math.max(0, Math.min(56, num(z.y, 0)));

   }).join('');

 table(b, p){
   const cols = arr(b.columns).map(c => it(c).text != null ? it(c).text : String(c));

// ---------- page rendering
function renderNav(active){
  document.getElementById('nav').innerHTML = NAV.map(g => `<div class="navg"><h4>${esc(g.group)}</h4>${arr(g.items).map(i => `<a href="#${esc(i.id)}"${i.id === active ? ' aria-current="page"' : ''}>${esc(i.title)}</a>`).join('')}</div>`).join('');
}
function scrollToTarget(t){
  const el = t && document.getElementById(t);
  if(!el) return false;
  el.scrollIntoView({block: 'start', behavior: REDUCED ? 'auto' : 'smooth'});
  return true;
}
function renderPage(id, target){
  const p = P[id] || P.overview || P[Object.keys(P)[0]];
  if(!p){ view.innerHTML = '<p class="muted">No content yet.</p>'; return; }
  id = p.page || id; CUR = id; ONPAGE = true;
  renderNav(id);
  const blocks = arr(p.blocks);
  const titled = [];
  const body = blocks.map((b, i) => {
    const fn = b && R[b.type]; if(!fn) return '';
    let h = ''; try { h = fn(b, p); } catch(err){ return ''; }
    if(!h) return '';
    const t = blockTitle(b);
    if(t) titled.push({i, t});
    const hd = t && b.type !== 'callout';
    return `<section class="block t-${esc(b.type)}${hd ? ' hd' : ''}" id="${esc(id)}-b${i}">${h}</section>`;
  }).join('');
  const toc = titled.length >= 4 ? `<nav class="toc" aria-label="On this page"><div class="toc-h">On this page</div><div class="toc-c">${titled.map(x => `<a class="tchip" href="#${esc(id)}" data-target="${esc(id)}-b${x.i}" title="${esc(x.t)}">${esc(x.t)}</a>`).join('')}</div></nav>` : '';
  const srcs = (arr(p.sources).length && id !== 'sources') ? `<details class="srcs"><summary>Sources for this page (${p.sources.length})</summary><ol class="srcl">${p.sources.map(s => `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name)}${s.date ? `, ${esc(s.date)}` : ''}</li>`).join('')}</ol></details>` : '';
  view.innerHTML = `<header class="pg-head">${p.group ? `<div class="eyebrow">${esc(p.group)}</div>` : ''}<h1>${esc(p.title)}</h1>${p.lead ? `<p class="lead">${fmt(p.lead)}</p>` : ''}${toc}</header>${body}${srcs}<div class="foot">Updated ${esc(DATA.built)}. ${esc((DATA.site||{}).foot||'')}</div>`;
  document.getElementById('topTitle').textContent = p.title;
  document.title = p.title + ', ' + ((DATA.site||{}).name || '');
  initAnimFlows(); if(id === 'verify') initVerifyUI();
  if(target){ const el = document.getElementById(target); if(el){ el.scrollIntoView({block: 'start'}); return; } }
  window.scrollTo(0, 0);
}


// ---------- animated flowcharts
let AF_TIMERS = [], AF_OBS = null;
function initAnimFlows(){
  AF_TIMERS.forEach(clearInterval); AF_TIMERS = [];
  if(AF_OBS){ AF_OBS.disconnect(); AF_OBS = null; }
  const boxes = [...view.querySelectorAll('.af[data-af]')];
  if(!boxes.length) return;
  const ctrls = boxes.map(box => {
    const cfg = JSON.parse(box.getAttribute('data-af'));
    const n = cfg.steps.length, svg = box.querySelector('svg'), dots = box.querySelector('.af-dots');
    const playBtn = box.querySelector('.af-play'), cnt = box.querySelector('.af-cnt');
    const lis = [...box.querySelectorAll('.af-steps li')];
    let i = -1, timer = null, userPaused = false;
    function show(k){
      i = k;
      const on = new Set(k >= 0 ? cfg.steps[k] : []);
      box.classList.toggle('dim', k >= 0);
      svg.querySelectorAll('.af-n,.af-e').forEach(g => g.classList.toggle('on', on.has(g.dataset.k)));
      svg.querySelectorAll('.af-e').forEach(g => {
        const p = g.querySelector('path'); const r = g.classList.contains('risk');
        p.setAttribute('marker-end', `url(#${cfg.uid}-a${on.has(g.dataset.k) ? (r ? '-risk' : '-on') : ''})`);
      });
      dots.innerHTML = REDUCED ? '' : [...svg.querySelectorAll('.af-e.on')].map(g => `<circle class="af-dot${g.classList.contains('risk') ? ' risk' : ''}" r="6"><animateMotion dur="1.4s" repeatCount="indefinite" path="${g.dataset.d}"/></circle>`).join('');
      lis.forEach((li, j) => li.classList.toggle('on', j === k));
      cnt.textContent = k >= 0 ? `Step ${k + 1}/${n}` : `${n} steps`;
    }
    function stop(){ if(timer){ clearInterval(timer); AF_TIMERS = AF_TIMERS.filter(t => t !== timer); timer = null; } playBtn.textContent = 'Play'; playBtn.setAttribute('aria-pressed', 'false'); }
    function play(){ if(timer) return; if(i < 0 || i >= n - 1) show(0); timer = setInterval(() => { if(i >= n - 1){ show(-1); setTimeout(() => { if(timer) show(0); }, 1400); } else show(i + 1); }, 2600); AF_TIMERS.push(timer); playBtn.textContent = 'Pause'; playBtn.setAttribute('aria-pressed', 'true'); }
    playBtn.addEventListener('click', () => { if(timer){ stop(); userPaused = true; } else { userPaused = false; play(); } });
    box.querySelector('.af-prev').addEventListener('click', () => { stop(); userPaused = true; show(i <= 0 ? n - 1 : i - 1); });
    box.querySelector('.af-next').addEventListener('click', () => { stop(); userPaused = true; show(i >= n - 1 ? 0 : i + 1); });
    box.querySelectorAll('.af-steps button').forEach(bt => bt.addEventListener('click', () => { stop(); userPaused = true; show(+bt.dataset.i); }));
    return {box, play, stop, get userPaused(){ return userPaused; }};
  });
  if(REDUCED || !('IntersectionObserver' in window)) return;
  AF_OBS = new IntersectionObserver(ents => ents.forEach(en => {
    const c = ctrls.find(x => x.box === en.target); if(!c) return;
    if(en.isIntersecting && !c.userPaused) c.play(); else if(!en.isIntersecting) c.stop();
  }), {threshold: .45});
  ctrls.forEach(c => AF_OBS.observe(c.box));
}
// ---------- search (diacritic-insensitive)
let INDEX = null;
const SKIP = ['src','hsrc','img','imgs','type','tone','url','id','code','side','layout','widths','sentiment','gid','_gid','entrance','file'];
function buildIndex(){
  INDEX = [];
  const push = (pid, bi, text) => { if(text && typeof text === 'string') INDEX.push({pid, bi, text, n: norm(text)}); };
  const walk = (pid, bi, o) => {
    if(typeof o === 'string') return push(pid, bi, o);
    if(Array.isArray(o)) return o.forEach(v => walk(pid, bi, v));
    if(o && typeof o === 'object') for(const k in o){ if(SKIP.includes(k)) continue; walk(pid, bi, o[k]); }
  };
  for(const pid in P){ const p = P[pid]; push(pid, -1, p.title + '. ' + (p.lead || '')); arr(p.blocks).forEach((b, i) => walk(pid, i, b)); }
}
function doSearch(q){
  if(!INDEX) buildIndex();
  const nq = norm(q).trim();
  if(nq.length < 2){ renderPage(CUR || 'overview'); return; }
  ONPAGE = false;
  const terms = nq.split(/\s+/);
  const hits = INDEX.filter(e => terms.every(t => e.n.includes(t))).slice(0, 80);
  const hl = s => { let out = esc(s); terms.forEach(t => { if(!t) return; const ns = norm(s); const i = ns.indexOf(t); if(i >= 0){ const orig = s.substr(i, t.length); out = out.replace(esc(orig), `<mark>${esc(orig)}</mark>`); } }); return out; };
  view.innerHTML = `<div class="eyebrow">Search</div><h1>${hits.length} results</h1><p class="lead">Query: ${esc(q)}</p><div class="res" style="margin-top:28px">${hits.map(h => `<a href="#${esc(h.pid)}" data-target="${h.bi >= 0 ? esc(h.pid) + '-b' + h.bi : ''}"><div class="pg">${esc(P[h.pid].title)}</div><div>${hl(h.text.length > 260 ? h.text.slice(0, 260) + '...' : h.text)}</div></a>`).join('')}</div>`;
  window.scrollTo(0, 0);
}
let qT = null;
document.getElementById('q').addEventListener('input', e => { clearTimeout(qT); const v = e.target.value; qT = setTimeout(() => doSearch(v), 180); });

// ---------- routing and global clicks
// Internal links are handled in script (not default hash navigation) so they work where a host
// frame swallows hashchange; the hash is still updated for deep links. Same-page targets only scroll.
let pendingTarget = null;
function route(){ const h = decodeURIComponent((location.hash || '').replace('#', '')); renderPage(P[h] ? h : 'overview', pendingTarget); pendingTarget = null; closeMenu(); }
function go(id, target){
  if(!P[id]) id = 'overview';
  if(location.hash.slice(1) !== id){ try { history.pushState(null, '', '#' + id); } catch(err){} }
  renderPage(id, target || null); pendingTarget = null; closeMenu();
}
window.addEventListener('popstate', route);
window.addEventListener('hashchange', () => { if((location.hash || '').replace('#', '') !== CUR) route(); });
document.addEventListener('click', e => {
  const mo = e.target.closest('sup.s .more');
  if(mo){ e.preventDefault(); const r = mo.nextElementSibling; if(r) r.hidden = false; mo.setAttribute('aria-expanded', 'true'); mo.hidden = true; return; }
  const a = e.target.closest('a[href^="#"]');
  if(a && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey){
    e.preventDefault();
    const id = a.getAttribute('href').slice(1), tg = a.getAttribute('data-target');
    if(ONPAGE && id === CUR && tg && scrollToTarget(tg)){ closeMenu(); return; }
    go(id, tg || null);
    document.getElementById('q').value = '';
    return;
  }
  const im = e.target.closest('[data-img]');
  if(im){ e.preventDefault(); openLb(im.getAttribute('data-img'), im.getAttribute('data-cap')); return; }
  const vb = e.target.closest('.vbtns button');
  if(vb){ const id = vb.closest('.vitem').dataset.id; const s = vb.dataset.s; const cur = (STATE[id] || {}).status; setCheck(id, {status: cur === s ? '' : s}); }
});

// ---------- lightbox: full uncropped image, caption, credit
const lb = document.getElementById('lb');
let lbReturn = null;
function openLb(id, cap){
  const m = IMG[id]; if(!m) return;

  const im = document.getElementById('lbImg'); im.src = imgSrc(id); im.alt = cap || m.cap || '';

  lb.hidden = false; document.getElementById('lbClose').focus();
}
function closeLb(){ if(lb.hidden) return; lb.hidden = true; if(lbReturn && lbReturn.focus){ try { lbReturn.focus({preventScroll: true}); } catch(err){} } }
document.getElementById('lbClose').addEventListener('click', closeLb);

// ---------- mobile drawer
const side = document.getElementById('side'), menuBtn = document.getElementById('menuBtn'), scrim = document.getElementById('scrim');
function closeMenu(){ side.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); scrim.hidden = true; }
menuBtn.addEventListener('click', () => { const o = side.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', o ? 'true' : 'false'); scrim.hidden = !o; });
scrim.addEventListener('click', closeMenu);

// ---------- verification state (shared db when available, local fallback otherwise)
const STATE = {};
let DB = null, UID = null, MODE = 'pending', CANWRITE = null;
function lsGet(){ try { return JSON.parse(localStorage.getItem('bv-checks') || '{}'); } catch(e){ return {}; } }
function lsSet(){ try { localStorage.setItem('bv-checks', JSON.stringify(STATE)); } catch(e){} }
function fmtTime(iso){ try { const d = new Date(iso); return d.toLocaleString('vi-VN', {hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit'}); } catch(e){ return ''; } }
function paintItem(id){
  const el = document.getElementById('chk-' + id); if(!el) return;
  const s = STATE[id] || {};
  el.classList.remove('ok', 'no', 'unclear'); if(s.status) el.classList.add(s.status);
  el.querySelectorAll('.vbtns button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === s.status ? 'true' : 'false'));
  const ta = el.querySelector('textarea'); if(ta && document.activeElement !== ta) ta.value = s.note || '';
  el.querySelector('.vmeta').textContent = s.updatedAt ? 'Updated ' + fmtTime(s.updatedAt) : '';
}
function paintSummary(){
  const vals = Object.values(STATE);
  const set = (i, v) => { const e = document.getElementById(i); if(e) e.textContent = v; };
  set('vDone', vals.filter(v => v.status).length); set('vOk', vals.filter(v => v.status === 'ok').length); set('vNo', vals.filter(v => v.status === 'no').length); set('vUn', vals.filter(v => v.status === 'unclear').length);
  const a = document.getElementById('vAvail');
  if(a) a.textContent = MODE === 'db' ? 'Results are shared with everyone viewing this page.' : MODE === 'view' ? 'You have view access: you can see shared results but cannot mark them. Contributor access or higher is needed to mark results.' : MODE === 'local' ? 'Could not connect to the shared store. Results are saved on this device only.' : 'Connecting to the results store...';
}
function lockVerify(){ document.querySelectorAll('.vitem button, .vitem textarea').forEach(e => { e.disabled = true; }); }
function initVerifyUI(){ document.querySelectorAll('.vitem').forEach(el => paintItem(el.dataset.id)); if(MODE === 'view') lockVerify(); paintSummary(); }
async function setCheck(id, patch){
  if(MODE === 'view') return;
  const prev = STATE[id];
  const next = Object.assign({status: '', note: ''}, STATE[id] || {}, patch, {updatedAt: new Date().toISOString()});
  STATE[id] = next; paintItem(id); paintSummary();
  if(MODE === 'db' && DB){
    const body = {status: next.status || '', note: next.note || '', updatedAt: next.updatedAt, by: UID || ''};
    const ref = DB.collection('checks').doc(id);
    try { await ref.set(body); }
    catch(err){
      const c = err && err.code;
      if(c === 'invalid_argument'){
        // refused write: this viewer cannot write shared data, so undo and go read-only
        MODE = 'view'; if(prev) STATE[id] = prev; else delete STATE[id];
        paintItem(id); lockVerify(); paintSummary();
      } else if(c === 'unavailable'){
        setTimeout(() => { ref.set(body).catch(() => lsSet()); }, 600 + Math.random() * 900);
      } else { lsSet(); }
    }
  } else { lsSet(); }
}
(async function initStore(){
  try { DB = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch(e){ DB = null; }
  try { const u = window.claude && window.claude.use ? await window.claude.use('user') : null; UID = u ? await u.id() : null; CANWRITE = u && u.can ? await u.can('data.write') : null; } catch(e){ UID = null; }
  if(DB){
    MODE = CANWRITE === false ? 'view' : 'db';
    DB.collection('checks').onSnapshot(snap => {
      snap.docs.forEach(d => { const v = d.data(); if(v) STATE[d.id] = v; });
      if(CUR === 'verify') initVerifyUI();
    }, err => { MODE = 'local'; Object.assign(STATE, lsGet()); if(CUR === 'verify') initVerifyUI(); });
  } else {
    MODE = 'local'; Object.assign(STATE, lsGet());
  }
  if(CUR === 'verify') initVerifyUI();
})();

route();
})();
</script>
